# =============================================================================
# OSHAL Continuous Integration Pipeline
# =============================================================================
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial CI pipeline — lint, typecheck, test, build, security scan
# 2 | maintainer@emeraldcoastsystemsgroup.com   | Realigned to the repo-root layout (app moved out of control-plane/OSHAL); point Docker at Dockerfile.oshal / Dockerfile.bot
# 3 | maintainer@emeraldcoastsystemsgroup.com   | Give the Test job Postgres + Redis service containers and wire the e2e webServer to them (DATABASE_URL/REDIS_URL/RUN_MIGRATIONS), so DB-dependent Playwright specs run instead of timing out against a DB-less server.
# 4 | maintainer@emeraldcoastsystemsgroup.com   | Per-push CI is unaffordable at this repo's push cadence (50+ pushes/day x ~45 hosted-runner job-minutes/run blew through the free private-repo minutes; operator decision 2026-07-08): run HOURLY DURING BUSINESS HOURS instead of on every push. PRs still gate. Docker-image publish conditions widened from event==push to any non-PR run on main so the scheduled run still ships images.
# 5 | maintainer@emeraldcoastsystemsgroup.com   | Operator decision 2026-07-09: ONCE A DAY, not hourly. ~45 job-min/day (~1,350/month) fits inside the 2,000 free private-repo minutes, so daily CI costs $0 once the billing block is cleared.
# 6 | maintainer@emeraldcoastsystemsgroup.com   | Drop the "Build bot image" step: Dockerfile.bot is the March-era slim-worker image that predates the single-image design (CLAUDE.md: Dockerfile.oshal + BOT_RUNTIME) — it COPYs vite.config.js (repo moved to .ts) so it cannot build, nothing ships it, and its only live reference is docker-compose.swarm-local.yml on the stale deploy track (BACKLOG "deploy.yml deploys to the runner"). Surfaced by run 29044270678, the first run to ever reach this job.
# 7 | maintainer@emeraldcoastsystemsgroup.com   | Security Scan: free ~20GB of preinstalled runner toolchains before building — the image build + Trivy's uncompressed export overflow the ~14GB a stock runner has free (run 29045378356: "no space left on device" inside the Trivy export, not a CVE finding).
# 8 | maintainer@emeraldcoastsystemsgroup.com   | RE-ENABLED after the billing hold was paid (operator decision 2026-07-09), but MANUAL-ONLY: dropped the daily `schedule:` cron and never added a `push:` trigger. Automatic/per-push runs are what burned the free minutes; this repo pushes to main 50+ times/day. CI now runs ONLY on an explicit "Run workflow" (workflow_dispatch) — "run it when needed" — plus the PR gate (which effectively never fires on this trunk-based repo). Zero automatic billing.
# =============================================================================

name: CI

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MANUAL-ONLY. DO NOT ADD `push:`, `schedule:` OR `pull_request:`.          │
# │                                                                           │
# │ Hosted-runner minutes are the account's binding constraint — not compute, │
# │ not correctness. This has been reverted for cost TWICE: per-push CI       │
# │ (2026-07-08), then an "hourly during business hours" cron that quietly    │
# │ ran ~55 full pipelines a week on the public mirror until 2026-07-14 and   │
# │ took the account to zero.                                                 │
# │                                                                           │
# │ The ONE automated gate is LOCAL and free: scripts/ci-local.sh, a single   │
# │ nightly run on the operator's machine. Builds and deploys are local too.  │
# │ Enforced by scripts/check-workflow-triggers.js (a ci-local gate + a unit  │
# │ test), which FAILS if any workflow here regains an automatic trigger.     │
# │                                                                           │
# │ Need a hosted-runner result? Actions tab → "Run workflow".                │
# └───────────────────────────────────────────────────────────────────────────┘
on:
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  REGISTRY: ${{ secrets.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}/oshal-control-plane

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Format Check ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        # eslint 9 flat config (eslint.config.mjs) — drop the removed --ext flag. Advisory: exits
        # non-zero while the FSD deep-import / no-console counters are non-zero (warnings-first).
        run: npx eslint src --max-warnings 0 || echo "ESLint reported findings (advisory until governance counts reach 0)"

  # ── TypeScript Type Check ──────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript compiler
        run: npm run typecheck

      # ADR-090 D8: the kernel's skills are its package-facing API. tsconfig.server.json excludes
      # src/features/**, so a skill reaches the image ONLY via the build anchor's re-export — drop
      # one and every installed package importing that skill fails at MOUNT, not at compile. This
      # is the source half; ci-local.sh additionally probes the built image.
      - name: Kernel-skill contract (ADR-090 D8)
        run: npx ts-node -r tsconfig-paths/register --transpile-only scripts/check-kernel-skills.ts

      # ADR-115: the swarm repo ships the platform; applications ship from the store repo. ADR-085
      # carved 21 app surfaces out of core and nothing stopped one walking back in. The public core
      # trunk is app-free BY CONSTRUCTION — catching a re-mixed app at publish time is too late.
      - name: Repo separation (ADR-115)
        run: node scripts/check-repo-separation.js

  # ── Test Suite ─────────────────────────────────────────────────────────────
  # Runs the fast vitest unit suite (no DB) AND the Playwright e2e. The e2e boots
  # src/app/server.ts, which needs a real Postgres (many specs read/write tickets,
  # chat_tasks, workspaces, …) and tolerates Redis. Provide both as service
  # containers so the DB-dependent specs actually run instead of timing out.
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oshal
          POSTGRES_USER: oshal
          POSTGRES_PASSWORD: oshal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oshal -d oshal"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (vitest — src/*.test.ts + tests/unit, ~30s, no Docker/DB)
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs the GREEN RATCHET set only — the curated e2e specs proven all-passing under
      # this env (tests/e2e-green-suite.txt). The full ~132-spec suite is not green yet
      # (docs/BACKLOG.md "CI Playwright e2e suite normalization"); specs join the list as
      # they are fixed so the gate ratchets up and cannot silently regress. One retry
      # absorbs infra flake without hiding a real failure in a curated-green set.
      #
      # The Playwright webServer (playwright.config.ts) inherits this env when it boots
      # src/app/server.ts. Point it at the service containers; RUN_MIGRATIONS applies the
      # full migration chain on boot so every table the e2e touches exists (RLS is inert
      # under the oshal superuser here — fine for CI). FORCE_LLM_PROVIDER=noop is also
      # defaulted in the Playwright config, set here too for the direct path.
      - name: Run e2e (green ratchet set)
        run: npm run test:e2e:green -- --retries=1
        env:
          MOCK_OIDC: "true"
          CI: "true"
          DATABASE_URL: postgresql://oshal:oshal@localhost:5432/oshal
          REDIS_URL: redis://localhost:6379
          RUN_MIGRATIONS: "true"
          FORCE_LLM_PROVIDER: noop
          # Boot the webServer on 3456 (not the mock-default 4458): ~18 e2e specs hardcode
          # http://localhost:3456, so on 4458 they hit CONNECTION_REFUSED. 4458 exists only to
          # avoid clashing with the operator's live runtime on 3456 — irrelevant in CI. Aligning
          # here lets the hardcoded-3456 and PLAYWRIGHT_PORT-respecting specs share one origin.
          PLAYWRIGHT_PORT: "3456"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ── Build Docker Images ────────────────────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build control-plane image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.oshal
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # NOTE: no "Build bot image" step. Dockerfile.bot (slim worker) predates the
      # single-image design — Dockerfile.oshal is THE image, BOT_RUNTIME picks the process
      # (CLAUDE.md "Two runtimes, one image"). It doesn't build (COPYs vite.config.js;
      # repo has vite.config.ts) and only the stale swarm-local deploy track references it.

  # ── Security Scan ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - uses: actions/checkout@v4

      # The image build + Trivy's uncompressed export need ~12GB of headroom; a stock
      # ubuntu runner has ~14GB free and run 29045378356 died on "no space left on
      # device". Drop the preinstalled toolchains this job never uses (~20GB back).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.oshal
          push: false
          load: true
          tags: oshal-scan:latest

      # The gate covers what WE can fix: OS packages + the app's own dependency trees.
      # /usr/local/bin holds vendored third-party release binaries (kubectl, helm, argocd,
      # yq, ...) installed at their LATEST versions — their CVEs are compiled into
      # upstream's builds (Go toolchain lag) and nothing in this repo can fix them; gating
      # on them means the daily run reds on upstream's schedule (run 29046620210: 21 of 33
      # HIGHs were argocd/kubectl/helm internals with no newer release to bump to).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: oshal-scan:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /usr/local/bin

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  # ── Secret Scan ────────────────────────────────────────────────────────────
  # Working-tree credential scan (gitleaks). The .gitleaks.toml allowlist covers
  # the known non-secrets (examples, test fixtures, localhost dev defaults), so a
  # REAL new secret fails this job while proven placeholders do not. History is
  # handled separately by the fresh-baseline publish strategy, so we scan --no-git.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (working tree, tuned allowlist)
        run: |
          docker run --rm -v "$PWD:/scan:ro" zricethezav/gitleaks:latest \
            detect --source=/scan --no-git --config=/scan/.gitleaks.toml --redact --verbose

  # ── Quickstart Smoke ───────────────────────────────────────────────────────
  # Proves the zero-keys quickstart (noop harness + MOCK_OIDC) actually boots and
  # serves, the way a first-time visitor runs it. Boots only the API + its data
  # stores (no worker bots), asserts /health, /cockpit/, and a ticket create.
  quickstart-smoke:
    name: Quickstart Smoke (noop + MOCK_OIDC)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Build OSHAL image (tag must match compose default)
        run: docker build -f Dockerfile.oshal -t oshal-bot:latest .

      - name: Boot API + datastores (noop, mock auth)
        run: |
          FORCE_LLM_PROVIDER=noop MOCK_OIDC=true \
            docker compose -f docker-compose.oshal-local.yml up -d oshal-api

      # Probes run INSIDE the api container (curl localhost:5000) rather than over
      # the host->published-port hop, which can flake on some Docker setups even
      # when the app is healthy. We're testing the app boots/serves/migrates, not
      # the port mapping.
      - name: Wait for API health
        run: |
          for i in $(seq 1 48); do
            code=$(docker compose -f docker-compose.oshal-local.yml exec -T oshal-api \
              curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5000/health || true)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::API did not become healthy in time"; exit 1

      - name: Smoke /cockpit/ route + ticket create (assert a real ticket id)
        run: |
          cc=$(docker compose -f docker-compose.oshal-local.yml exec -T oshal-api \
            curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/cockpit/)
          echo "cockpit HTTP $cc"
          case "$cc" in
            200|302) ;;
            *) echo "::error::/cockpit/ route did not serve or redirect cleanly"; exit 1 ;;
          esac
          resp=$(docker compose -f docker-compose.oshal-local.yml exec -T oshal-api \
            curl -s -X POST http://localhost:5000/api/tickets \
            -H "Content-Type: application/json" \
            -d '{"title":"ci smoke","description":"echo path check","ticketType":"build"}')
          echo "ticket response: $(echo "$resp" | head -c 200)"
          echo "$resp" | grep -q '"ticketId"' \
            || { echo "::error::ticket create did not return a ticketId (regression?)"; exit 1; }

      # Guards the fresh-DB migration-chain regression: if migrations abort, the
      # swarm_applications table is missing/empty and zero apps load.
      - name: Assert migration chain completed (swarm apps loaded)
        run: |
          n=$(docker compose -f docker-compose.oshal-local.yml exec -T oshal-db \
            psql -U oshal -d oshal -tAc "SELECT count(*) FROM swarm_applications" 2>/dev/null | tr -d '[:space:]')
          echo "swarm_applications rows: ${n:-<none>}"
          [ "${n:-0}" -gt 0 ] \
            || { echo "::error::swarm_applications empty — migration chain did not complete on a fresh DB"; exit 1; }

      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f docker-compose.oshal-local.yml logs --tail=150 oshal-api

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.oshal-local.yml down -v
