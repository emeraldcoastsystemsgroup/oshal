provider: rawg
displayName: RAWG
version: 1.0.0
baseUrl: https://api.rawg.io/api
auth:
  type: apiKeyQuery
  param: key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: games
    tool: rawg-games
    method: GET
    path: /games
    query:
      search: '{q}'
  - name: game
    tool: rawg-game
    method: GET
    path: /games/{id}
  - name: genres
    tool: rawg-genres
    method: GET
    path: /genres
  - name: platforms
    tool: rawg-platforms
    method: GET
    path: /platforms
metadata:
  description: "RAWG — reads games, game, genres, platforms via api.rawg.io. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Games"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/rawg.io.ico
