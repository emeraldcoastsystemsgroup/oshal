provider: qdrant
displayName: Qdrant
version: 1.0.0
baseUrl: ${env:QDRANT_BASE_URL:-https://your-cluster.qdrant.io}
auth:
  type: apiKeyHeader
  header: api-key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: collections
    tool: qdrant-collections
    method: GET
    path: /collections
  - name: collection
    tool: qdrant-collection
    method: GET
    path: /collections/{collection_name}
  - name: aliases
    tool: qdrant-aliases
    method: GET
    path: /aliases
metadata:
  description: "Qdrant — reads collections, collection, aliases via your-cluster.qdrant.io. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Data infrastructure"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/qdrant.tech.ico
