provider: dwolla
displayName: Dwolla
version: 1.0.0
baseUrl: https://api.dwolla.com
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: customers
    tool: dwolla-customers
    method: GET
    path: /customers
    query:
      limit: '{limit}'
  - name: customer
    tool: dwolla-customer
    method: GET
    path: /customers/{customerId}
  - name: funding-sources
    tool: dwolla-funding-sources
    method: GET
    path: /customers/{customerId}/funding-sources
  - name: transfers
    tool: dwolla-transfers
    method: GET
    path: /customers/{customerId}/transfers
    query:
      limit: '{limit}'
metadata:
  description: "Dwolla — reads customers, customer, funding sources, transfers via api.dwolla.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Payments"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/dwolla.com.ico
