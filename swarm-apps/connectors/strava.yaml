provider: strava
displayName: Strava
version: 1.0.0
baseUrl: https://www.strava.com/api/v3
auth:
  type: oauth2
rateLimit:
  burst: 5
  perSecond: 5
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: me
    tool: strava-me
    method: GET
    path: /athlete
  - name: activities
    tool: strava-activities
    method: GET
    path: /athlete/activities
    query:
      per_page: '100'
      page: '{page}'
  - name: stats
    tool: strava-stats
    method: GET
    path: /athletes/{athleteId}/stats
metadata:
  description: "Strava — reads me, activities, stats via www.strava.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Health"
  icon: strava
  iconTitle: Strava
  iconSource: simple-icons
  iconVerified: true
