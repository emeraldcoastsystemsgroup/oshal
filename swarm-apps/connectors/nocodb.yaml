provider: nocodb
displayName: NocoDB
version: 1.0.0
baseUrl: ${env:NOCODB_BASE_URL:-https://your-nocodb.example.com}/api/v2
auth:
  type: apiKeyHeader
  header: xc-token
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: bases
    tool: nocodb-bases
    method: GET
    path: /meta/bases
  - name: tables
    tool: nocodb-tables
    method: GET
    path: /meta/bases/{baseId}/tables
  - name: records
    tool: nocodb-records
    method: GET
    path: /tables/{tableId}/records
metadata:
  description: "NocoDB — reads bases, tables, records via your-nocodb.example.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Productivity"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/nocodb.com.ico
