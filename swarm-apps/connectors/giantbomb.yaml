provider: giantbomb
displayName: Giant Bomb
version: 1.0.0
baseUrl: https://www.giantbomb.com/api
auth:
  type: apiKeyQuery
  param: api_key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: games
    tool: giantbomb-games
    method: GET
    path: /games
    query:
      format: json
      filter: '{q}'
  - name: game
    tool: giantbomb-game
    method: GET
    path: /game/{guid}
    query:
      format: json
  - name: characters
    tool: giantbomb-characters
    method: GET
    path: /characters
    query:
      format: json
metadata:
  description: "Giant Bomb — reads games, game, characters via www.giantbomb.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Games"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/giantbomb.com.ico
