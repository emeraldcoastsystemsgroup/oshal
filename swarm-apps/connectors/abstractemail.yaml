provider: abstractemail
displayName: Abstract Email Validation
version: 1.0.0
baseUrl: https://emailvalidation.abstractapi.com/v1
auth:
  type: apiKeyQuery
  param: api_key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: validate
    tool: abstractemail-validate
    method: GET
    path: /
    query:
      email: '{email}'
metadata:
  description: "Abstract Email Validation — reads validate via emailvalidation.abstractapi.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Email"
  icon: abstract
  iconTitle: Abstract
  iconSource: simple-icons
  iconVerified: true
