# Clockify — time-tracking workspaces, projects, and current user via X-Api-Key header.
provider: clockify
displayName: Clockify
version: 1.0.0
baseUrl: https://api.clockify.me/api/v1
auth:
  type: apiKeyHeader
  header: X-Api-Key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: workspaces
    tool: clockify-workspaces
    method: GET
    path: /workspaces
  - name: projects
    tool: clockify-projects
    method: GET
    path: '/workspaces/{workspaceId}/projects'
  - name: user
    tool: clockify-user
    method: GET
    path: /user
metadata:
  description: "Clockify — reads workspaces, projects, user via api.clockify.me. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Productivity"
  icon: clockify
  iconTitle: Clockify
  iconSource: simple-icons
  iconVerified: true
