provider: wakatime
displayName: WakaTime
version: 1.0.0
baseUrl: https://api.wakatime.com/api/v1
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: me
    tool: wakatime-me
    method: GET
    path: /users/current
  - name: summaries
    tool: wakatime-summaries
    method: GET
    path: /users/current/summaries
    query:
      start: '{start}'
      end: '{end}'
  - name: stats
    tool: wakatime-stats
    method: GET
    path: /users/current/stats/{range}
  - name: projects
    tool: wakatime-projects
    method: GET
    path: /users/current/projects
metadata:
  icon: wakatime
  iconTitle: WakaTime
  iconSource: simple-icons
  iconVerified: true
