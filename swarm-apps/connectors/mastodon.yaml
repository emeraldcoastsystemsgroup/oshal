# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Add the write-capable actions tier (marketing engine, ADR-133): create-status posts to the connected account via the confirm-gated, audited connector-writes rail. Read resources untouched; version 1.0.0 -> 1.1.0.
# -----------------------------------------------------------------------------

provider: mastodon
displayName: Mastodon
version: 1.1.0
baseUrl: ${env:MASTODON_BASE_URL:-https://mastodon.social}/api/v1
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: verify-credentials
    tool: mastodon-verify-credentials
    method: GET
    path: /accounts/verify_credentials
  - name: home-timeline
    tool: mastodon-home-timeline
    method: GET
    path: /timelines/home
    query:
      - max_id
      - since_id
      - min_id
      - limit
  - name: public-timeline
    tool: mastodon-public-timeline
    method: GET
    path: /timelines/public
    query:
      - local
      - remote
      - only_media
      - max_id
      - limit
  - name: notifications
    tool: mastodon-notifications
    method: GET
    path: /notifications
    query:
      - max_id
      - since_id
      - min_id
      - limit
      - types
  - name: account
    tool: mastodon-account
    method: GET
    path: /accounts/{id}
  - name: account-statuses
    tool: mastodon-account-statuses
    method: GET
    path: /accounts/{id}/statuses
    query:
      - max_id
      - since_id
      - limit
      - exclude_replies
# Write-capable action tier (connector-writes). Real documented endpoint:
# https://docs.joinmastodon.org/methods/statuses/#create
actions:
  - name: create-status
    method: POST
    urlTemplate: /statuses
    riskLevel: high
    approvalRequired: true
    description: >-
      Publish a status (toot) to the connected account's timeline (POST /statuses).
      High risk: it is public and immediate — the confirm gate is not optional.
    paramsSchema:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          minLength: 1
          maxLength: 500
          description: Status text (500-character mastodon.social default limit).
metadata:
  description: "Mastodon — reads verify credentials, home timeline, public timeline, notifications and 2 more via mastodon.social. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Social"
  icon: mastodon
  iconTitle: Mastodon
  iconSource: simple-icons
  iconVerified: true
