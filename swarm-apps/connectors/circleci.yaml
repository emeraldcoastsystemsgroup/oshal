provider: circleci
displayName: CircleCI
version: 1.0.0
baseUrl: https://circleci.com/api/v2
auth:
  type: apiKeyHeader
  header: Circle-Token
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
pagination:
  strategy: offset
  param: page-token
  pageSize: 20
  nextField: next_page_token
  itemsField: items
resources:
  - name: me
    tool: circleci-me
    method: GET
    path: /me
  - name: project
    tool: circleci-project
    method: GET
    path: /project/{projectSlug}
  - name: pipelines
    tool: circleci-pipelines
    method: GET
    path: /project/{projectSlug}/pipeline
    paginate: true
  - name: pipeline
    tool: circleci-pipeline
    method: GET
    path: /pipeline/{pipelineId}
  - name: pipeline-workflows
    tool: circleci-pipeline-workflows
    method: GET
    path: /pipeline/{pipelineId}/workflow
    paginate: true
  - name: workflow-jobs
    tool: circleci-workflow-jobs
    method: GET
    path: /workflow/{workflowId}/job
    paginate: true
metadata:
  description: "CircleCI — reads me, project, pipelines, pipeline and 2 more via circleci.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Developer tools"
  icon: circleci
  iconTitle: CircleCI
  iconSource: simple-icons
  iconVerified: true
