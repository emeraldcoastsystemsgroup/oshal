provider: calendly
displayName: Calendly
version: 1.0.0
baseUrl: https://api.calendly.com
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
pagination:
  strategy: cursor
  param: page_token
  nextField: pagination.next_page_token
  itemsField: collection
resources:
  - name: me
    tool: calendly-me
    method: GET
    path: /users/me
  - name: list-events
    tool: calendly-list-events
    method: GET
    path: /scheduled_events
    query:
      user: '{user}'
      count: '100'
    paginate: true
  - name: list-event-types
    tool: calendly-list-event-types
    method: GET
    path: /event_types
    query:
      user: '{user}'
      count: '100'
    paginate: true
metadata:
  description: "Read the connected Calendly user, their scheduled events, and event types."
  category: "Scheduling"
  icon: calendly
  iconTitle: Calendly
  iconSource: simple-icons
  iconVerified: true
