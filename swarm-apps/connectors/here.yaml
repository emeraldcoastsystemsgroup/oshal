provider: here
displayName: HERE
version: 1.0.0
baseUrl: https://geocode.search.hereapi.com/v1
auth:
  type: apiKeyQuery
  param: apiKey
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: geocode
    tool: here-geocode
    method: GET
    path: /geocode
    query:
      q: '{q}'
  - name: discover
    tool: here-discover
    method: GET
    path: /discover
    query:
      q: '{q}'
metadata:
  description: "HERE — reads geocode, discover via geocode.search.hereapi.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Location & maps"
  icon: here
  iconTitle: HERE
  iconSource: simple-icons
  iconVerified: true
