provider: coinpaprika
displayName: Coinpaprika
version: 1.0.0
baseUrl: https://api.coinpaprika.com/v1
auth:
  type: none
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: coins
    tool: coinpaprika-coins
    method: GET
    path: /coins
  - name: tickers
    tool: coinpaprika-tickers
    method: GET
    path: /tickers
    query:
      quotes: '{quotes}'
  - name: ticker-detail
    tool: coinpaprika-ticker-detail
    method: GET
    path: /tickers/{coin_id}
    query:
      quotes: '{quotes}'
metadata:
  description: "Coinpaprika — reads coins, tickers, ticker detail via api.coinpaprika.com. No credential needed — a public API."
  category: "Finance"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/coinpaprika.com.ico
