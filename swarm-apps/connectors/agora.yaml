# Agora RESTful API — basic auth (Customer Key : Customer Secret); query channel state and list projects.
provider: agora
displayName: Agora
version: 1.0.0
baseUrl: https://api.agora.io/dev/v1
auth:
  type: basic
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: channel
    tool: agora-channel
    method: GET
    path: "/channel/{appid}"
    query:
      page_no: "{page_no}"
      page_size: "{page_size}"
  - name: projects
    tool: agora-projects
    method: GET
    path: /projects
metadata:
  description: "Agora — reads channel, projects via api.agora.io. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Communications"
  icon: agora
  iconTitle: Agora
  iconSource: simple-icons
  iconVerified: true
