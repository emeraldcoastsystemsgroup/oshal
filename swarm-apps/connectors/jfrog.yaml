provider: jfrog
displayName: JFrog Artifactory
version: 1.0.0
baseUrl: ${env:JFROG_BASE_URL:-https://yourcompany.jfrog.io}/artifactory/api
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: ping
    tool: jfrog-ping
    method: GET
    path: /system/ping
  - name: version
    tool: jfrog-version
    method: GET
    path: /system/version
  - name: repositories
    tool: jfrog-repositories
    method: GET
    path: /repositories
  - name: repository
    tool: jfrog-repository
    method: GET
    path: /repositories/{repoKey}
  - name: storage-info
    tool: jfrog-storage-info
    method: GET
    path: /storageinfo
  - name: builds
    tool: jfrog-builds
    method: GET
    path: /build
metadata:
  description: "JFrog Artifactory — reads ping, version, repositories, repository and 2 more via yourcompany.jfrog.io. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Developer tools"
  icon: jfrog
  iconTitle: JFrog
  iconSource: simple-icons
  iconVerified: true
