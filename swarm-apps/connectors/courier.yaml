provider: courier
displayName: Courier
version: 1.0.0
baseUrl: https://api.courier.com
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: messages
    tool: courier-messages
    method: GET
    path: /messages
    query:
      cursor: '{cursor}'
  - name: lists
    tool: courier-lists
    method: GET
    path: /lists
    query:
      cursor: '{cursor}'
  - name: brands
    tool: courier-brands
    method: GET
    path: /brands
    query:
      cursor: '{cursor}'
metadata:
  description: "Courier — reads messages, lists, brands via api.courier.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Communications"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/courier.com.ico
