provider: numbersapi
displayName: Numbers API
version: 1.0.0
baseUrl: https://numbersapi.com
auth:
  type: none
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: number-fact
    tool: numbersapi-number-fact
    method: GET
    path: /{number}
    query: {}
  - name: math-fact
    tool: numbersapi-math-fact
    method: GET
    path: /{number}/math
    query: {}
  - name: random-trivia
    tool: numbersapi-random-trivia
    method: GET
    path: /random/trivia
    query: {}
metadata:
  description: "Numbers API — reads number fact, math fact, random trivia via numbersapi.com. No credential needed — a public API."
  category: "Knowledge"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/numbersapi.com.ico
