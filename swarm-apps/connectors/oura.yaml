provider: oura
displayName: Oura Ring
version: 1.0.0
baseUrl: https://api.ouraring.com/v2
auth:
  type: oauth2
rateLimit:
  burst: 5
  perSecond: 5
retry:
  maxRetries: 3
  honorRetryAfter: true
pagination:
  strategy: cursor
  param: next_token
  nextField: next_token
  itemsField: data
resources:
  - name: me
    tool: oura-me
    method: GET
    path: /usercollection/personal_info
  - name: daily-activity
    tool: oura-daily-activity
    method: GET
    path: /usercollection/daily_activity
    query:
      start_date: '{start}'
      end_date: '{end}'
    paginate: true
  - name: sleep
    tool: oura-sleep
    method: GET
    path: /usercollection/daily_sleep
    query:
      start_date: '{start}'
      end_date: '{end}'
    paginate: true
metadata:
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/ouraring.com.ico
