provider: mongodbatlas
displayName: MongoDB Atlas
version: 1.0.0
baseUrl: https://cloud.mongodb.com/api/atlas/v2
auth:
  type: basic
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: groups
    tool: mongodbatlas-groups
    method: GET
    path: /groups
  - name: group
    tool: mongodbatlas-group
    method: GET
    path: /groups/{groupId}
  - name: clusters
    tool: mongodbatlas-clusters
    method: GET
    path: /groups/{groupId}/clusters
  - name: cluster
    tool: mongodbatlas-cluster
    method: GET
    path: /groups/{groupId}/clusters/{clusterName}
metadata:
  description: "MongoDB Atlas — reads groups, group, clusters, cluster via cloud.mongodb.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Data infrastructure"
  icon: mongodb
  iconTitle: MongoDB
  iconSource: simple-icons
  iconVerified: true
