provider: apivideo
displayName: api.video
version: 1.0.0
baseUrl: https://ws.api.video
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: videos
    tool: apivideo-videos
    method: GET
    path: /videos
    query:
      currentPage: '{currentPage}'
      pageSize: '{pageSize}'
  - name: video
    tool: apivideo-video
    method: GET
    path: /videos/{videoId}
  - name: live-streams
    tool: apivideo-live-streams
    method: GET
    path: /live-streams
    query:
      currentPage: '{currentPage}'
      pageSize: '{pageSize}'
metadata:
  description: "api.video — reads videos, video, live streams via ws.api.video. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Media"
  iconSource: favicon-fallback
  iconVerified: false
  iconUrl: https://icons.duckduckgo.com/ip3/api.video.ico
