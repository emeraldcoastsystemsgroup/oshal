provider: gusto
displayName: Gusto
version: 1.0.0
baseUrl: https://api.gusto.com/v1
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: me
    tool: gusto-me
    method: GET
    path: /me
  - name: employees
    tool: gusto-employees
    method: GET
    path: /companies/{companyId}/employees
  - name: payrolls
    tool: gusto-payrolls
    method: GET
    path: /companies/{companyId}/payrolls
metadata:
  description: "Gusto — reads me, employees, payrolls via api.gusto.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "HR & recruiting"
  icon: gusto
  iconTitle: Gusto
  iconSource: simple-icons
  iconVerified: true
