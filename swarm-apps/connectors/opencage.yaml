provider: opencage
displayName: OpenCage
version: 1.0.0
baseUrl: https://api.opencagedata.com/geocode/v1
auth:
  type: apiKeyQuery
  param: key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: geocode
    tool: opencage-geocode
    method: GET
    path: /json
    query:
      q: '{q}'
metadata:
  description: "OpenCage — reads geocode via api.opencagedata.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Location & maps"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/opencagedata.com.ico
