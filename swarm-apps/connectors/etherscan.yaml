provider: etherscan
displayName: Etherscan
version: 1.0.0
baseUrl: https://api.etherscan.io/api
auth:
  type: apiKeyQuery
  param: apikey
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: account-balance
    tool: etherscan-account-balance
    method: GET
    path: /
    query:
      module: account
      action: balance
      address: '{address}'
      tag: latest
  - name: account-txlist
    tool: etherscan-account-txlist
    method: GET
    path: /
    query:
      module: account
      action: txlist
      address: '{address}'
      sort: desc
  - name: token-balance
    tool: etherscan-token-balance
    method: GET
    path: /
    query:
      module: account
      action: tokenbalance
      contractaddress: '{contractaddress}'
      address: '{address}'
      tag: latest
  - name: gas-oracle
    tool: etherscan-gas-oracle
    method: GET
    path: /
    query:
      module: gastracker
      action: gasoracle
metadata:
  description: "Etherscan — reads account balance, account txlist, token balance, gas oracle via api.etherscan.io. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Finance"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/etherscan.io.ico
