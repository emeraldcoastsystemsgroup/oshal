provider: toggl
displayName: Toggl Track
version: 1.0.0
baseUrl: https://api.track.toggl.com/api/v9
auth:
  type: basic
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: me
    tool: toggl-me
    method: GET
    path: /me
  - name: workspaces
    tool: toggl-workspaces
    method: GET
    path: /workspaces
  - name: projects
    tool: toggl-projects
    method: GET
    path: /me/projects
  - name: time-entries
    tool: toggl-time-entries
    method: GET
    path: /me/time_entries
metadata:
  description: "Toggl Track — reads me, workspaces, projects, time entries via api.track.toggl.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Productivity"
  icon: toggltrack
  iconTitle: Toggl Track
  iconSource: simple-icons
  iconVerified: true
