provider: webflow
displayName: Webflow
version: 1.0.0
baseUrl: https://api.webflow.com/v2
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: sites
    tool: webflow-sites
    method: GET
    path: /sites
  - name: site-collections
    tool: webflow-site-collections
    method: GET
    path: /sites/{site_id}/collections
  - name: collection-items
    tool: webflow-collection-items
    method: GET
    path: /collections/{collection_id}/items
metadata:
  description: "Webflow — reads sites, site collections, collection items via api.webflow.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "Commerce"
  icon: webflow
  iconTitle: Webflow
  iconSource: simple-icons
  iconVerified: true
