provider: faire
displayName: Faire
version: 1.0.0
baseUrl: https://www.faire.com/external-api/v2
auth:
  type: apiKeyHeader
  header: X-FAIRE-ACCESS-TOKEN
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: orders
    tool: faire-orders
    method: GET
    path: /orders
  - name: products
    tool: faire-products
    method: GET
    path: /products
metadata:
  description: "Faire — reads orders, products via www.faire.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Commerce"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/faire.com.ico
