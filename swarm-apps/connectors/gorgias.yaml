provider: gorgias
displayName: Gorgias
version: 1.0.0
baseUrl: https://${env:GORGIAS_DOMAIN:-yourdomain}.gorgias.com/api
auth:
  type: basic
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: tickets
    tool: gorgias-tickets
    method: GET
    path: /tickets
  - name: ticket
    tool: gorgias-ticket
    method: GET
    path: /tickets/{id}
  - name: ticket-messages
    tool: gorgias-ticket-messages
    method: GET
    path: /tickets/{id}/messages
  - name: customers
    tool: gorgias-customers
    method: GET
    path: /customers
  - name: users
    tool: gorgias-users
    method: GET
    path: /users
metadata:
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/gorgias.com.ico
