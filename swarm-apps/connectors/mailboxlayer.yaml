provider: mailboxlayer
displayName: mailboxlayer
version: 1.0.0
baseUrl: https://apilayer.net/api
auth:
  type: apiKeyQuery
  param: access_key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: check
    tool: mailboxlayer-check
    method: GET
    path: /check
    query:
      email: '{email}'
metadata:
  description: "mailboxlayer — reads check via apilayer.net. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Email"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/apilayer.net.ico
