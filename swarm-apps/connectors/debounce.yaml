provider: debounce
displayName: DeBounce
version: 1.0.0
baseUrl: https://api.debounce.io/v1
auth:
  type: apiKeyQuery
  param: api
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: validate
    tool: debounce-validate
    method: GET
    path: /
    query:
      email: '{email}'
metadata:
  description: "DeBounce — reads validate via api.debounce.io. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "Email"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/debounce.io.ico
