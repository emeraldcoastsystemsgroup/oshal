provider: guardian
displayName: The Guardian
version: 1.0.0
baseUrl: https://content.guardianapis.com
auth:
  type: apiKeyQuery
  param: api-key
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: search
    tool: guardian-search
    method: GET
    path: /search
    query:
      q: '{q}'
  - name: sections
    tool: guardian-sections
    method: GET
    path: /sections
    query: {}
  - name: tags
    tool: guardian-tags
    method: GET
    path: /tags
    query:
      q: '{q}'
metadata:
  description: "The Guardian — reads search, sections, tags via content.guardianapis.com. Bring your own key: each user pastes their own token, held per-user in the encrypted connection store."
  category: "News"
  icon: theguardian
  iconTitle: The Guardian
  iconSource: simple-icons
  iconVerified: true
