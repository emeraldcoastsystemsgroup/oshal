provider: cohere
displayName: Cohere
version: 1.0.0
baseUrl: https://api.cohere.com/v1
auth:
  type: oauth2
rateLimit:
  burst: 10
  perSecond: 10
retry:
  maxRetries: 3
  honorRetryAfter: true
resources:
  - name: models
    tool: cohere-models
    method: GET
    path: /models
  - name: model
    tool: cohere-model
    method: GET
    path: /models/{model}
metadata:
  description: "Cohere — reads models, model via api.cohere.com. OAuth: the operator registers the provider app once, then each user connects their own account."
  category: "AI"
  iconVerified: false
  iconSource: favicon-fallback
  iconUrl: https://icons.duckduckgo.com/ip3/cohere.com.ico
