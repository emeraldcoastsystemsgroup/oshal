# ─────────────────────────────────────────────────────────────────────────────
# Swarm Application Manifest — Intelligent Processing
# Framework: OSHAL (see the swarm-application-manifests ADR in docs/adr/)
#
# The streamlined self-healing queue. Prometheus alerts about the swarm's own
# containers land here as `intelligent-processing` tickets (kept distinct from
# generic `incident` so they filter cleanly in the cockpit), park in BACKLOG for
# operator triage, and — once promoted to approved — flow through the framework's
# incident-rca pipeline: RCA bots root-cause and PROPOSE a fix. Executing a
# container remediation is an operator act on the profile-gated self-healing
# node (see the BOTS note below — K4 keeps that identity OUT of this manifest).
#
# Intake path: Prometheus → Alertmanager → POST /api/alerts/alertmanager
#   (see src/app/routes/alertmanager-routes.ts, docs/runbooks/self-healing-monitoring.md)
# ─────────────────────────────────────────────────────────────────────────────

name: intelligent-processing
suite: ai-engineering   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Intelligent Processing
description: >-
  Streamlined self-healing alert queue. Prometheus self-monitoring alerts open
  intelligent-processing tickets that park in backlog until an operator promotes
  them, then run the incident-rca pipeline (RCA proposes a fix; executing a
  container remediation is an operator act on the profile-gated self-healing
  node, outside this manifest).
version: 1.0.0
status: active

ticketType: intelligent-processing

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES — this queue reuses bots that already run; it mints none.
#
# `intelligent-operations` owns the incident bots this pipeline hands work to
# (rca-specialist, incident-response-bot, incident-remediation-bot). Naming it
# here makes the relationship explicit and blocks its removal while this queue is
# active, so the pipeline can never be left pointing at bots that no longer load.
# The bots themselves are referenced BY NAME in the workflow block below —
# re-declaring them would fork the identity and split their cost attribution.
#
# connectors: [] — the pipeline reads the swarm's own metrics endpoints and its
# own database. It holds no third-party credential, so it offers none.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  apps:
    - intelligent-operations
  tools: []
  connectors: []

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW — reuse the framework's 3-phase incident-rca pipeline. The worker
# (rca-specialist) and reviewer (queue-bot) are framework bots already active via
# intelligent-operations.yaml, so they are referenced by name here, not
# re-declared (same pattern as the other explicit-load variants).
# ─────────────────────────────────────────────────────────────────────────────
workflow:
  name: Intelligent Processing RCA Pipeline
  pipeline: incident-rca
  workerBot: rca-specialist
  reviewerBot: queue-bot
  phases:
    - worker
    - review
    - revision
  maxRevisions: 2

# ─────────────────────────────────────────────────────────────────────────────
# BOTS — NONE (K4 strict form, kernel audit 2026-07-29). self-healing-bot — the
# docker-socket bot, root-equivalent on the host — is deliberately NOT declared
# by any kernel-resident manifest anymore: a customer box loading the kernel
# manifests must never be handed a host-privileged identity. Its container stays
# in docker-compose.oshal-local.yml behind `profiles: incident, extras` (opt-in,
# never in a default bring-up) under its OWN agentId a0000000-…-000000000056
# (K3 — the old a0…030 was a three-way collision with codex-packer). The
# remediation leg's future home is an app-store package (BACKLOG). Guarded by
# tests/unit/kernel-manifest-docker-bot-guard.spec.ts, which fails if ANY
# kernel manifest declares a docker-capable bot again.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# UI — a dedicated ribbon screen for the queue. Served standalone at
# /intelligent-processing (registered in server.ts), grouped by alert fingerprint
# with a Status filter (default Backlog) and a Promote-to-approval action. Also
# reachable via the native cockpit tickets view filtered to Type = Intelligent
# Processing, or focus mode /cockpit?app=intelligent-processing.
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: intelligent-processing-queue
      label: Intelligent Processing
      icon: codicon-pulse
      iframeUrl: /intelligent-processing
      section: top
    # Live pipeline state, read-only for any authenticated user: scrape targets,
    # what is firing now and where each alert reached in the pipeline, open
    # incidents worst-first, the funnel with its per-lane counts, and the
    # autonomy ladder. Answers "is anything even watching" before anything else
    # on the page means anything.
    - toolName: operations-system-health
      label: System Health
      icon: codicon-pulse
      iframeUrl: /system-health
      section: top
    # Claim rules, live dedup-key preview, topology and replay. Operator-gated —
    # the ribbon entry is cosmetic; every backing route enforces it server-side.
    - toolName: operations-pipeline-admin
      label: Pipeline Admin
      icon: codicon-settings-gear
      iframeUrl: /alert-pipeline-admin
      section: bottom

ribbon:
  hideFrameworkItems: []
  defaultView: tickets
