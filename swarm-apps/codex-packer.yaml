# ─────────────────────────────────────────────────────────────────────────────
# Swarm Application Manifest — codex-packer
#
# codex-packer is a chat persona that interviews the operator (8 questions) and
# emits a single-purpose packed bot (persona YAML + app manifest into
# deployed-apps/ + optional kb/ corpus), staged for the operator's ONE-CLICK
# injection in the Forge surface (which calls POST /api/swarm/apps/load —
# the bot never calls it itself).
#
# Pattern: the repo's architectural default — ONE bot per ticket-type workflow, with the full
# quality contract embedded in the persona rather than in an external reviewer. No multi-bot
# agentic flow. See CLAUDE.md "Architectural default: one bot per ticket-type workflow" and
# docs/building-a-bot.md; docs/apps/skill-import.md (ADR-089) is the non-interactive sibling that
# emits the SAME persona+manifest shape from an external SKILL.md.
# (The original lineage was an internal codex pack that stayed in the private archive at the
# ADR-115 cutover — deliberately not referenced here, because a pointer into a tree this repo
# does not contain is a dead pointer.)
#
# This app is itself a chat surface, not a ticket pipeline. The codex-packer
# bot runs inline in the api container (container: oshal-api in the registry).
# ─────────────────────────────────────────────────────────────────────────────

name: codex-packer
suite: ai-engineering   # ADR-097: primary catalog shelf (tools keep their own category:)
displayName: Bot Forge
description: >-
  The bot factory. Describe a task you want automated; the Forge agent interviews
  you (task / inputs / outputs / success criteria / corpus / external services /
  trigger & side effects / PII + tool whitelist) and packs a fully-encapsulated
  single-purpose bot — persona + app manifest + tools + knowledge — staged for
  your one-click Inject. No redeploy. It appears in the gallery and at
  /cockpit/?app=<your-new-bot> immediately, live on your connectors.
version: 1.1.0
status: active

# The right-rail chat agent IS the packer — it interviews + emits + injects while the
# Forge surface (below) shows the resulting bots going live in the swarm.
chatBot: codex-packer

bots:
  - agentId: a0000000-0000-0000-0000-000000000030
    name: codex-packer
    persona: ai-lab/bot-personas/codex-packer.yaml
    role: bot-authoring/factory
    capabilities:
      - bot-authoring
      - persona-design
      - manifest-emission
      - interview-driven-spec
      - codex-packing
    selectorDescriptor: >-
      Select this bot when the user wants to build, pack, or inject a new bot or
      swarm app from an interview. Use codex-packer for "create a bot", "build a
      swarm", "turn this process into an app", manifest emission, persona design,
      and pack deployment requests.
    routingKeywords:
      - codex-packer
      - bot forge
      - create a bot
      - build a swarm
      - pack an app
      - manifest emission
      - persona design
      - interview-driven spec
      - swarm app injection

# ─────────────────────────────────────────────────────────────────────────────
# UI SURFACE — the Forge front door: gallery + lifecycle over the live swarm
# (served by createForgeRoutes at GET /api/forge; calls the /api/swarm/apps API).
# ─────────────────────────────────────────────────────────────────────────────
ui:
  static:
    - toolName: forge
      label: Forge
      icon: codicon codicon-tools
      iframeUrl: /api/forge
      section: top

# ─────────────────────────────────────────────────────────────────────────────
# SURFACE-BRIDGE ALLOW-LIST — "the packer chat lives in the right rail, the Forge is the view" IS
# the chat↔surface bridge pattern, so declare it. These are the ONLY oshal-surface-bridge ops the
# cockpit relay carries between the packer (chat rail) and the Forge surface (/api/forge). Absence
# would relay NOTHING (fail-closed), which is what it did before this block existed.
#
# Every op below is one the Forge surface can ACTUALLY honor today (nothing aspirational):
#   render_options → the interview's answer choices as clickable cards in the bridge dock
#   propose        → a confirm/cancel card ("pack it now?"), the click returns as `submit`
#   notify         → a banner in the dock's notices host
#   set_content    → the dock's `packer-note` region (the running spec the packer echoes back)
#   custom         → ONE name is handled: {"name":"refresh"} re-polls the live + pending trays
#                    immediately after the packer writes a manifest (instead of waiting for the
#                    15s poll). Any other custom name is logged and ignored by the surface.
#   select/submit/event → the inbound half: a card click, a confirm, and the surface's own
#                    `app-injected` signal after a successful one-click inject.
# NOT declared, deliberately: set_field / field_change (the Forge has no bot-drivable form field —
# its only input is a <input type=file>, which cannot be set programmatically) and navigate (moving
# the operator's cockpit is not the packer's job).
surface:
  ops:
    - render_options
    - propose
    - notify
    - set_content
    - custom
    - select
    - submit
    - event

# Focused chrome: the packer chat lives in the right rail, the Forge is the view.
ribbon:
  hideFrameworkItems:
    - chat
    - calendar
    - addressbook
    - dashboard
    - logs
    - operations
  defaultView: forge
