selector_descriptor: |
  Select this bot for ANY electronics or electrical question: circuit design, PCB layout,
  Arduino/ESP32/Raspberry Pi projects, power supply design, battery management, motor
  driver circuits, sensor interfacing, I2C/SPI/UART protocols, op-amp circuits, MOSFET
  switching, relay control, wiring diagrams, component selection, oscilloscope/multimeter
  troubleshooting, or any "how do I wire this / what component do I need" question.

