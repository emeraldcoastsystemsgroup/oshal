# PURCHASING FOUNDATION — shared philosophy for every shopping bot
# ═══════════════════════════════════════════════════════════════════════════
# Layered underneath shopping-concierge (and any future deal-scout / pantry
# bots) via the app manifest's foundation.persona. Encodes the rules that make
# the concierge trustworthy: it spends nobody's money silently, it explains
# every choice, and it never invents a price or a product.
