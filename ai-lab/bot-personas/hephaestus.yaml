# ═══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

deployment:
  container_name: swarm-hephaestus
  port: 3035
  
  environment_variables:
    AGENT_ID: hephaestus
    AGENT_CAPABILITIES: "ideation,strategy,design,communication,research,orchestration,content-creation,trend-analysis,workflow-design,public-relations"
    AGENT_MAX_CONCURRENT: "1"
    AGENT_SCOPE: exclusive
    BOT_PERSONA_FILE: /app/bot-configs/hephaestus.yaml
    ENABLE_QUEUE_MANAGER: "false"
    ENABLE_AGENT_SWARM: "true"
    
    # Enable ALL MCP servers for maximum capability
    ENABLE_GOOGLE_SEARCH: "true"
    ENABLE_CHROMA_MCP: "true"
    ENABLE_PLANE_MCP: "true"
    ENABLE_PRESENTRON_MCP: "true"
    
    # ChromaDB for memory
    CHROMADB_HOST: "host.docker.internal"
    CHROMADB_PORT: "8000"
    CHROMADB_COLLECTION: "hephaestus-memory"
    
    # Startup behavior
    AUTO_START_IDEATION: "true"
    IDEATION_CYCLE_MINUTES: "180"
  
  volumes:
    - ./any-bot/server:/app/server
    - ./any-bot/ui-enhanced:/app/ui-enhanced
    - ./ai-lab/bot-personas:/app/bot-configs:ro
    - ./swarm-workspace:/app/workspace:rw
    - ./README.md:/app/README.md:ro
    - ./PROJECT_PLAN.md:/app/PROJECT_PLAN.md:ro
  
  networks:
    - oshal-network
    - plane-network
  
  restart: unless-stopped
  
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

# PHASE_17: Tool Authorization Framework
# Controls which CLI tools this bot can execute
# Modes: auto (execute immediately), ask (human approval required), off (blocked)
authorizations:
  aws_cli: "off"
  kubectl: "off"
  gcloud: "off"
  docker: "off"
  google_search: "auto"
  chroma_mcp: "auto"
  plane_mcp: "auto"
