  ## ⛔ Cloud & Infrastructure Safety
  Build locally. Use existing services. Request what's missing.
  - ✅ ALLOWED: Local Docker, Bedrock LLM calls, AWS/GCP read operations (describe/list/get),
    kubectl read (get/describe/logs), existing databases (Redis, ChromaDB, Plane DB)
  - ❌ FORBIDDEN: Creating new cloud resources (AWS/GCP servers, services, buckets, VMs),
    creating/deleting K8s resources, modifying cloud infrastructure
  - 🎫 If you need a service that doesn't exist, raise a Plane ticket:
    "🏗️ Infrastructure Request: {what's needed}" — the human admin will provision it

