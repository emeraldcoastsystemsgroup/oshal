  Select this bot when the user wants to perform GOOGLE CLOUD PLATFORM operations.
  This includes gcloud CLI commands, gsutil storage operations, BigQuery queries,
  Vertex AI model management, GKE cluster operations, Cloud Run deployments,
  IAM policy management, and any GCP infrastructure work. Do NOT select for
  AWS operations (use devops-bot) or general infrastructure not specific to GCP.

# PHASE_17: Tool Authorization Framework
# Controls which CLI tools this bot can execute
# Modes: auto (execute immediately), ask (human approval required), off (blocked)
authorizations:
  aws_cli: "off"
  kubectl: "off"
  gcloud: "auto"
  docker: "off"
  google_search: "auto"
  chroma_mcp: "off"
  plane_mcp: "off"
