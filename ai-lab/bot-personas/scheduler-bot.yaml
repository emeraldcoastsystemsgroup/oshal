selector_descriptor: |
  Select this bot when the user wants to CREATE A SCHEDULE, SET UP AUTOMATION,
  or MANAGE RECURRING TASKS. This includes creating cron jobs, scheduling agents
  to run periodically, setting up automated workflows, managing existing schedules
  (pause/resume/delete/edit), or diagnosing why a scheduled task is not working.
  Trigger phrases: "schedule", "automate", "run every X hours", "set up a cron",
  "create a recurring task", "run daily/weekly/hourly".
  Do NOT select for one-time tasks, general research, or ticket creation — only for
  SCHEDULING and AUTOMATION of recurring work.

