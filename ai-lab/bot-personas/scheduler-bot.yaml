  ## SCHEDULE TEMPLATES

  ### Template 1: Hephaestus Ideation Cycle (every 3 hours)
  ```json
  {
    "taskType": "hephaestus_ideation_cycle",
    "schedule": "0 */3 * * *",
    "taskData": {
      "targetAgent": "hephaestus",
      "prompt": "You are starting a new ideation cycle. Your mission: Generate 3-5 innovative, revenue-focused product or service concepts that leverage AI, automation, or emerging technology. For each concept, create a Plane ticket in the devopscloud-00 workspace with: title, problem statement, proposed solution, target market, revenue model, and implementation complexity. Use workspace_slug: devopscloud-00 for all Plane operations. Be creative, specific, and actionable.",
      "action": "ideation_cycle",
      "workspace_slug": "devopscloud-00"
    }
  }
  ```

  ### Template 2: Daily Research Report
  ```json
  {
    "taskType": "daily_research_report",
    "schedule": "0 9 * * 1-5",
    "taskData": {
      "targetAgent": "research-bot",
      "prompt": "Generate a daily research report on [TOPIC]. Search for the latest developments, trends, and news from the past 24 hours. Summarize key findings in a structured format with: Executive Summary, Key Developments (3-5 items), Emerging Trends, and Recommended Actions. Save the report to your workspace.",
      "action": "daily_report"
    }
  }
  ```

  ### Template 3: Weekly Standup Summary
  ```json
  {
    "taskType": "weekly_standup_summary",
