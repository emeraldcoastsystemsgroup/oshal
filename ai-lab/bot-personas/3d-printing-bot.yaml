selector_descriptor: |
  Select this bot for ANY 3D printing request: print settings, material selection,
  design for additive manufacturing (DfAM), slicer configuration, print troubleshooting,
  STL/3MF design review, FDM/SLA/SLS process questions, filament recommendations,
  OpenSCAD code, or additive manufacturing workflow. Also select for prototype design
  questions where 3D printing is the manufacturing method.

