<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <!-- Shared portal palette: resolve before paint and follow the parent or saved choice live. -->
  <link rel="stylesheet" href="/shared/ui/css/surface-themes.css">
  <script src="/shared/ui/js/surface-theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queue Dashboard</title>
  <style>
    body { margin: 0; padding: 20px; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { margin: 0; font-size: 24px; color: var(--text-primary); }
    .header .badge { background: color-mix(in srgb, var(--accent-primary) 20%, transparent); color: var(--accent-primary); padding: 4px 12px; border-radius: 999px; font-size: 12px; }
    .status-banner { margin: 0 0 14px; color: var(--text-secondary); font-size: 13px; }
    .status-banner[data-tone='success'] { color: var(--status-success); }
    .status-banner[data-tone='warning'] { color: var(--status-warning); }
    .status-banner[data-tone='error'] { color: var(--status-error); }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent-primary); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: color-mix(in srgb, var(--accent-primary) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent-primary) 15%, transparent); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent-primary); }
    .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    th { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .status-active { background: color-mix(in srgb, var(--status-success) 15%, transparent); color: var(--status-success); }
    .status-idle { background: color-mix(in srgb, var(--status-warning) 15%, transparent); color: var(--status-warning); }
    .status-error { background: color-mix(in srgb, var(--status-error) 15%, transparent); color: var(--status-error); }
    .refresh-btn { background: color-mix(in srgb, var(--accent-primary) 20%, transparent); color: var(--accent-primary); border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .refresh-btn:hover { background: color-mix(in srgb, var(--accent-primary) 30%, transparent); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
    .loading { text-align: center; padding: 20px; color: var(--text-secondary); }
  </style>

  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
  <div class="header">
    <h1>Queue Dashboard</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge">OSHAL</span>
      <button id="refreshButton" class="refresh-btn" type="button">Refresh</button>
    </div>
  </div>

  <p id="statusBanner" class="status-banner" data-tone="info">Loading queue dashboard...</p>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="value" id="statScheduler">—</div><div class="label">Scheduler Status</div></div>
    <div class="stat-card"><div class="value" id="statTickets">—</div><div class="label">Active Tickets</div></div>
    <div class="stat-card"><div class="value" id="statSchedules">—</div><div class="label">Active Schedules</div></div>
    <div class="stat-card"><div class="value" id="statWorkItems">—</div><div class="label">Work Items</div></div>
    <div class="stat-card"><div class="value" id="statRuns">—</div><div class="label">Recent Runs</div></div>
  </div>

  <div class="card">
    <h2>Active Tickets</h2>
    <div id="ticketsTable" data-testid="queue-dashboard-tickets"><div class="loading">Loading tickets...</div></div>
  </div>

  <div class="card">
    <h2>Active Schedules</h2>
    <div id="schedulesTable" data-testid="queue-dashboard-schedules"><div class="loading">Loading schedules...</div></div>
  </div>

  <div class="card">
    <h2>Recent Work Items</h2>
    <div id="workItemsTable" data-testid="queue-dashboard-work-items"><div class="loading">Loading work items...</div></div>
  </div>

  <div class="card">
    <h2>Recent Runs</h2>
    <div id="runsTable" data-testid="queue-dashboard-runs"><div class="loading">Loading runs...</div></div>
  </div>

  <script type="module" src="/queue-dashboard/queue-dashboard.js"></script>
</body>
</html>
