<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queue Dashboard</title>
  <style>
    body { margin: 0; padding: 20px; background: #0f1020; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { margin: 0; font-size: 24px; color: #fff; }
    .header .badge { background: rgba(139, 92, 246, 0.2); color: var(--accent-primary); padding: 4px 12px; border-radius: 999px; font-size: 12px; }
    .status-banner { margin: 0 0 14px; color: rgba(224, 224, 224, 0.84); font-size: 13px; }
    .status-banner[data-tone='success'] { color: #4ade80; }
    .status-banner[data-tone='warning'] { color: var(--status-warning); }
    .status-banner[data-tone='error'] { color: var(--status-error); }
    .card { background: rgba(18, 18, 30, 0.72); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent-primary); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.15); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent-primary); }
    .stat-card .label { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 13px; }
    th { color: rgba(255, 255, 255, 0.5); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .status-active { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status-idle { background: rgba(251, 191, 36, 0.15); color: var(--status-warning); }
    .status-error { background: rgba(239, 68, 68, 0.15); color: var(--status-error); }
    .refresh-btn { background: rgba(139, 92, 246, 0.2); color: var(--accent-primary); border: 1px solid rgba(139, 92, 246, 0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .refresh-btn:hover { background: rgba(139, 92, 246, 0.3); }
    .empty-state { text-align: center; padding: 40px 20px; color: rgba(255, 255, 255, 0.4); }
    .loading { text-align: center; padding: 20px; color: rgba(255, 255, 255, 0.4); }
  </style>
  <link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
  <script>
    // Inherit the cockpit's active theme (same-origin localStorage). Theme tokens are scoped to
    // the data-theme attribute, never to :root, so the default above is required too (BUG-12).
    try { var t = localStorage.getItem('cockpit-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
  <div class="header">
    <h1>Queue Dashboard</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge">OSHAL</span>
      <button id="refreshButton" class="refresh-btn" type="button">Refresh</button>
    </div>
  </div>

  <p id="statusBanner" class="status-banner" data-tone="info">Loading queue dashboard...</p>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="value" id="statScheduler">—</div><div class="label">Scheduler Status</div></div>
    <div class="stat-card"><div class="value" id="statTickets">—</div><div class="label">Active Tickets</div></div>
    <div class="stat-card"><div class="value" id="statSchedules">—</div><div class="label">Active Schedules</div></div>
    <div class="stat-card"><div class="value" id="statWorkItems">—</div><div class="label">Work Items</div></div>
    <div class="stat-card"><div class="value" id="statRuns">—</div><div class="label">Recent Runs</div></div>
  </div>

  <div class="card">
    <h2>Active Tickets</h2>
    <div id="ticketsTable" data-testid="queue-dashboard-tickets"><div class="loading">Loading tickets...</div></div>
  </div>

  <div class="card">
    <h2>Active Schedules</h2>
    <div id="schedulesTable" data-testid="queue-dashboard-schedules"><div class="loading">Loading schedules...</div></div>
  </div>

  <div class="card">
    <h2>Recent Work Items</h2>
    <div id="workItemsTable" data-testid="queue-dashboard-work-items"><div class="loading">Loading work items...</div></div>
  </div>

  <div class="card">
    <h2>Recent Runs</h2>
    <div id="runsTable" data-testid="queue-dashboard-runs"><div class="loading">Loading runs...</div></div>
  </div>

  <script type="module" src="/queue-dashboard/queue-dashboard.js"></script>
</body>
</html>
