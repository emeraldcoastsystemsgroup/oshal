  CHANGE LOG
  -----------------------------------------------------------------------------
  SEQ                 | AUTHOR                      | DESCRIPTION
  -----------------------------------------------------------------------------
  1 | maintainer@emeraldcoastsystemsgroup.com   | Added a direct native bot-config entry point from the cockpit right-side chat toolbar
  2 | maintainer@emeraldcoastsystemsgroup.com   | Replaced the cockpit right-side placeholder chat body with an embedded native /chat workspace so the rail exposes the real OSHAL chat surface
  3 | maintainer@emeraldcoastsystemsgroup.com   | Added explicit cockpit right-rail workspace actions so settings, switch framework, RAG, and Presentron are reachable without hunting inside the embedded iframe
  4 | maintainer@emeraldcoastsystemsgroup.com   | Defaulted the cockpit bot selector to the persisted personal-assistant UUID so the embedded native chat boots against a real bot instead of the legacy assistant placeholder
  5 | maintainer@emeraldcoastsystemsgroup.com   | Converted right-rail workspace controls to icon-first actions and tightened bot-config deep links to bot-scoped settings anchors
  6 | maintainer@emeraldcoastsystemsgroup.com   | Removed the unwired header search field during the header-audit pass so the top bar only exposes working controls
  7 | maintainer@emeraldcoastsystemsgroup.com   | Clarified the header gear action as Quick Settings so operators can distinguish it from the fuller ribbon Settings screen
  8 | maintainer@emeraldcoastsystemsgroup.com   | Added cockpit workspace-focus mode so header RAG and Presentron actions can expand the bot workspace instead of being trapped in the narrow right rail
  9 | maintainer@emeraldcoastsystemsgroup.com   | Added workspace-focus width toggle so operators can widen heavyweight tool launches without leaving cockpit
  10 | maintainer@emeraldcoastsystemsgroup.com   | Added draggable workspace-focus edge resizing so heavy header tools can be manually resized inside cockpit
  11 | maintainer@emeraldcoastsystemsgroup.com   | Removed duplicate header history/settings buttons and converted login into a single profile-access control
  12 | maintainer@emeraldcoastsystemsgroup.com   | ADR-044 Phase 1: made the cockpit an installable PWA — manifest, theme-color + Apple meta, touch icons, and service-worker registration (offline app shell)
  13 | maintainer@emeraldcoastsystemsgroup.com   | Removed the right-edge chat-expand tab — the Jarvis orb is the single assistant affordance; the rail now only opens contextually
  14 | maintainer@emeraldcoastsystemsgroup.com   | Load the surface-bridge relay (js/surface-bridge-relay.js) — the shell-mediated postMessage relay between the focused app's surface iframe and the chat rail (the browser wiring over features/surface-bridge). Additive alongside the app-navigate + oshal-cockpit-* dialects.
  15 | maintainer@emeraldcoastsystemsgroup.com   | Leave embedded chat unloaded until an enabled profile restores it, preventing hidden task creation for immersive apps.
  16 | maintainer@emeraldcoastsystemsgroup.com   | Login double-refresh fix: the service-worker controllerchange reload also fired on the FIRST claim of a fresh page (everything had just come from the network — the reload repainted identical bytes). Now reload only when an UPDATED worker replaces one that was already controlling the page. Also: zen (full-window focus) mode — header arrows-out button + floating exit button hide all cockpit chrome so the active surface gets the whole window (Esc restores).
-->

  <!-- ADR-044 Phase 1: installable PWA (Add to Home Screen / App-shell offline) -->
  <!-- use-credentials: the manifest route is OIDC-gated; without this the browser fetches it
       cookie-less (spec default) and the auth catch-all returns 401, breaking PWA install. -->
  <link rel="manifest" href="/cockpit/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#0b0f17">

  <link rel="icon" type="image/png" sizes="192x192" href="/cockpit/icons/icon-192.png">
  <script>
    // Config-driven branding — replaces hardcoded OSHAL with SERVICE_DISPLAY_NAME
    // Also propagates MOCK_OIDC flag so the login modal shows the mock login form
    // and auto-populates a dev session token so the cockpit works without a real IdP.
    fetch('/api/branding').then(r=>r.json()).then(b=>{
      window.__BRAND=b;
      // When a swarm app is focused (?app=/?profile=), RibbonNav owns the title +
      // logo (it rebrands to the app's displayName, e.g. "Little Monsters").
      // Skip the framework default here so we don't clobber the focused-app brand.
      var __focusedApp=/[?&](app|profile)=/.test(window.location.search);
      if(!__focusedApp){
        document.title=b.displayName+' Cockpit';
        const logo=document.querySelector('.logo-text');
        if(logo) logo.textContent=b.displayName+' Cockpit';
      }
      if(b.mockOidc) {
        window.MOCK_OIDC = true;
        localStorage.setItem('MOCK_OIDC', 'true');
        // Auto-populate a mock session so the profile modal shows "logged in"
        // without requiring the user to click through the mock login form every time.
        if(!localStorage.getItem('oshal_access_token')) {
          localStorage.setItem('oshal_access_token', 'mock-token-local-dev');
          localStorage.setItem('oshal_user', 'Dev User');
        }
      }
    }).catch(()=>{});
  </script>

  <!-- ADR-044 Phase 1: register the PWA service worker (scope /cockpit/). Failures are
       non-fatal — the cockpit works identically without it; only offline/install is lost. -->
  <script>
    // ── Auth-lapse guard ──────────────────────────────────────────────────────
    // The cockpit's assets + APIs are OIDC-gated. When the session expires, gated requests either
    // 302 to the IdP (assets) or 401 (APIs) — left alone, that paints a half-broken cockpit. This
    // restarts ONE clean full-page login. Two signals converge here: the service worker posts
    // 'oshal-auth-required' when a gated asset/navigation 302s; and a fetch interceptor catches a
    // same-origin /api 401. Loop-guarded: fires once, never when already heading to /login.
    var oshalReloggingIn = false;
    function oshalForceRelogin() {
      if (oshalReloggingIn || /^\/login(\/|$)/.test(location.pathname)) { return; }
      oshalReloggingIn = true;
      // Carry the current surface (notably /cockpit/?app=<name>) through the relogin —
      // a bare /login forgets it and strands the user on the plain cockpit.
      location.href = '/login?returnTo=' + encodeURIComponent(location.pathname + location.search);
    }
    (function () {
      var origFetch = window.fetch;
      if (typeof origFetch !== 'function') { return; }
      window.fetch = function () {
        return origFetch.apply(this, arguments).then(function (res) {
          try {
            if (res && res.status === 401 && new URL(res.url, location.origin).origin === location.origin) {
              oshalForceRelogin();
            }
          } catch (_) { /* opaque/no-url responses — ignore */ }
          return res;
        });
      };
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'oshal-auth-required') { oshalForceRelogin(); }
      });
      // When a new service worker version takes control (e.g. a CSS/shell update),
      // reload once so the page picks up the fresh precached assets instead of the
      // stale cache. Without this, a deployed UI change can stay invisible until the
      // user manually hard-refreshes twice. Guarded so it fires at most once.
      // FIRST-claim exception: controllerchange also fires when a worker claims a page
      // that had NO controller (fresh profile / cleared storage / first visit after
      // login). Every byte of that page just came from the network, so reloading only
      // repaints identical content — that was the "login refreshes twice" report.
      var oshalSwRefreshing = false;
      var oshalSwWasControlled = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!oshalSwWasControlled) { oshalSwWasControlled = true; return; }
        if (oshalSwRefreshing) return;
        oshalSwRefreshing = true;
        console.info('OSHAL cockpit: updated service worker took control — one reload for fresh shell assets');
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/cockpit/service-worker.js', { scope: '/cockpit/' })
          .catch(function (err) { console.warn('OSHAL PWA service worker registration failed', err); });
      });
    }
  </script>

<body>
  <!-- ═══ HEADER BAR ═══ -->
  <header class="header-bar">
    <div class="header-left">
      <button class="header-btn mobile-menu-btn" id="mobileMenuBtn" title="Menu" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>
        <span class="logo-text">OSHAL Cockpit</span>
      </div>
    </div>
    <div class="header-right">
      <button class="header-btn" id="zenModeBtn" title="Full-window focus — hide headers (Esc restores)" aria-label="Full-window focus">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button class="header-btn" id="ragBtn" title="Knowledge (RAG) — add & view swarm knowledge" aria-label="Knowledge (RAG)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="header-btn" id="themeToggle" title="Switch theme" aria-label="Switch theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="header-btn" id="agentsBtn" title="Agents — pick a bot to chat with" aria-label="Agents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      </button>
      <button class="header-btn" id="profileBtn" title="Profile & Access" aria-label="Profile & Access">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══ MAIN COCKPIT: [Ribbon 48px] [Main Content flex:1] [Chat Panel 320px] ═══ -->
  <main class="cockpit-body">
    <!-- Mobile menu backdrop (shown when the ribbon is open on a phone) -->
    <div id="ribbonBackdrop" class="ribbon-backdrop"></div>
    <!-- RIBBON NAV (far left) -->
    <div id="ribbonContainer"></div>

    <!-- MAIN CONTENT (center, switches based on ribbon) -->
    <section class="main-content" id="mainContent">
      <div class="loading-skeleton">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- RESIZE HANDLE: Main ↔ Chat -->
    <div class="panel-resize-handle" id="resizeChat"></div>

    <!-- CHAT PANEL (right, always visible) -->
    <aside class="chat-panel" id="chatPanel">
      <button
        class="workspace-focus-resize-handle hidden"
        id="workspaceFocusResizeHandle"
        type="button"
        title="Drag to resize the workspace focus stage"
        aria-label="Drag to resize the workspace focus stage"
      >
        <span class="workspace-focus-resize-grip" aria-hidden="true"></span>
      </button>
      <div class="panel-header">
        <div class="panel-title-stack">
          <span class="panel-title"><i class="ph ph-chat-circle-dots"></i> Chat</span>
          <span class="panel-kicker hidden" id="chatWorkspaceFocusLabel">Workspace focus</span>
        </div>
        <div class="panel-actions">
          <button class="btn-sm hidden" id="exitWorkspaceFocusBtn" type="button">Return</button>
          <button class="btn-sm hidden" id="toggleWorkspaceFocusWidthBtn" type="button">Wider</button>
          <button class="btn-sm" id="newChatBtn">New</button>
          <button class="btn-icon" id="toggleChat" title="Collapse">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <!-- Bot & Ticket Selectors -->
      <div class="chat-selectors">
        <select class="chat-select" id="botSelector" title="Select bot">
          <option value="">Choose a bot</option>
        </select>
      </div>
      <!-- CM-4: Workspace action buttons removed — duplicate of in-chat workspace controls. Bot dropdown + config icon is sufficient. -->
      <div class="chat-native-frame-shell" data-testid="cockpit-native-chat-shell">
        <iframe
          id="chatWorkspaceFrame"
          class="chat-native-frame"
          title="swarm bot workspace"
          src="about:blank"
          loading="lazy"
          allow="microphone"
        ></iframe>
      </div>
    </aside>
    <!-- No collapsed-rail reopen tab: the Jarvis orb (bottom-right, jarvis-orb.js) is the
         one persistent assistant affordance. The rail reopens contextually — "Chat with bot"
         from a ticket, workspace focus, or a live task in progress. -->
  </main>

  <!-- Zen-mode exit: the only chrome left when the cockpit headers are hidden. Semi-transparent
       so it doesn't compete with the surface; Esc does the same from the top document. -->
  <button id="zenExitBtn" class="zen-exit-btn hidden" title="Exit full-window focus (Esc)" aria-label="Exit full-window focus">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  </button>

  <!-- ═══ STATUS BAR ═══ -->
  <footer class="status-bar">
    <div class="status-item" title="Connection">
      <span class="status-dot online"></span>
      <span id="statusBots">-- bots</span>
    </div>
    <div class="status-item" title="Active Tickets">
      <i class="ph ph-ticket"></i>
      <span id="statusTickets">-- tickets</span>
    </div>
    <div class="status-item" title="Today's Cost">
      <i class="ph ph-currency-dollar"></i>
      <span id="statusCost">$--</span>
    </div>
    <div class="status-item" title="Queue Size">
      <i class="ph ph-hourglass"></i>
      <span id="statusQueue">Q: --</span>
    </div>
  </footer>

  <!-- ═══ MESH CHAT OVERLAY ═══ -->
  <div class="mesh-overlay hidden" id="meshOverlay">
    <div class="mesh-panel glass-card">
      <div class="mesh-panel-header">
        <span class="panel-title"><i class="ph ph-graph"></i> Mesh Chat</span>
        <button class="btn-icon" id="closeMeshOverlay">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mesh-panel-body">
        <div class="mesh-sidebar"><div id="conversationList"></div></div>
        <div class="mesh-main">
          <div id="meshMessagePanel"></div>
          <div id="meshParticipantList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL OVERLAY (reused for all popups) ═══ -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-container glass-card" id="modalContainer">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Modal</span>
        <button class="btn-icon modal-close" id="modalCloseBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ═══ TOAST CONTAINER ═══ -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js"></script>
  <!-- Surface-bridge relay: shell-mediated postMessage relay between the focused app's surface
       iframe and the chat rail (features/surface-bridge browser wiring). Self-boots only when an
       ?app= is focused; fail-closed on the manifest's surface.ops allow-list. -->
  <script type="module" src="js/surface-bridge-relay.js"></script>
  <!-- First-run appliance polish: model-state banner + getting-started strip. Self-contained,
       best-effort, and refresh-hot (no rebuild). Leaves the cockpit untouched on any failure. -->
  <script type="module" src="js/first-run.js"></script>
  <!-- Global Jarvis orb: the assistant on every page. Reveals super-admin Developer
       diagnostics when the server confirms the caller is a super-admin (ADR-077). -->
  <script src="js/jarvis-orb.js?v=2"></script>
</body>
</html>
