<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="/shared/ui/css/surface-glass.css">
<style>
  :root {
    --surface: #ffffff; --text: #14161c; --dim: #5b6472; --line: #d7dbe3;
    --panel: #f5f7fb; --accent: #2f5fb0; --bad: #b0362c; --workspace: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1b1e26; --text: #e8eaef; --dim: #9aa2b1; --line: #363b47;
      --panel: #232733; --accent: #6f9ce0; --bad: #e07a70; --workspace: #14161c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--workspace); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 32px)); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 32px 30px 26px;
  }
  .brand { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 4px; }
  input {
    width: 100%; padding: 9px 11px; font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 20px; padding: 10px; font-size: 14.5px; font-weight: 600;
    color: #fff; background: var(--accent); border: none; border-radius: 7px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .microsoft-link {
    width: 100%; min-height: 42px; display: flex; align-items: center; justify-content: center;
    gap: 10px; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; font-size: 14.5px; font-weight: 600; text-decoration: none;
  }
  .microsoft-link:hover { background: var(--panel); }
  .microsoft-mark {
    width: 16px; height: 16px; display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: 1px;
  }
  .microsoft-mark i:nth-child(1) { background: #f25022; }
  .microsoft-mark i:nth-child(2) { background: #7fba00; }
  .microsoft-mark i:nth-child(3) { background: #00a4ef; }
  .microsoft-mark i:nth-child(4) { background: #ffb900; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 2px; color: var(--dim); font-size: 11.5px; }
  .divider::before, .divider::after { content: ''; height: 1px; background: var(--line); flex: 1; }
  .error { color: var(--bad); font-size: 13px; margin: 12px 0 0; min-height: 1.4em; }
  .hidden { display: none; }
  .foot { color: var(--dim); font-size: 11.5px; margin-top: 18px; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand" id="brand">oshal</div>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Only invited accounts can sign in.</p>

    <div id="microsoftLoginPanel" class="hidden">
      <a id="microsoftLogin" class="microsoft-link" href="/login/microsoft?returnTo=%2F">
        <span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Continue with Microsoft</span>
      </a>
      <div class="divider"><span>or use your invited account</span></div>
    </div>

    <div id="nameRow" class="hidden">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name">
    </div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" autofocus>

    <div id="passwordRow">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" minlength="10">
    </div>

    <div id="confirmRow" class="hidden">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password">
    </div>

    <div id="codeRow" class="hidden">
      <label for="code">Six-digit code</label>
      <!-- inputmode + one-time-code lets a phone keyboard go numeric and lets password
           managers autofill the TOTP they already hold. -->
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="9" placeholder="123456">
      <p class="sub" id="codeHint">From your authenticator app. No app to hand? Enter one of your recovery codes.</p>
    </div>

    <button id="submit" type="submit">Sign in</button>
    <p class="error" id="error"></p>
    <p class="foot" id="foot">Forgot your password? <a href="#" id="forgot">Email me a reset link</a>.</p>
  </form>

<script>
(function () {
  'use strict';
  var bootstrapMode = false;
  var secondFactorNeeded = false;
  var forgotMode = false;
  var $ = function (id) { return document.getElementById(id); };

  function returnTo() {
    var raw = new URLSearchParams(location.search).get('returnTo') || '/';
    // Same-origin relative paths only — the server re-sanitizes, this is belt-and-braces.
    return (raw.charAt(0) === '/' && raw.slice(0, 2) !== '//') ? raw : '/';
  }

  fetch('/api/branding').then(function (r) { return r.json(); }).then(function (b) {
    if (b && b.displayName) { $('brand').textContent = b.displayName; document.title = 'Sign in - ' + b.displayName; }
  }).catch(function () {});

  function enterForgotMode(ev) {
    if (ev) ev.preventDefault();
    forgotMode = true;
    $('title').textContent = 'Reset your password';
    $('subtitle').textContent = "Enter your email and we'll send a one-time reset link.";
    $('passwordRow').classList.add('hidden');
    $('password').removeAttribute('required');
    $('codeRow').classList.add('hidden');
    $('submit').textContent = 'Email me a reset link';
    $('submit').disabled = false;
    $('error').textContent = '';
    $('microsoftLoginPanel').classList.add('hidden');
    $('foot').innerHTML = '<a href="/login">Back to sign in</a>. No email set up on this box? Ask your administrator for a new invitation link.';
    $('email').focus();
  }
  $('forgot').addEventListener('click', enterForgotMode);

  fetch('/api/local-auth/state').then(function (r) { return r.json(); }).then(function (s) {
    if (s && s.microsoftLogin === true && !s.bootstrapRequired && !forgotMode && location.pathname === '/login') {
      $('microsoftLogin').setAttribute('href', '/login/microsoft?returnTo=' + encodeURIComponent(returnTo()));
      $('microsoftLoginPanel').classList.remove('hidden');
    }
    if (s && s.bootstrapRequired && !forgotMode) {
      bootstrapMode = true;
      $('title').textContent = 'Create the administrator account';
      $('subtitle').textContent = 'This is a fresh install. The first account created here is the administrator.';
      $('nameRow').classList.remove('hidden');
      $('confirmRow').classList.remove('hidden');
      $('password').setAttribute('autocomplete', 'new-password');
      $('submit').textContent = 'Create account';
      $('foot').textContent = 'You will invite everyone else from the admin screen once you are in.';
    }
  }).catch(function () {});

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('error').textContent = '';
    if (forgotMode) {
      $('submit').disabled = true;
      fetch('/api/local-auth/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value }),
      }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
        .then(function (res) {
          if (res.status === 429) {
            $('submit').disabled = false;
            $('error').textContent = (res.data && res.data.error) || 'Too many requests. Wait a few minutes.';
            return;
          }
          // Deliberately the SAME message whatever the address was — no account probing here.
          $('subtitle').textContent = (res.data && res.data.message) || 'If that address has an account, a reset link is on its way.';
          $('submit').textContent = 'Link sent';
        })
        .catch(function () {
          $('submit').disabled = false;
          $('error').textContent = 'The server did not answer. Try again.';
        });
      return;
    }
    var password = $('password').value;
    if (password.length < 10) { $('error').textContent = 'Passwords need at least 10 characters.'; return; }
    if (bootstrapMode && password !== $('confirm').value) {
      $('error').textContent = 'The passwords do not match.'; return;
    }
    $('submit').disabled = true;
    var url = bootstrapMode ? '/api/local-auth/bootstrap' : '/api/local-auth/login';
    var body = bootstrapMode
      ? { email: $('email').value, name: $('name').value, password: password }
      : { email: $('email').value, password: password, returnTo: returnTo() };
    // The code only exists on the second pass. The password is re-sent with it rather than
    // held server-side as a half-authenticated state: one fewer stealable token, and the
    // failed-attempt counter keeps covering the whole credential.
    if (!bootstrapMode && secondFactorNeeded) body.code = $('code').value;
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
      .then(function (res) {
        var data = res.data || {};
        // Password accepted, one step to go. Not an error — say nothing red.
        if (res.status < 300 && data.ok === false && data.secondFactor === 'required') {
          secondFactorNeeded = true;
          $('codeRow').className = '';
          $('title').textContent = 'One more step';
          $('subtitle').textContent = 'Enter the code from your authenticator app.';
          $('submit').textContent = 'Verify';
          $('submit').disabled = false;
          $('code').focus();
          return;
        }
        if (res.status < 300 && data.ok !== false) {
          // An administrator can require the factor on an account that has not enrolled.
          // Send them to enrolment rather than refusing the login.
          if (data.enrolSecondFactor) { location.assign('/2fa?returnTo=' + encodeURIComponent(returnTo())); return; }
          location.assign(data.returnTo || returnTo());
          return;
        }
        $('submit').disabled = false;
        $('error').textContent = data.error || 'Sign-in failed. Try again.';
        if (secondFactorNeeded) { $('code').value = ''; $('code').focus(); }
      })
      .catch(function () {
        $('submit').disabled = false;
        $('error').textContent = 'The server did not answer. Try again.';
      });
  });
})();
</script>
</body>
</html>
