typedTools:
  - kind: typed
    name: swarm_authorization
    keywords:
      - access
      - permissions
      - authorization
      - roles
      - users
      - groups
      - application admin
      - directory mapping
    useWhen: Inspect application access or prepare a scoped role, restriction or directory mapping change.
    context: Select an exact principal, installed application and tenant from current permitted targets. Use the registered read tool for inspection and Access Administration to review and apply the exact preview. Keywords never grant authority.
artifactHandoff:
  kind: artifact-handoff
  keywords:
    - send
    - open
    - save
    - email
    - attach
    - print
  useWhen: The user has selected an existing artifact and requests a compatible destination.
  context: >-
    Use the live destination registry. Ask for clarification when the target is ambiguous. Never claim
    completion or bypass destination confirmation. This is a browser handoff, not a shell command.
