<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSHAL Swarm Debug Surface</title>
  <link rel="stylesheet" href="/shared/ui/css/design-system.css">
  <link rel="stylesheet" href="/cockpit/css/themes/midnight.css">
  <link rel="stylesheet" href="/cockpit/css/themes/daylight.css">
  <link rel="stylesheet" href="/cockpit/css/themes/ocean.css">
  <link rel="stylesheet" href="/cockpit/css/themes/sakura.css">
  <link rel="stylesheet" href="/cockpit/css/themes/forest.css">
  <link rel="stylesheet" href="/cockpit/css/themes/gray.css">
  <link rel="stylesheet" href="/cockpit/css/themes/black.css">
  <link rel="stylesheet" href="/cockpit/css/themes/light-blue.css">
  <link rel="stylesheet" href="/cockpit/css/themes/aurora.css">
  <link rel="stylesheet" href="/cockpit/css/themes/graphite.css">
  <link rel="stylesheet" href="/cockpit/css/themes/amber.css">
  <style>
    /* Tell browser to use dark-mode native widgets (select dropdowns, scrollbars, etc.) */
    html {
      color-scheme: dark;
    }

    /* Override design-system body overflow for this scrollable page */
    body {
      overflow: auto;
      height: auto;
      min-height: 100vh;
    }

    /* Ensure native <option> elements are readable in dark theme */
    .select option {
      background: var(--bg-secondary, #23262f);
      color: var(--text-primary, #f4f4f6);
    }

    #chat-root {
      width: 100%;
      min-height: 100vh;
    }

    /* Page-level layout: 2-panel side-by-side */
    .swarm-debug-layout {
      display: flex;
      gap: 24px;
      padding: 24px;
      min-height: 100vh;
    }
    .chat-column {
      flex: 1;
      min-width: 400px;
    }
    .debug-column {
      width: 480px;
      flex-shrink: 0;
    }

    /* Embedded chat iframe — full height, no border */
    .chat-iframe {
      width: 100%;
      height: 100vh;
      border: none;
      border-radius: 12px;
    }

    /* Chat messages area sizing (kept for standalone use) */
    .chat-messages {
      min-height: 300px;
      max-height: 400px;
    }

    /* 2-column control grid for debug panel */
    .control-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Error notice block */
    .error-notice {
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 69, 58, 0.1);
      border: 1px solid var(--status-error);
      color: var(--status-error);
    }

    /* Feed container with scroll */
    .debug-feed {
      max-height: 120px;
      overflow-y: auto;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* Disabled button state (not in design system) */
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    @media (max-width: 640px) {
      /* Collapse two-panel side-by-side into single column */
      .swarm-debug-layout {
        flex-direction: column;
        padding: 12px;
        gap: 16px;
      }

      /* Remove fixed min-width so chat column fits the viewport */
      .chat-column {
        min-width: 0;
        width: 100%;
      }

      /* Make debug panel full-width instead of fixed 480px */
      .debug-column {
        width: 100%;
        flex-shrink: 1;
      }

      /* Shrink iframe to a reasonable mobile height instead of 100vh */
      .chat-iframe {
        height: 60vh;
      }

      /* Collapse 2-col button grid to single column */
      .control-grid-2col {
        grid-template-columns: 1fr;
      }

      /* Ensure inputs/selects don't zoom on iOS */
      input, select, textarea {
        font-size: 16px;
      }

      /* Comfortable tap targets */
      .btn {
        min-height: 44px;
      }
    }
  </style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
  <!-- Swarm Debug UI Mount Point -->
  <div id="chat-root"></div>

  <script>
    // Global shims for React bundle
    window.process = window.process || { env: { NODE_ENV: 'production' } };
    window.global = window.global || window;
  </script>
  <!-- ui-logic.js removed: chat iframe loads its own scripts; this page only needs the React debug bundle -->
  <script type="module" src="dist/ui-chat-window.js"></script>
</body>
</html>
