<!DOCTYPE html>
<!--
  OSHAL Assistant ("Jarvis") surface — the unified front door over every OSHAL app (ADR-050).

  VOICE-FIRST, THEME-NATIVE: leads with an audio-reactive orb + voice I/O, but it is a first-class
  cockpit surface — it MIRRORS the active cockpit theme (midnight etc.) via the standard theme-sync
  script every sibling surface uses, so the orb + glass cards take the live accent (purple in
  midnight) and switch with the operator's theme. The orb voices the answer; the data lives on the
  same focused, width-constrained column directly under it:
    • a live Command Center glance (GET /api/jarvis/overview) — swarm, comms, active work, calendar
    • a conversation log with markdown / GFM tables / Mermaid diagrams / "Open ↗" handoff chips
  Voice runs in the browser (Web Speech API). The brain is POST /api/jarvis/ask. The cockpit hides
  its generic right-rail chat panel here (it IS the chat). Served by createJarvisRoutes at /api/jarvis/.
-->
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSHAL Assistant</title>
<!-- Framework theme tokens + the bootstrap that applies the operator's saved theme (and follows it
     live). Theme files scope to [data-theme="…"] with NO :root fallback, so the default on <html>
     above is what gives the surface colours until the bootstrap resolves the operator's choice. -->
<link rel="stylesheet" href="/shared/ui/css/surface-themes.css" />
<script src="/shared/ui/js/surface-theme.js"></script>
<link rel="stylesheet" href="/shared/ui/css/surface-reading.css" />
<script src="/shared/ui/js/surface-reading.js"></script>
<style>
  :root {
    /* Short alias names DERIVED from the framework theme tokens (surface-themes.css) rather than
       hardcoded hex, so all eleven themes follow — not just midnight. Semantic status/accent
       colours keep the old hex as a fallback in case a theme omits one. (--scrollbar-thumb is a
       framework token of the same name, so it flows through directly — no local alias needed.) */
    --bg:var(--bg-primary); --panel:var(--bg-secondary); --panel2:var(--bg-tertiary);
    --card:var(--bg-card); --card-hover:var(--bg-card-hover);
    --line:var(--border-color); --line-hover:var(--border-color-hover);
    --text:var(--text-primary); --muted:var(--text-secondary); --faint:var(--text-muted);
    --accent:var(--accent-primary, #7c7cff); --accent-hover:var(--accent-primary-hover, #9d9dff);
    --ok:var(--status-success, #34d399); --active:var(--status-active, #60a5fa); --warn:var(--status-warning, #fbbf24); --danger:var(--status-error, #f87171);
    --glass:var(--glass-bg, rgba(255,255,255,.04));
    --font:'Inter',system-ui,-apple-system,sans-serif;
    --font-d:'Plus Jakarta Sans','SF Pro Display',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; font-family:var(--font); color:var(--text); background:var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--scrollbar-thumb) transparent; }
  .scroll::-webkit-scrollbar { width:10px; }
  .scroll::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:6px; }
  .scroll::-webkit-scrollbar-track { background:transparent; }

  /* Two-pane: main (orb + chat) + a right rail (work queue + small metrics). Less vertical scroll. */
  /* Push the whole surface down so the orb sits nearer the vertical middle — balances the layout
     and (since the node-field hub tracks the orb) drops the map with it instead of crowding the top. */
  .layout { display:flex; gap:18px; max-width:1560px; width:100%; margin:0 auto; padding:0 24px 48px; align-items:flex-start; }
  /* Orb/controls pushed down so the orb sits nearer mid-screen (the node-field hub tracks it). The
     rail starts at the cloud's TOP (var set from JS) so Conversations is level with the cloud top. */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; padding-top:clamp(72px,25vh,220px); }
  .rail { width:300px; flex:none; position:sticky; top:14px; display:flex; flex-direction:column; gap:2px; padding-top:var(--cloud-top-px,72px); }
  .rail .sect:first-child { margin-top:4px; }   /* the rail's own top spacing comes from --cloud-top-px */
  @media (max-width:880px){ .layout { flex-direction:column; } .rail { width:100%; position:static; } }
  /* legacy single-column container (unused after the two-pane redesign) */
  .col { max-width:680px; width:100%; margin:0 auto; padding:26px 20px 44px; }

  /* ── Orb hero ────────────────────────────────────────────────────────── */
  .hero { display:flex; flex-direction:column; align-items:center; text-align:center; }
  .eyebrow { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; opacity:.9; }
  .canvas-wrap { position:relative; width:min(168px,40vw); aspect-ratio:1; margin:6px auto 54px; }
  #orb { width:100%; height:100%; display:block; cursor:pointer; }
  .status { font-family:var(--font-d); font-weight:600; font-size:.92rem; color:var(--muted); min-height:1.3em; }
  .status.err { color:var(--danger); }
  .bubble { width:100%; max-width:560px; min-width:0; margin:8px auto 0; min-height:1.2em; opacity:0; transition:opacity .2s ease; }
  .bubble.has-copy { opacity:1; }
  .bubble .you { color:var(--faint); font-size:.86rem; margin-bottom:5px; word-break:break-word; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bubble .you b { color:var(--muted); font-weight:600; }
  .bubble .ai { width:100%; min-width:0; max-width:100%; padding-inline:2px; color:var(--text); font-size:calc(1.02rem * var(--reading-scale,1)); line-height:1.5; font-family:var(--font-d); font-weight:500; overflow-wrap:anywhere; word-break:normal; }
  /* The column is capped in `ch`, not `px`. It therefore grows with the type and holds a ~68
     character line at every reading scale AND every panel width — which is what makes the expand
     control safe. The previous `min(860px,100%)` meant a maximised panel ran the same small text
     to ~112 characters per line: wider, and harder to read, not easier. */
  .result-panel { width:min(var(--reading-measure,68ch),100%); margin:16px auto 4px; padding:16px 18px; text-align:left;
    background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.022)); border:1px solid var(--line);
    border-radius:16px; box-shadow:0 18px 48px rgba(0,0,0,.16); }
  .result-panel[hidden] { display:none; }
  .result-panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;
    color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; flex-wrap:wrap; }
  /* The actions wrap rather than pushing "Full discussion" off the right edge of the 400px
     embedded panel — the same reachability rule the boards follow. */
  .result-panel-actions { display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap; }
  /* Two A's at different sizes is the conventional, wordless text-size affordance, and it reads at
     a glance to the person who needs it most. The control is IN the answer panel, not buried in a
     settings screen: a reader who cannot read the answer should not have to go hunting. */
  #readingSizeBtn { font-family:var(--font-d); letter-spacing:0; line-height:1; }
  #readingSizeBtn .aa-lg { font-size:1.45em; margin-left:1px; }
  .result-panel .bx { max-width:100%; color:var(--text); font-size:calc(.96rem * var(--reading-scale,1)); line-height:1.55; overflow-wrap:anywhere; }
  .result-panel .bx p:first-child { margin-top:0; }
  .result-panel .bx p:last-child { margin-bottom:0; }
  .result-panel .bx .tablewrap { overflow-x:auto; margin:10px 0; }
  /* A table inside an answer was the smallest type on the surface at a flat 13px. It scales too —
     a reader who asked for larger text meant the whole answer, not the prose around the numbers. */
  .result-panel .bx table.md { border-collapse:collapse; font-size:calc(13px * var(--reading-scale,1)); width:100%; }
  .result-panel .bx table.md th,.result-panel .bx table.md td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  .result-panel .bx table.md th { background:var(--glass); color:var(--accent); }

  /* Lowered well clear of the ambient cloud (radiusY ~190px around the orb) so the
     Tap-to-talk row + options never crowd the eye — operator ask, repeated. */
  .controls { display:flex; justify-content:center; margin-top:clamp(84px,15vh,168px); }
  .mic { display:inline-flex; align-items:center; gap:9px; font-family:var(--font-d); font-weight:700; font-size:.96rem; color:#fff;
    background:var(--accent); border:0; border-radius:var(--radius-pill,9999px); padding:12px 24px; cursor:pointer; transition:.18s;
    box-shadow:0 8px 24px -8px var(--accent); }
  .mic:hover { background:var(--accent-hover); transform:translateY(-1px); }
  .mic.live { background:var(--danger); box-shadow:0 8px 24px -8px var(--danger); }
  .mic svg { width:18px; height:18px; fill:currentColor; }

  .ctlrow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:11px; }
  .ctl { font-family:var(--font); font-weight:600; font-size:.78rem; color:var(--muted); border:1px solid var(--line);
    background:var(--glass); border-radius:9999px; padding:7px 13px; cursor:pointer; transition:.16s; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .ctl:hover { border-color:var(--accent); color:var(--text); }

  .typer { display:none; gap:8px; width:100%; max-width:520px; margin:13px auto 0; }
  .typer.show { display:flex; }
  .typer input { flex:1; min-width:0; background:var(--glass); border:1px solid var(--line); border-radius:9999px; padding:11px 16px; color:var(--text); font-size:.92rem; font-family:var(--font); }
  .typer input::placeholder { color:var(--faint); } .typer input:focus { outline:none; border-color:var(--accent); }
  .typer button { background:var(--accent); color:#fff; border:0; border-radius:9999px; padding:0 20px; font-weight:700; cursor:pointer; font-family:var(--font-d); }
  .typer button:hover { background:var(--accent-hover); }

  .chips { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin:16px auto 0; }
  .chip { font-size:.78rem; color:var(--muted); border:1px solid var(--line); border-radius:9999px; padding:7px 13px; cursor:pointer; transition:.16s; background:var(--glass); }
  .chip:hover { border-color:var(--accent); color:var(--text); }
  /* ── Media attach: menu, preview strip, chips ─────────────────────────── */
  .attach-menu { position:relative; display:flex; gap:7px; flex-wrap:wrap; justify-content:center; width:100%; max-width:520px; margin:9px auto 0; }
  .attach-menu[hidden] { display:none; }
  .attach-opt { font-family:var(--font); font-weight:600; font-size:.82rem; color:var(--text); border:1px solid var(--line);
    background:var(--glass); border-radius:9999px; padding:9px 15px; cursor:pointer; transition:.16s; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .attach-opt:hover { border-color:var(--accent); }
  .attach-strip { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:520px; margin:12px auto 2px; }
  .attach-strip[hidden] { display:none; }
  .attach-chip { position:relative; display:inline-flex; align-items:center; gap:8px; max-width:210px; font-size:.78rem; color:var(--muted);
    border:1px solid var(--line); border-radius:12px; padding:6px 8px 6px 6px; background:var(--glass); }
  .attach-chip .attach-thumb { width:34px; height:34px; border-radius:8px; object-fit:cover; flex:0 0 auto; background:var(--line); }
  .attach-chip .attach-doc-ic { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; background:var(--line); flex:0 0 auto; }
  .attach-chip .attach-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-chip .attach-x { flex:0 0 auto; cursor:pointer; border:0; background:transparent; color:var(--faint); font-size:1rem; line-height:1; padding:2px 4px; }
  .attach-chip .attach-x:hover { color:var(--danger); }
  @media (max-width:700px){
    /* Keep one user line plus two answer lines reserved. A reply now fills this slot instead of
       pushing every control and the mobile page scrollbar down by roughly 53px.
       The slot SCROLLS and scales: a fixed 4.5rem height silently truncated any longer caption with
       no way to reach the rest, and this rule also fires inside the 400px-wide embedded assistant
       panel — so on a desktop, not just a phone. Reserving the space was right; making the overflow
       unreachable was not. */
    .bubble { height:calc(4.5rem * var(--reading-scale,1)); min-height:calc(4.5rem * var(--reading-scale,1)); flex:none; overflow-y:auto; }
    .controls { margin-top:12px; }
    .ctlrow { gap:6px; margin-top:8px; }
    .chips { gap:6px; margin-top:10px; }
  }

  /* ── Room for the answer on a short viewport ──────────────────────────────
     Keyed on HEIGHT, deliberately. This surface was laid out for a full window, where
     `padding-top:clamp(72px,25vh,220px)` plus a 204px orb canvas plus a 54px margin is a
     handsome ~400px of chrome. Inside the embedded assistant panel (about 590px of usable
     height) that same chrome pushed the answer two-thirds of the way down and left roughly
     ten lines visible — which is most of why an answer "could not be read".

     Height rather than width because the constraint IS vertical: a phone at 390x844 has plenty
     of height and keeps the full hero, while the 400x640 panel and a short laptop get the room.
     Scaling the type without also making room would have shown the reader LESS text, so these
     two changes are correct only together. */
  @media (max-height:760px) {
    .main { padding-top:clamp(12px,3vh,40px); }
    .canvas-wrap { width:min(104px,26vw); margin:4px auto 16px; }
    .result-panel { margin-top:8px; }
  }

  /* ── Section label (matches sibling surfaces) ────────────────────────── */
  .sect { display:flex; align-items:center; gap:10px; margin:26px 2px 10px; }
  .sect .t { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; }
  .sect .refresh { margin-left:auto; font-size:11px; color:var(--muted); background:var(--glass); border:1px solid var(--line); border-radius:8px; padding:4px 9px; cursor:pointer; }
  .sect .refresh:hover { color:var(--text); border-color:var(--accent); }

  /* ── Compact metrics (rail) ── */
  .cc-mini { display:flex; flex-direction:column; gap:5px; }
  .cc-row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:12px; min-width:0; }
  .cc-row .ico { color:var(--accent); font-size:13px; flex:none; }
  .cc-row .lbl { color:var(--muted); flex:none; }
  .cc-row .val { margin-left:auto; color:var(--text); font-weight:700; font-family:var(--font-d); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62%; }

  /* ── Session shelf ── */
  .shelf { display:flex; flex-direction:column; gap:6px; }
  .shelf-item { display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-left:2px solid var(--line); border-radius:10px; padding:8px 11px; font-size:12.5px; min-width:0; }
  .shelf-item.done, .shelf-item.err { cursor:pointer; }
  .shelf-item.done { border-left-color:var(--ok); }
  .shelf-item.err { border-left-color:var(--danger); }
  .shelf-item.done:hover, .shelf-item.err:hover { border-color:var(--accent); border-left-color:var(--ok); }
  .si-dot { flex:none; width:12px; text-align:center; color:var(--faint); font-size:11px; }
  .shelf-item.done .si-dot { color:var(--ok); }
  .shelf-item.err .si-dot { color:var(--danger); }
  .si-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .si-when { flex:none; font-size:11px; color:var(--faint); }
  .shelf-item.done .si-when { color:var(--ok); font-weight:600; }
  /* Unread results POP (accent); read results recede (dim) so the eye lands on what's new. */
  .shelf-item.done.unread { border-left-color:var(--accent); border-left-width:3px; background:color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .shelf-item.done.unread .si-label { font-weight:700; color:var(--text); }
  .shelf-item.done.unread .si-when { color:var(--accent); font-weight:800; letter-spacing:.4px; }
  .shelf-item.done.unread .si-dot { color:var(--accent); }
  .shelf-item.done.read { opacity:.58; }
  .shelf-item.done.read .si-label { color:var(--muted); }
  .shelf-item.done.read .si-when { color:var(--faint); font-weight:500; }
  .shelf-item.done.read .si-dot { color:var(--faint); }
  .si-x { flex:none; color:var(--faint); cursor:pointer; padding:0 2px; font-size:14px; line-height:1; }
  .si-x:hover { color:var(--danger); }

  /* ── Command Center cards (native glass) ─────────────────────────────── */
  .cc { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px){ .cc { grid-template-columns:1fr; } }
  .pnl { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; min-width:0; min-height:106px; display:flex; flex-direction:column; }
  .pnl .ph { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
  .pnl .ph .ico { font-size:14px; color:var(--accent); }
  .pnl .ph .name { font-size:12.5px; font-weight:700; }
  .pnl .ph .count { margin-left:auto; font-size:10.5px; color:var(--faint); white-space:nowrap; }
  .empty { color:var(--faint); font-size:12px; padding:4px 0; }

  /* stat-first cards: big number + one supporting line (+ optional health bar) */
  .stat { display:flex; align-items:baseline; gap:6px; margin:auto 0 6px; min-width:0; }
  .stat .big { font-family:var(--font-d); font-size:1.7rem; font-weight:700; color:var(--text); line-height:1.04; letter-spacing:-.01em; }
  .stat .unit { font-size:.76rem; color:var(--muted); font-weight:600; }
  .bar { height:5px; border-radius:9999px; background:var(--glass); overflow:hidden; margin:0 0 8px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:9999px; transition:width .4s ease; }
  .sub { font-size:11.5px; color:var(--muted); line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }

  /* ── Conversation (full rich answers) ────────────────────────────────── */
  #convo:empty { display:none; }
  #convo:empty + .convo-empty { display:block; }
  .convo-empty { display:none; color:var(--faint); font-size:12px; padding:2px 2px; }
  /* Everything below scales with the reader's chosen size. The rule is "the whole answer, not just
     the prose" — an answer whose headings, tables, code and diagram captions stayed at their
     original 10.5–14px would still be unreadable to the reader who asked for larger text. */
  .msg { margin:0 0 14px; line-height:1.6; min-width:0; font-size:calc(1rem * var(--reading-scale,1)); }
  .msg .who { font-size:calc(10.5px * var(--reading-scale,1)); text-transform:uppercase; letter-spacing:.5px; color:var(--faint); margin-bottom:4px; font-weight:700; }
  .msg.user .bx { background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:9px 13px; display:inline-block; max-width:100%; word-break:break-word; }
  .msg.bot .bx { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 15px; overflow-wrap:anywhere; }
  .bx h2 { font-size:calc(14px * var(--reading-scale,1)); color:var(--accent); margin:12px 0 6px; }
  .bx h3 { font-size:calc(12.5px * var(--reading-scale,1)); margin:10px 0 4px; }
  .bx ul { margin:6px 0; padding-left:18px; } .bx li { margin:3px 0; }
  .bx p { margin:7px 0; } .bx strong { color:var(--text); } .bx code { background:var(--glass); padding:1px 5px; border-radius:5px; }
  .bx .md-image-note { display:inline-flex; align-items:center; max-width:100%; color:var(--muted); border:1px dashed var(--line); border-radius:9px; padding:5px 8px; overflow-wrap:anywhere; }
  .bx .tablewrap { overflow-x:auto; margin:9px 0; }
  .bx table.md { border-collapse:collapse; font-size:calc(12px * var(--reading-scale,1)); width:100%; }
  .bx table.md th, .bx table.md td { border:1px solid var(--line); padding:6px 9px; text-align:left; }
  .bx table.md th { background:var(--glass); color:var(--accent); }
  .bx pre.code { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:calc(11.5px * var(--reading-scale,1)); }
  .bx .mermaid { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:12px; margin:9px 0; white-space:pre-wrap; font-size:calc(11.5px * var(--reading-scale,1)); text-align:center; }
  .bx .mermaid[data-rendered] { white-space:normal; }
  .bx .mermaid svg { max-width:100%; height:auto; }
  .ans-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .ans-chips .chip { color:var(--accent); font-weight:600; }
  .spin { color:var(--muted); font-size:12.5px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:p 1s infinite; }
  @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
  .err { color:var(--danger); }

  /* ══════════ Cooler Jarvis — ambient swarm field + Apple-glass surfaces ══════════ */
  /* Full-bleed living backdrop: the swarm as a node-field, online bots lit. Masked so it
     fades toward the edges and never competes with the foreground. */
  .nodefield { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:.55; }
  /* Hover tooltip for a swarm node — name + status, only on hover (no random pop-ups). */
  .node-tip { position:fixed; z-index:6; pointer-events:none; transform:translate(-50%,-100%);
    background:rgba(12,12,22,0.78); border:1px solid rgba(var(--accent-rgb,120,130,255),0.45); color:rgba(236,236,250,0.96);
    font:600 11px/1.3 Inter,system-ui,sans-serif; padding:5px 9px; border-radius:8px; white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,0.35); opacity:0; transition:opacity .12s ease; }
  .node-tip.on { opacity:.96; }
  .node-tip .nt-sub { color:rgba(180,185,220,0.85); font-weight:500; margin-left:6px; }
  body { position:relative; background:
      radial-gradient(1100px 680px at 50% -10%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 62%),
      radial-gradient(820px 560px at 86% 2%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 58%),
      var(--bg); }

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ================= Visualizer: audio-reactive orb (theme-driven colors) ================= */
const cvs = $('orb'), cctx = cvs.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function sizeOrb(){ const r=cvs.getBoundingClientRect(); W=r.width; H=r.height; cvs.width=W*DPR; cvs.height=H*DPR; cctx.setTransform(DPR,0,0,DPR,0,0); }
sizeOrb(); addEventListener('resize', sizeOrb);
let mode='idle', level=0, targetLevel=0, freq=null, t=0; const BARS=72;

// Orb takes the live cockpit accent so it matches the active theme (purple in midnight).
const TC = { acc:'#7c7cff', bright:'#9d9dff', glow:'124,124,255', core:'#0a0a12' };
function hexToRgb(h){ try{ h=String(h).trim().replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }catch(e){ return '124,124,255'; } }
function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  const acc=(cs.getPropertyValue('--accent').trim()||'#7c7cff');
  const br =(cs.getPropertyValue('--accent-hover').trim()||'#9d9dff');
  const bg =(cs.getPropertyValue('--bg').trim()||'#0a0a12');
  TC.acc=acc; TC.bright=br; if(/^#/.test(bg))TC.core=bg; TC.glow=hexToRgb(acc);
}
readTheme();
window.addEventListener('theme-synced', readTheme);

function palette(){
  if(mode==='speaking') return [TC.acc,TC.bright,'#ffffff'];
  if(mode==='listening')return [TC.acc,TC.bright,TC.bright];
  if(mode==='thinking') return [TC.acc,TC.bright,TC.bright];
  return [TC.acc,TC.acc,TC.bright];
}
let orbStyle=(function(){try{return localStorage.getItem('oshalOrb')||'eye'}catch(e){return'eye'}})();
function bgGlow(cx,cy,R,baseR,amp){ const g=cctx.createRadialGradient(cx,cy,baseR*0.5,cx,cy,R);
  g.addColorStop(0,'rgba('+TC.glow+','+(0.16+0.22*amp)+')'); g.addColorStop(1,'rgba('+TC.glow+',0)');
  cctx.fillStyle=g; cctx.beginPath(); cctx.arc(cx,cy,R,0,7); cctx.fill(); }
function coreSphere(cx,cy,baseR,c1,c3,amp){ const core=cctx.createRadialGradient(cx-baseR*0.3,cy-baseR*0.3,baseR*0.1,cx,cy,baseR);
  core.addColorStop(0,'#ffffff'); core.addColorStop(0.35,c3); core.addColorStop(0.75,c1); core.addColorStop(1,TC.core);
  cctx.fillStyle=core; cctx.beginPath(); cctx.arc(cx,cy,baseR,0,7); cctx.fill();
  cctx.fillStyle='rgba(255,255,255,'+(0.10+0.22*amp)+')'; cctx.beginPath(); cctx.arc(cx-baseR*0.25,cy-baseR*0.28,baseR*0.32,0,7); cctx.fill(); }
function drawHalo(cx,cy,R,amp,baseR,c1,c2,c3){
  bgGlow(cx,cy,R,baseR,amp);
  for(let i=0;i<BARS;i++){ const a=(i/BARS)*Math.PI*2; let h=Math.max(0.04,(mode==='listening'&&freq)?freq[i%freq.length]/255:0.5+0.5*Math.sin(t*3+i*0.5)*(0.4+0.6*amp));
    const inner=baseR*1.12,outer=inner+h*R*0.34*(0.5+amp);
    const x1=cx+Math.cos(a)*inner,y1=cy+Math.sin(a)*inner,x2=cx+Math.cos(a)*outer,y2=cy+Math.sin(a)*outer;
    const g=cctx.createLinearGradient(x1,y1,x2,y2); g.addColorStop(0,c2); g.addColorStop(1,c3);
    cctx.strokeStyle=g; cctx.lineWidth=Math.max(2,R*0.018); cctx.lineCap='round'; cctx.globalAlpha=0.85;
    cctx.beginPath(); cctx.moveTo(x1,y1); cctx.lineTo(x2,y2); cctx.stroke(); }
  cctx.globalAlpha=1;
  for(let k=0;k<2;k++){ cctx.save(); cctx.strokeStyle='rgba('+TC.glow+','+(0.12+0.10*amp)+')'; cctx.lineWidth=1.2; cctx.beginPath();
    const rr=baseR*(1.3+k*0.22);
    for(let i=0;i<=64;i++){ const a=(i/64)*Math.PI*2+t*(k?-0.3:0.4); const wob=1+0.05*Math.sin(a*6+t*2)*amp; cctx.lineTo(cx+Math.cos(a)*rr*wob,cy+Math.sin(a)*rr*wob); }
    cctx.stroke(); cctx.restore(); }
  coreSphere(cx,cy,baseR,c1,c3,amp);
}
function drawPulse(cx,cy,R,amp,baseR,c1,c2,c3){
  bgGlow(cx,cy,R,baseR,amp);
  for(let k=0;k<4;k++){ const phase=((t*0.45)+k/4)%1; const rr=baseR*(0.7+phase*1.7);
    cctx.globalAlpha=(1-phase)*0.55; cctx.strokeStyle=c3; cctx.lineWidth=Math.max(2,R*0.022*(0.6+amp));
    cctx.beginPath(); cctx.arc(cx,cy,rr,0,7); cctx.stroke(); }
  cctx.globalAlpha=1; coreSphere(cx,cy,baseR*0.82,c1,c3,amp);
}
function drawWave(cx,cy,R,amp,baseR,c1,c2,c3){
  bgGlow(cx,cy,R,baseR,amp);
  const w=R*1.7,n=100; cctx.lineWidth=Math.max(2,R*0.02); cctx.lineCap='round'; cctx.lineJoin='round';
  const g=cctx.createLinearGradient(cx-w/2,0,cx+w/2,0); g.addColorStop(0,c1); g.addColorStop(0.5,c3); g.addColorStop(1,c1);
  for(let pass=0;pass<2;pass++){ cctx.globalAlpha=pass?0.25:1; cctx.strokeStyle=g; cctx.beginPath();
    for(let i=0;i<=n;i++){ const x=cx-w/2+(i/n)*w; const f=(mode==='listening'&&freq)?(freq[i%freq.length]/255-0.45):Math.sin(i*0.28+t*4)*0.5;
      const env=Math.sin((i/n)*Math.PI); const y=cy+(pass?-1:1)*f*env*R*0.66*(0.3+amp*1.5); i?cctx.lineTo(x,y):cctx.moveTo(x,y); }
    cctx.stroke(); }
  cctx.globalAlpha=1; cctx.fillStyle=c3; cctx.beginPath(); cctx.arc(cx,cy,R*0.05*(1+amp),0,7); cctx.fill();
}
function drawBars(cx,cy,R,amp,baseR,c1,c2,c3){
  bgGlow(cx,cy,R,baseR,amp);
  const N=64,ring=baseR*0.62;
  for(let i=0;i<N;i++){ const a=(i/N)*Math.PI*2-Math.PI/2; let h=Math.max(0.05,(mode==='listening'&&freq)?freq[i%freq.length]/255:0.5+0.5*Math.sin(t*4+i*0.4)*(0.4+0.7*amp));
    const inner=ring,outer=ring+h*R*0.5*(0.4+amp);
    const x1=cx+Math.cos(a)*inner,y1=cy+Math.sin(a)*inner,x2=cx+Math.cos(a)*outer,y2=cy+Math.sin(a)*outer;
    const g=cctx.createLinearGradient(x1,y1,x2,y2); g.addColorStop(0,c1); g.addColorStop(1,c3);
    cctx.strokeStyle=g; cctx.lineWidth=Math.max(2,R*0.024); cctx.lineCap='round';
    cctx.beginPath(); cctx.moveTo(x1,y1); cctx.lineTo(x2,y2); cctx.stroke(); }
  cctx.fillStyle=TC.core; cctx.beginPath(); cctx.arc(cx,cy,ring*0.9,0,7); cctx.fill();
  cctx.globalAlpha=0.45+0.45*amp; cctx.fillStyle=c3; cctx.beginPath(); cctx.arc(cx,cy,ring*0.28,0,7); cctx.fill(); cctx.globalAlpha=1;
}
/* Eye: an autonomous watcher — it blinks on its own, glances around, and the
   pupil tracks + dilates with the voice. Pure canvas, takes the theme accent. */
/* Pointer tracking so the eye orb can look at the cursor (iframe-local — follows while the cursor is
   over the Jarvis surface; falls back to autonomous glances when it's idle or away). */
const mouse={x:null,y:null,seen:-99};
addEventListener('mousemove',(e)=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.seen=t; },{passive:true});
const eye={gx:0,gy:0,tx:0,ty:0,nextSaccade:0,blinking:false,blinkT:0,nextBlink:2.4};
function eyePath(cx,cy,hw,hh){ cctx.beginPath();
  cctx.moveTo(cx-hw,cy); cctx.quadraticCurveTo(cx,cy-hh*1.9,cx+hw,cy);
  cctx.quadraticCurveTo(cx,cy+hh*1.9,cx-hw,cy); cctx.closePath(); }
function drawEye(cx,cy,R,amp,baseR,c1,c2,c3){
  bgGlow(cx,cy,R,baseR,amp);
  // Look at the cursor when it's recently moved over the surface; otherwise glance around on its own.
  if(mouse.x!=null && (t-mouse.seen)<4){
    const rc=cvs.getBoundingClientRect(), ox=rc.left+rc.width/2, oy=rc.top+rc.height/2;
    let dx=(mouse.x-ox)/((rc.width*0.5)||1), dy=(mouse.y-oy)/((rc.height*0.5)||1);
    const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }   // clamp gaze to the eye's range

    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_m, alt) => '<span class="md-image-note" role="note">Image link not loaded' + (alt ? ': ' + alt : '') + '</span>')

    .replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (_m, txt, url) => '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + (txt || safeUrl(url)) + '</a>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  const lines = String(md || '').split(/\r?\n/);
  let html = '', inList = false, i = 0;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const isSep = (s) => /^\s*\|?[\s:|-]+\|?\s*$/.test(s) && s.includes('-');

  while (i < lines.length) {
    const line = lines[i].trim();
    const fence = line.match(/^```\s*([\w-]*)/);
    if (fence) {
      closeList();

      while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }

        + body.map((row) => '<tr>' + row.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (!line) { closeList(); i++; continue; }
    if (line.startsWith('## ')) { closeList(); html += '<h2>' + inline(line.slice(3)) + '</h2>'; }
    else if (line.startsWith('### ')) { closeList(); html += '<h3>' + inline(line.slice(4)) + '</h3>'; }
    else if (/^[-*]\s+/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^[-*]\s+/,'')) + '</li>'; }

/* Strip Markdown to speakable text. Only claim a visual is on the center stage after the stage
   controller confirms that exact artifact finished materializing; otherwise point to Discussion. */
function toSpeech(md, materializedVisualKind) {
  let s = String(md || ''); let extras = [];
  if (/```mermaid/i.test(s)) extras.push(materializedVisualKind === 'diagram' ? 'I drew a diagram on screen' : 'the diagram is in Discussion');
  s = s.replace(/```mermaid[\s\S]*?```/gi, ' ');
  if (/```/.test(s)) extras.push('there is code on screen');
  s = s.replace(/```[\s\S]*?```/g, ' ');
  if (/^\s*\|.*\|/m.test(s)) {
    extras.push(materializedVisualKind === 'table' ? 'the table is on screen' : 'the table is in Discussion');
    s = s.replace(/^\s*\|.*\|\s*$/gm, ' ');
  }
  s = s.replace(/^#{1,6}\s+/gm, '').replace(/[*_`>#]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1');
  s = s.replace(/\n{2,}/g, '. ').replace(/\n/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (extras.length) s += (s ? ' — ' : '') + extras.join(', ') + '.';
  return s;
}

  const spokenFor = (materializedKind) => toSpeech(speechSource, materializedKind).trim() || 'Here is the answer.';
  const caption = firstLine(data?.answer || speechSource).slice(0, 220);

/* ── Conversation memory: a short rolling transcript so follow-ups have context ──

const convoLog = [];              // {role:'user'|'jarvis', text}

/* One turn, shown inline in the SAME thread: post the raw message (the bot remembers the rest via

async function handleInput(text) {

  if (!atts.length && offeredResultIdForTurn && /^\s*(?:yes|yeah|yep|sure|ok(?:ay)?|please do|go ahead)\s*[.!]?\s*$/.test(_low)) {
    showCenterUserCopy(text); addConvo('You', 'user', `<div>${esc(text)}</div>`); scrollToConvo();
    await openJob(offeredResultIdForTurn);

  }
  if (!atts.length && /\bread\b/.test(_low) && /(backlog|unread|all\b.*\bresults?|all results?|all of (my|them)|all my|everything)/.test(_low)) {
    showCenterUserCopy(text); addConvo('You', 'user', `<div>${esc(text)}</div>`); scrollToConvo();
    await readAllBacklog(); return;

    const u = unreadDone();

    else if (u.length) { await openJob(u[0].id); }

    return;

  const shownText = text || '(attached media)';
  showCenterUserCopy(shownText);
  addConvo('You', 'user', `<div>${esc(shownText)}</div>`
    + (noteText ? `<div style="opacity:.55;font-size:.82em;margin-top:3px">📎 ${esc(noteText)}</div>` : ''));
  const bubble = addConvo(assistantLabel(), 'bot', '<div style="opacity:.6">Thinking…</div>');
  setMode('thinking');
  setStatus(atts.length ? 'Looking at your media…' : 'Thinking…');
  scrollToConvo();

    // Reduce attachments to text before the /ask turn: images → a vision description (accountable
    // server call), docs → their already-read text. Mirrors mic → transcript → ask.
    const outAttachments = [];

      if (imgs.length) {

        if (imgs.length > 1 && Array.isArray(vis.sections) && vis.sections.length === imgs.length) {

          // Jarvis can talk about "the first photo" vs "the second". Fail-open: when the
          // model didn't honor the section markers we fall back to one combined description.
          imgs.forEach((im, i) => outAttachments.push({ kind:'image', name: im.name, description: vis.sections[i] }));
        } else {

        }

        ? { kind:'doc', name:d.name, unreadable:true, reason:d.reason||'' }   // honest "couldn't read" travels to the prompt

      speak("Sorry, that didn't work.");
    } else {
      let html = renderMarkdown(d.answer || '(no answer)');
      if (d.handoffs && d.handoffs.length) html += chipsHtml(d.handoffs);
      html += visualReplayHtml(d.visual);
      bubble.innerHTML = html;
      showInlineResult(html);
      wireChips(bubble);

/* Poll one job to completion. Async because a tool-using turn can outlast Cloudflare's ~100s edge
   timeout if a connection is held open; returns the final {status:'done'|'error', ...} payload. */
async function waitForResult(jobId) {
  for (let i = 0; i < 200; i++) {   // ~5 min ceiling at 1.5s cadence
    try {
      const r = await fetch('/api/jarvis/ask/result?jobId=' + encodeURIComponent(jobId), { credentials: 'include' });
      const d = await r.json();
      if (d.status && d.status !== 'pending') return d;
    } catch (_) { /* transient network blip — keep polling */ }
    await new Promise((res) => setTimeout(res, 1500));
  }
  return { status: 'error', error: 'This is taking unusually long — it may still finish; check the shelf.' };
}

/* ================= Session-manager shelf ================= */
function timeAgo(ms) { const d = Date.now() - ms; if (d < 60000) return 'just now'; if (d < 3600000) return Math.floor(d / 60000) + 'm'; return Math.floor(d / 3600000) + 'h'; }

/* Done results the user hasn't heard yet, newest first. */

  addConvo(assistantLabel(), 'bot', `<div>Reading your ${items.length} unread result${items.length > 1 ? 's' : ''} now.</div>`);
  for (const t of items) { await openJob(t.id); }   // openJob renders, speaks, and marks read

function renderShelf(jobs) {

    const when = j.status === 'done' ? (isRead(j.jobId) ? 'read' : 'NEW') : (j.status === 'error' ? 'failed' : timeAgo(j.createdAt));

function announceReady(job) {

  // It stays UNREAD (highlighted in the work queue) until they hear it.

    `<div>I have your results ready for <b>“${esc(label)}”</b> — want an update? Say <b>“read it”</b> ` +

let shelfPolling = false, shelfPrimed = false, shelfTimer = null;

const durableTaskResults = {};   // taskId → full row from /tasks, so finished items survive reloads
async function pollShelf() {
  let anyRunning = false;
  try {
    // Durable Tasks list — survives reloads/restarts (the in-session /ask/jobs is in-memory only),
    // so a returning user sees their old tasks + results.
    const r = await fetch('/api/jarvis/tasks', { credentials: 'include' });
    const tasks = (await r.json()).tasks || [];
    const jobs = tasks.map((t) => {
      durableTaskResults[t.id] = t;
      return { jobId: t.id, label: t.title, status: t.status, createdAt: Date.parse(t.createdAt) || Date.now() };
    });
    lastShelfJobs = jobs;
    renderShelf(jobs);
    for (const t of tasks) {
      if (t.status === 'pending' || t.status === 'running' || t.status === 'queued' || t.status === 'summarizing') { anyRunning = true; continue; }
      if (t.delivered) continue;   // already pushed once — DB-durable, survives reloads (not brittle)
      // Voice-gated: never talk over the user. Leave it undelivered and announce on the next idle tick.
      if (mode === 'speaking' || mode === 'listening') { anyRunning = true; continue; }
      if (t.status === 'done') announceReady({ jobId: t.id, label: t.title });   // render the result inline
      markDelivered(t.id);   // mark once (done or error) so it never re-announces
    }
    if (mode !== 'speaking' && mode !== 'listening') setMode(anyRunning ? 'thinking' : 'idle');
  } catch (_) {}
  // Self-schedule: poll fast (3s) only while work is in flight; when idle, back off to
  // 30s so a new user with no jobs isn't hammering /ask/jobs every 3s forever. Direct
  // pollShelf() calls (after an ask/dismiss) reschedule via this same path.

}
function startShelfPoller() { if (shelfPolling) return; shelfPolling = true; pollShelf(); }

}

async function openJob(jobId) {

    html += workspaceChipHtml(d.ticketId || d.sourceTicketId || d.taskId);

    if (d.label) { const who = bx.parentElement.querySelector('.who'); if (who) who.textContent = assistantLabel() + ' · ' + d.label.slice(0, 40); }

/* ================= Conversations — search the queue on load, show + resume threads =================
   On load (and after each turn) we GET the user's tickets and keep the open CHAT-queue ones — your
   in-flight conversations — and list them in the rail so you can resume any of them. A chat-ticket's
   metadata.taskId IS the thread's sessionId. */
let threadsLoading = false;
function renderThreads(tickets) {
  const sect = $('threadsSect'), el = $('threads');
  if (!el) return;
  if (!tickets.length) { if (sect) sect.style.display = 'none'; el.innerHTML = ''; return; }
  if (sect) sect.style.display = '';
  el.innerHTML = tickets.map((t) => {
    const m = t.metadata || {}; const tid = String(m.taskId || '');
    const cur = tid && tid === SESSION_ID ? ' cur' : '';
    return `<div class="thread-item${cur}" data-tid="${esc(tid)}" title="${esc(t.title || 'Conversation')}">
      <span class="th-dot"></span><span class="th-label">${esc(t.title || 'Conversation')}</span></div>`;
  }).join('');
  el.querySelectorAll('.thread-item').forEach((row) => row.addEventListener('click', () => resumeThread(row.getAttribute('data-tid'))));
}
async function loadThreads() {
  if (threadsLoading) return; threadsLoading = true;
  try {
    const r = await fetch('/api/tickets?mine=true', { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    const list = Array.isArray(data) ? data : (data.tickets || []);
    const chats = list.filter((t) => {
      const m = t.metadata || {};
      const q = String(m.queueId || m.queue || '').toLowerCase();
      const type = String(t.ticketType || '').toLowerCase();
      const st = String(t.status || '').toLowerCase();
      return (q === 'chat' || type === 'chat') && st !== 'complete' && st !== 'cancelled';
    }).sort((a, b) => String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));
    renderThreads(chats);
  } catch (_) { /* not signed in / no tickets — leave the list hidden */ }
  finally { threadsLoading = false; }
}
/* Resume a thread: point new turns at its sessionId (the bot keeps that thread's context) and
   replay any stored messages. Best-effort replay — Jarvis history lives in the bot runtime, so the
   api message store may be empty for it; the thread still resumes for new turns. */
async function resumeThread(tid) {
  if (!tid || tid === SESSION_ID) return;
  SESSION_ID = tid; try { localStorage.setItem('jarvisSessionId', tid); } catch (_) {}
  convoLog.length = 0; const c = $('convo'); if (c) c.innerHTML = '';
  $('convoSect').style.display = 'none';
  setStatus('Resumed conversation — keep going');
  try {
    const r = await fetch('/api/jarvis/history?sessionId=' + encodeURIComponent(tid), { credentials: 'include' });
    if (r.ok) {
      const j = await r.json();
      const msgs = Array.isArray(j) ? j : (j.turns || []);
      let prevKey = '';   // skip consecutive dupes — the api turn-save + the bot both write chat_messages
      for (const mm of msgs) {
        const role = mm.role === 'user' ? 'user' : 'bot';
        const text = String(mm.text || '').trim();
        if (!text) continue;
        const key = role + '|' + text;
        if (key === prevKey) continue;
        prevKey = key;
        const html = role === 'user'
          ? `<div>${esc(text)}</div>`
          : renderMarkdown(text) + visualReplayHtml(mm.visual) + workspaceChipHtml(mm.sourceTicketId);
        const bx = addConvo(role === 'user' ? 'You' : assistantLabel(), role, html);
        if (role === 'bot' && bx) { wireChips(bx); wireWorkspaceChips(bx); renderMermaidIn(bx); }
      }
      scrollToConvo();
    }
  } catch (_) {}
  loadThreads();
}

/* ================= Speech synthesis ================= */
let voice=null, voiceList=[], voiceIdx=0;
function voiceScore(v){ const n=(v.name||'').toLowerCase(); let s=0;
  if(/en[-_]us/i.test(v.lang))s+=5; else if(/^en/i.test(v.lang))s+=3;
  if(/natural|online|neural/.test(n))s+=8;
  if(/aria|jenny|ava|emma|michelle|guy|andrew|samantha|google/.test(n))s+=3;
  return s; }
const voiceBtn=$('voiceBtn');
let activeVoicePreviewFinish=null;
function shortVoice(v){ return v?(v.name.replace(/^(Microsoft|Google)\s+/,'').replace(/\s*Online.*$/i,'').replace(/\(.*?\)/g,'').trim()||v.name):'Default'; }
function updateVoiceBtn(){ if(voiceBtn)voiceBtn.textContent='🔊 '+shortVoice(voice); }
function buildVoiceList(){
  if(!('speechSynthesis' in window)){ if(voiceBtn)voiceBtn.style.display='none'; return; }
  const vs=speechSynthesis.getVoices(); if(!vs.length)return;
  const en=vs.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  voiceList=en.length?en:vs;
  let i=voiceList.findIndex(v=>v.name===localStorage.getItem('oshalVoice')); if(i<0)i=0;
  voiceIdx=i; voice=voiceList[i]||null; updateVoiceBtn();
}
if('speechSynthesis' in window){
  buildVoiceList(); speechSynthesis.onvoiceschanged=buildVoiceList;
  if(voiceBtn)voiceBtn.addEventListener('click',()=>{
    if(!voiceList.length)return;
    voiceIdx=(voiceIdx+1)%voiceList.length; voice=voiceList[voiceIdx];
    try{localStorage.setItem('oshalVoice',voice.name)}catch(_){}
    updateVoiceBtn();
    activeSpeechFinish?.();
    activeVoicePreviewFinish?.();
    let previewDone=false,previewTimer=null;
    const finishPreview=()=>{if(previewDone)return;previewDone=true;clearTimeout(previewTimer);if(activeVoicePreviewFinish===finishPreview)activeVoicePreviewFinish=null;setAssistantSpeaking(false);};
    activeVoicePreviewFinish=finishPreview;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance("This is how I'll sound."); if(voice)u.voice=voice;
      u.onstart=()=>setAssistantSpeaking(true); u.onend=finishPreview; u.onerror=finishPreview;
      setAssistantSpeaking(true); previewTimer=setTimeout(finishPreview,5000); speechSynthesis.speak(u);
    }catch(_){finishPreview();}
  });

let activeSpeechFinish = null;
function setAssistantSpeaking(active) {
  ambientController?.setAssistantSpeaking(Boolean(active));
  document.dispatchEvent(new Event(active ? 'jarvis:speaking-start' : 'jarvis:speaking-end'));
}
/* Server neural TTS (Gemini) is the primary voice — the OS speechSynthesis voices are
   robotic in Electron and populate asynchronously (inconsistent pick). We fetch synth
   audio and play it; browser speechSynthesis is the fallback when the server can't. */
let ttsAudio=null, ttsPulse=null;
function stopTts(){
  if(ttsPulse){ clearInterval(ttsPulse); ttsPulse=null; }
  if(ttsAudio){ try{ ttsAudio.pause(); }catch(_){}; try{ ttsAudio.src=''; }catch(_){}; ttsAudio=null; }
  if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(_){} }
}
function speak(text, onDone){
  const copyToken=showCenterAnswerCopy(text);
  activeVoicePreviewFinish?.();
  if (activeSpeechFinish) activeSpeechFinish();
  stopTts();
  let finished=false;
  const finish=()=>{
    if(finished)return; finished=true; activeSpeechFinish=null; stopTts(); setAssistantSpeaking(false);
    Promise.resolve(typeof onDone==='function' ? onDone() : undefined).catch(()=>{}).finally(()=>{
      clearCenterCopy(copyToken);
      if(copyToken!==centerCopyVersion)return;
      setMode('idle'); setStatus('Tap the orb — your turn');
    });
  };
  activeSpeechFinish=finish;
  setAssistantSpeaking(true); setMode('speaking'); setStatus('Speaking…');
  speakViaServer(text, finish).catch(()=> { if(!finished)return speakViaBrowser(text, finish); });
}
/* POST the answer text to the swarm's neural TTS; play the returned audio. Rejects so
   speak() can fall back to the browser engine on any failure (offline, no key, block). */
function speakViaServer(text, finish){
  return fetch('/api/voice/synthesize', {
    method:'POST', credentials:'include',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }),
  }).then(r=> r.ok ? r.json() : Promise.reject(new Error('tts http '+r.status)))
    .then(j=>{
      const d=(j&&j.data)||{}; if(!d.audioData) throw new Error('no audio');
      const fmt=d.format||'wav', mime=fmt.indexOf('/')>=0?fmt:'audio/'+fmt;
      const a=new Audio('data:'+mime+';base64,'+d.audioData); ttsAudio=a;
      a.onended=finish; a.onerror=finish;   // ended/failed → release + idle
      ttsPulse=setInterval(()=>{ if(a.paused||a.ended){ return; } level=Math.min(1,0.35+Math.random()*0.4); },140);
      return a.play();   // rejects (e.g. autoplay block) → outer .catch → browser fallback
    });
}
function speakViaBrowser(text, finish){
  if(!('speechSynthesis' in window)){ setStatus('Showing answer…'); setTimeout(finish,1800); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); if(voice)u.voice=voice; u.rate=1.02;
  u.onboundary=()=>{ level=Math.min(1,level+0.25); };
  u.onend=finish; u.onerror=finish;
  try { speechSynthesis.speak(u); } catch (_) { finish(); }
}

/* ================= Speech recognition ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

    resumeAmbientAfterPushToTalk();

}
/* Are we embedded in the cockpit (or any) iframe? Cross-origin access to window.top throws,

const IN_IFRAME=(()=>{ try{ return window.self!==window.top; }catch(_){ return true; } })();

   user can always proceed, and (when framed) surface a one-click link to the standalone full-page
   orb where voice works. */
function micBlocked(){
  wantListening=false; listening=false; micBtn.classList.remove('live'); micLabel.textContent='Tap to talk'; if(mode==='listening')setMode('idle');
  if(nativeWakeCommandActive){ nativeWakeCommandActive=false; releaseNativeWakeCommandMedia(); }
  resumeAmbientAfterPushToTalk();
  $('typer').classList.add('show'); try{$('typein').focus();}catch(_){}
  if(IN_IFRAME){
    statusEl.innerHTML='Microphone blocked here — <a href="'+esc(location.href)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">open full-page</a> for voice, or just type below.';
    statusEl.classList.add('err');
  } else {
    setStatus('Microphone blocked — allow access in your browser/OS settings, or just type below',true);
  }
}
/* PRIMARY capture path: MediaRecorder → POST /api/voice/transcribe (server STT). This WORKS inside
   the cockpit iframe, where the browser's webkitSpeechRecognition is refused. getUserMedia +
   MediaRecorder + fetch are all permitted by the iframe's allow="microphone". */
let mediaRec=null, recChunks=[];
const HAS_MR = typeof window.MediaRecorder !== 'undefined';
let nativeWakeMonitor=null;
function clearNativeWakeMonitor(){ if(nativeWakeMonitor){ clearInterval(nativeWakeMonitor); nativeWakeMonitor=null; } }
function monitorNativeWakeCommand(){
  clearNativeWakeMonitor();
  if(!analyser) return;
  const samples=new Uint8Array(analyser.fftSize), started=Date.now();
  let heardVoice=false,lastVoice=started;
  nativeWakeMonitor=setInterval(()=>{
    if(!listening){ clearNativeWakeMonitor(); return; }
    analyser.getByteTimeDomainData(samples);
    let energy=0; for(const sample of samples) energy+=Math.abs(sample-128);
    const voiced=(energy/samples.length)>4.5;
    if(voiced){ heardVoice=true; lastVoice=Date.now(); }
    const elapsed=Date.now()-started;
    if((heardVoice && Date.now()-lastVoice>1100) || elapsed>12000){
      clearNativeWakeMonitor(); stopListening(heardVoice);
      if(!heardVoice) setStatus('I did not hear a command - tap the orb to try again',true);
    }
  },120);
}
function setSpeakerCaptureSuspended(suspended){
  document.dispatchEvent(new CustomEvent(suspended ? 'jarvis:speaker-capture-suspend' : 'jarvis:speaker-capture-resume', { detail:{ reason:'push-to-talk' } }));
}
function resumeAmbientAfterPushToTalk(){ setTimeout(()=>{ ambientController?.resume(); setSpeakerCaptureSuspended(false); },250); }
/* An empty transcript is NOT the same as "you mumbled". The server already distinguishes an
   unconfigured STT provider from a failed call from a genuinely silent clip and says so in the
   envelope (`fallback`) — but this surface used to print "Didn't catch that" for all of them,
   so on a deployment with no transcription service configured the user retries forever and
   blames their own diction. Pure on purpose: unit-tested from the HTML source (see
   tests/unit/jarvis-voice-failure-message.spec.ts). */
function voiceFailureMessage(envelope, httpOk, httpStatus){
  const env=(envelope&&envelope.data)||envelope||{};
  if(!httpOk&&httpStatus===401) return 'Session expired — reload the page to sign in again';
  if(env.fallback==='unconfigured') return 'Voice input isn’t set up on this deployment — type your question instead';
  if(env.fallback==='failed'||!httpOk) return 'Transcription failed — try again, or type';
  return 'Didn’t catch that — try again, or type';
}
async function transcribeAndSend(blob){
  setMode('thinking'); setStatus('Transcribing…');
  try{
    const fd=new FormData(); fd.append('audio', blob, 'speech.webm');
    const r=await fetch('/api/voice/transcribe',{ method:'POST', credentials:'include', body:fd });
    const j=await r.json().catch(()=>({}));
    const text=String(j.text||j.transcript||(j.data&&(j.data.text||j.data.transcript))||'').trim();
    if(text){ showCenterUserCopy(text); handleInput(text); return; }
    setMode('idle');
    const detail=String((j&&j.data&&j.data.message)||j.message||'').trim();
    if(detail) console.warn('[jarvis] transcription returned no text:',detail); // operator detail, not the user's problem
    setStatus(voiceFailureMessage(j, r.ok, r.status), true);
  }catch(e){ setMode('idle'); setStatus('Transcription failed — try again or type below',true); }
}
async function startListening(){
  ambientController?.suspend('Push-to-talk is active');
  setSpeakerCaptureSuspended(true);
  activeVoicePreviewFinish?.();
  activeSpeechFinish?.();
  speechSynthesis&&speechSynthesis.cancel();
  const ok=await startAnalyser();                 // mic capture + orb visualizer
  if(!ok||!micStream){ micBlocked(); return; }    // capture itself blocked → type fallback
  if(HAS_MR){
    try{
      recChunks=[]; mediaRec=new MediaRecorder(micStream);
      mediaRec.ondataavailable=(e)=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
      mediaRec.start();
      setMode('listening'); listening=true; micLabel.textContent='Stop & send'; micBtn.classList.add('live');
      setStatus('Recording… tap Stop & send when done');
      return;
    }catch(e){ /* fall through to SpeechRecognition */ }
  }
  // Fallback: browser SpeechRecognition (full-page only; iframes refuse it).
  if(!SR){ micBlocked(); return; }
  finalBuf=''; setMode('listening'); listening=true; wantListening=true; micLabel.textContent='Stop & send'; micBtn.classList.add('live');
  setStatus('Recording… tap Stop & send'); try{rec.start();}catch(e){}
}
function stopListening(send){
  clearNativeWakeMonitor();
  const releaseNativeMedia=nativeWakeCommandActive;
  nativeWakeCommandActive=false;
  listening=false; micLabel.textContent='Tap to talk'; micBtn.classList.remove('live');
  if(mediaRec && mediaRec.state!=='inactive'){
    mediaRec.onstop=()=>{
      const type=(mediaRec&&mediaRec.mimeType)||'audio/webm';
      const blob=new Blob(recChunks,{type}); mediaRec=null;
      if(releaseNativeMedia)releaseNativeWakeCommandMedia();
      resumeAmbientAfterPushToTalk();
      if(send && blob.size>1200){ transcribeAndSend(blob); }
      else { if(mode==='listening')setMode('idle'); if(send)setStatus('Didn’t catch anything — tap to try again',true); }
    };
    try{ mediaRec.stop(); }catch(_){ mediaRec=null; if(releaseNativeMedia)releaseNativeWakeCommandMedia(); if(mode==='listening')setMode('idle'); }
    return;
  }
  // SpeechRecognition fallback path
  wantListening=false; try{rec&&rec.stop();}catch(e){}
  resumeAmbientAfterPushToTalk();
  const text=finalBuf.trim();
  if(releaseNativeMedia)releaseNativeWakeCommandMedia();
  if(send&&text){ handleInput(text); }
  else { if(mode==='listening')setMode('idle'); if(send)setStatus('Didn’t catch anything — tap to try again',true); }
}

/* ── Media attachments: photo (camera/upload) + document ─────────────────────
   The user attaches media to a Jarvis prompt. Images are described by
   /api/vision/describe (the visual analog of the voice transcript) so the
   text-only Codex brain can reason over them; docs are read as text. Camera
   capture uses <input capture> (native camera app), not getUserMedia, which the
   cockpit iframe blocks. */
let pendingAttachments = [];              // { id, kind:'image'|'doc', name, dataUrl?, text? }
const MAX_ATTACH = 6, MAX_IMAGES = 4;

function attachId(){ return 'a'+Math.random().toString(36).slice(2,9); }
function showTyper(){ $('typer').classList.add('show'); }

function openAttachMenu(open){

/* Downscale a captured/selected image so the describe call stays cheap + small. */
function downscaleImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const max = 1024; let w = img.width, h = img.height;
      if (w>max || h>max){ const s = Math.min(max/w, max/h); w = Math.round(w*s); h = Math.round(h*s); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('could not read image')); };
    img.src = url;
  });
}

function readDocText(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=> resolve(String(fr.result||''));
    fr.onerror = ()=> reject(new Error('could not read file'));
    fr.readAsText(file);
  });
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=> resolve(String(fr.result||''));
    fr.onerror = ()=> reject(new Error('could not read file'));
    fr.readAsDataURL(file);
  });
}

/* PDF / Word binaries can't be read client-side — detect them for the server extractor. */
function isBinaryDoc(file){
  const n = (file.name||'').toLowerCase();
  if (/\.(pdf|docx)$/.test(n)) return true;
  const t = (file.type||'').toLowerCase();
  return t === 'application/pdf' || t === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
}

/* Server-side extraction for PDF/Word binaries (ADR-110 follow-up). ALWAYS returns an
   attachment: an unreadable file becomes an HONEST one (named + unreadable flag, which the
   server renders as "couldn't read this file" in the prompt) — never a silent drop. */
async function extractBinaryDoc(f){
  const name = f.name || 'document';
  try {
    const dataUrl = await fileToDataUrl(f);
    const r = await fetch('/api/vision/read-doc', {
      method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ name, dataUrl, mime: f.type||'' }),
    });
    const j = await r.json().catch(()=>({}));
    if (r.ok && j.ok && (j.text||'').trim()) return { id:attachId(), kind:'doc', name, text:j.text };
    return { id:attachId(), kind:'doc', name, unreadable:true, reason:(j && (j.reason || j.message || j.error)) || ('HTTP '+r.status) };
  } catch (e) {
    return { id:attachId(), kind:'doc', name, unreadable:true, reason: e.message || 'could not reach the document reader' };
  }
}

async function addImageFiles(files){
  let imgCount = pendingAttachments.filter(a=>a.kind==='image').length;
  for (const f of files){
    if (pendingAttachments.length>=MAX_ATTACH || imgCount>=MAX_IMAGES) break;
    if (!/^image\//.test(f.type||'')) continue;
    try { const dataUrl = await downscaleImage(f); pendingAttachments.push({ id:attachId(), kind:'image', name:f.name||'photo.jpg', dataUrl }); imgCount++; }
    catch { /* skip unreadable image */ }
  }
  renderAttachStrip(); showTyper();
}

async function addDocFiles(files){
  for (const f of files){
    if (pendingAttachments.length>=MAX_ATTACH) break;
    if (isBinaryDoc(f)){
      // PDF / Word → the server extractor (pdf-parse / docx). Bigger cap: binary, not text.
      if (f.size > 8*1024*1024){ setStatus('That document is too large (max 8MB).', true); continue; }
      setStatus('Reading ' + (f.name || 'document') + '…');
      pendingAttachments.push(await extractBinaryDoc(f));
      renderAttachStrip();
      continue;
    }
    if (f.size > 2*1024*1024){ setStatus('That document is too large (max 2MB of text).', true); continue; }
    const name = f.name || 'document.txt';
    try {
      const text = await readDocText(f);
      if (text.trim()) pendingAttachments.push({ id:attachId(), kind:'doc', name, text });
      else pendingAttachments.push({ id:attachId(), kind:'doc', name, unreadable:true, reason:'no readable text found in the file' });
    }
    catch { pendingAttachments.push({ id:attachId(), kind:'doc', name, unreadable:true, reason:'could not read file' }); }
  }
  renderAttachStrip(); showTyper();
}

function removeAttachment(id){ pendingAttachments = pendingAttachments.filter(a=>a.id!==id); renderAttachStrip(); }

function renderAttachStrip(){
  const strip = $('attachStrip');
  if (!pendingAttachments.length){ strip.setAttribute('hidden',''); strip.innerHTML=''; return; }
  strip.removeAttribute('hidden');
  strip.innerHTML = pendingAttachments.map(a=>{
    const media = a.kind==='image' ? `<img class="attach-thumb" src="${a.dataUrl}" alt="">` : `<span class="attach-doc-ic">${a.unreadable?'⚠️':'📄'}</span>`;
    return `<span class="attach-chip" data-id="${a.id}">${media}<span class="attach-name">${esc(a.name)}${a.unreadable?' (couldn’t read)':''}</span>`
      + `<button type="button" class="attach-x" data-x="${a.id}" title="Remove" aria-label="Remove ${esc(a.name)}">✕</button></span>`;
  }).join('');
  strip.querySelectorAll('.attach-x').forEach(b=> b.addEventListener('click', ()=> removeAttachment(b.getAttribute('data-x'))));
}

/* Describe attached images via the accountable server route. Returns the whole payload:
   { description, sections? } — sections is one labeled description per image when the
   model honored the per-image markers (2+ images), else absent (combined fallback). */
async function describeImages(images, question){
  const r = await fetch('/api/vision/describe', {
    method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ images: images.map(a=>({ dataUrl:a.dataUrl })), question: question||'', sessionId: SESSION_ID }),
  });
  const j = await r.json().catch(()=>({}));
  if (r.status===503) throw new Error(j.message || 'image understanding isn’t configured');
  if (!r.ok || !j.description) throw new Error(j.message || j.error || ('HTTP '+r.status));
  return j;
}

function attachNoteText(atts){
  const imgs = atts.filter(a=>a.kind==='image').length, docs = atts.filter(a=>a.kind==='doc').length;
  const bits=[]; if(imgs) bits.push(imgs+' photo'+(imgs>1?'s':'')); if(docs) bits.push(docs+' document'+(docs>1?'s':''));
  return bits.join(', ');
}

/* ── Print / save this conversation ─────────────────────────────────────────
   Opens a TOP-LEVEL window and writes an ink-on-paper document into it. Two reasons it is not
   `window.print()` on this surface: printing from inside a same-origin iframe is inconsistent
   across browsers, and this surface is a dark, chrome-heavy dashboard whose printout would be
   unreadable and waste a cartridge. The new window is plain black-on-white, so the browser's own
   "Save as PDF" also produces something worth keeping — which is what "refer to it later" means. */
function printConversation() {
  const turns = [];
  document.querySelectorAll('#convo .msg').forEach((m) => {
    const who = m.classList.contains('user') ? 'You' : (assistantLabel() || 'Jarvis');
    const bx = m.querySelector('.bx');
    if (bx && bx.textContent.trim()) turns.push({ who, html: bx.innerHTML });
  });
  // Fall back to the latest result when the conversation panel has not been opened this session.
  if (!turns.length) {
    const latest = $('resultContent');
    if (latest && latest.textContent.trim()) {
      turns.push({ who: assistantLabel() || 'Jarvis', html: latest.innerHTML });
    }
  }
  if (!turns.length) { try { statusEl.textContent = 'Nothing to print yet.'; } catch (_) {} return; }

  const win = window.open('', '_blank');
  if (!win) { try { statusEl.textContent = 'Allow pop-ups to print the conversation.'; } catch (_) {} return; }
  const when = new Date().toLocaleString();
  const title = (assistantLabel() || 'Jarvis') + ' — conversation';
  // The turn HTML is already-rendered, already-sanitised markdown from renderMarkdown(); it is
  // moved across verbatim so the printout matches the screen exactly. The two interpolated
  // strings are escaped.
  win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>'
    + 'body{background:#fff;color:#111;font:12pt/1.55 Georgia,"Times New Roman",serif;max-width:44em;margin:2.5em auto;padding:0 1.5em}'
    + 'h1{font:700 16pt/1.2 Georgia,serif;margin:0 0 .2em}.when{color:#555;font-size:10pt;margin:0 0 2em}'
    + '.t{margin:0 0 1.6em;page-break-inside:avoid}.who{font:700 9pt/1 Arial,sans-serif;letter-spacing:.09em;'
    + 'text-transform:uppercase;color:#666;margin:0 0 .45em}.bx{margin:0}'
    + 'table{border-collapse:collapse;width:100%;font-size:10.5pt;margin:.7em 0}'
    + 'th,td{border:1px solid #999;padding:5px 8px;text-align:left}th{background:#eee}'
    + 'pre{background:#f4f4f4;border:1px solid #ddd;padding:.6em;overflow-x:auto;font-size:9.5pt;white-space:pre-wrap}'
    + 'img,svg{max-width:100%;height:auto}a{color:#111}'
    + '@media print{body{margin:0;max-width:none}@page{margin:2cm}}'
    + '</style></head><body><h1>' + esc(title) + '</h1><p class="when">' + esc(when) + '</p>'
    + turns.map((t) => '<div class="t"><p class="who">' + esc(t.who) + '</p><div class="bx">' + t.html + '</div></div>').join('')
    + '</body></html>');
  win.document.close();
  win.focus();
  // Let images and any rendered diagram settle before the dialog opens, or the first page prints blank.
  setTimeout(() => { try { win.print(); } catch (_) {} }, 350);
}

  const presets = [
    ['Summarize my inbox', 'Summarize my inbox and flag anything urgent.'],
    ['Jobs worth a look', 'Any jobs worth a look today, and how I should approach them?'],
    ['Map it as a diagram', 'Draw me a diagram of everything you can do and how the apps connect.'],
  ];
  $('chips').innerHTML = presets.map(([label, q]) => `<button class="chip" data-q="${esc(q)}">${esc(label)}</button>`).join('');
  $('chips').querySelectorAll('[data-q]').forEach((c) => c.onclick = () => handleInput(c.getAttribute('data-q')));
}

loadStarters();
loadOverview();
setInterval(loadOverview, 60000);
loadActivity();
setInterval(loadActivity, 5000);   // brisk so the backdrop tracks who's actually grinding
loadThreads();                     // search the queue on load → show the user's open conversations
setInterval(loadThreads, 45000);
startShelfPoller();
</script>
</body>
