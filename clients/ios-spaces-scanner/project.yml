# XcodeGen project spec for the OSHAL Spaces LiDAR scanner (native iOS).
#
# Why XcodeGen (and not a hand-written .pbxproj): an Xcode project file is a large,
# order-sensitive, UUID-keyed plist that is extremely error-prone to write or edit
# by hand and merges terribly. XcodeGen generates a fresh, correct .xcodeproj from
# this readable spec. Regenerate any time with `xcodegen generate` in this folder.
#
# Usage (on a Mac with Xcode + XcodeGen installed):
#   brew install xcodegen
#   cd clients/ios-spaces-scanner
#   xcodegen generate
#   open SpacesScanner.xcodeproj
# Then set your Signing Team + a unique bundle id, pick your iPhone, and Run.

name: SpacesScanner

options:
  bundleIdPrefix: com.emeraldcoastsystemsgroup.oshal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en

targets:
  SpacesScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        # Hand-written Info.plist (kept out of the Sources glob at the project root).
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # CHANGE ME: a globally-unique reverse-DNS bundle id you control.
        PRODUCT_BUNDLE_IDENTIFIER: com.emeraldcoastsystemsgroup.oshal.spacesscanner
        PRODUCT_NAME: SpacesScanner
        # iPhone only (1). LiDAR-capable iPads also qualify; add 2 for universal.
        TARGETED_DEVICE_FAMILY: "1"
        # CHANGE ME: your 10-character Apple Developer Team ID (Xcode > Signing).
        # Leave blank and set the Team in Xcode's Signing & Capabilities instead.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
