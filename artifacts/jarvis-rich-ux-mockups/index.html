<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis Rich Response UX Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a12;
      --panel: rgba(19, 20, 34, 0.88);
      --panel-strong: rgba(26, 28, 47, 0.96);
      --card: rgba(33, 35, 58, 0.66);
      --card-hover: rgba(43, 46, 74, 0.76);
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);
      --text: #f4f4fa;
      --muted: #a6a8c2;
      --faint: #6f718d;
      --accent: #8585ff;
      --accent-2: #a66cff;
      --accent-soft: rgba(133, 133, 255, 0.16);
      --ok: #46d7a4;
      --warn: #ffc85c;
      --danger: #ff7489;
      --sky: #67c9ff;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
      --radius: 22px;
      --radius-sm: 14px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 22% 10%, rgba(113, 97, 255, 0.13), transparent 34rem),
        radial-gradient(circle at 80% 76%, rgba(40, 180, 255, 0.08), transparent 32rem),
        var(--bg);
      font-family: var(--font);
      overflow: hidden;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(133, 133, 255, 0.42);
      outline-offset: 2px;
    }

    .labbar {
      height: 72px;
      display: grid;
      grid-template-columns: minmax(220px, 0.7fr) minmax(390px, 1.25fr) minmax(340px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 9, 17, 0.86);
      backdrop-filter: blur(24px) saturate(145%);
      position: relative;
      z-index: 20;
    }

    .lab-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .lab-mark {
      width: 38px; height: 38px; border-radius: 50%; flex: none;
      background: radial-gradient(circle at 36% 30%, #fff 0 4%, var(--accent) 18%, #362a92 48%, #10101c 74%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.15), 0 0 28px rgba(133,133,255,.35);
      position: relative;
    }
    .lab-mark::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #05050a; box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); }
    .lab-title { font-size: 14px; font-weight: 760; letter-spacing: -0.01em; white-space: nowrap; }
    .lab-sub { color: var(--faint); font-size: 11px; margin-top: 2px; white-space: nowrap; }
    .demo-flag { color: var(--warn); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

    .segmented { display: flex; gap: 5px; padding: 5px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 15px; min-width: 0; }
    .segmented button {
      flex: 1; border: 0; background: transparent; color: var(--muted); padding: 9px 10px; border-radius: 10px;
      cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; transition: .18s ease;
    }
    .segmented button:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .segmented button.active { color: #fff; background: linear-gradient(135deg, rgba(133,133,255,.9), rgba(166,108,255,.82)); box-shadow: 0 8px 24px rgba(92,72,220,.25); }
    .scenario-nav { display: flex; justify-content: flex-end; gap: 8px; align-items: center; min-width: 0; }
    .scenario-nav label { color: var(--faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .scenario-nav select, .notes-button {
      background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--text); border-radius: 11px; padding: 9px 12px;
    }
    .scenario-nav select { min-width: 174px; }
    .scenario-nav option { color: #111; }
    .notes-button { cursor: pointer; font-size: 12px; font-weight: 700; }
    .notes-button:hover { border-color: var(--accent); }

    .workspace { height: calc(100dvh - 72px); display: flex; position: relative; }
    #stage { flex: 1; min-width: 0; height: 100%; overflow: hidden; }
    .design-notes {
      width: 340px; flex: none; border-left: 1px solid var(--line); background: rgba(13,14,24,.95); backdrop-filter: blur(22px);
      padding: 24px; overflow-y: auto; transition: margin-right .24s ease, transform .24s ease; z-index: 15;
    }
    .design-notes.closed { margin-right: -340px; transform: translateX(16px); }
    .notes-eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .13em; font-size: 10px; font-weight: 800; }
    .design-notes h2 { font-size: 22px; line-height: 1.2; margin: 8px 0 9px; letter-spacing: -.03em; }
    .design-notes > p { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .note-card { margin-top: 18px; padding: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.035); border-radius: 15px; }
    .note-card h3 { margin: 0 0 10px; font-size: 12px; }
    .note-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .note-card li + li { margin-top: 5px; }
    .fit-meter { display: grid; gap: 9px; margin-top: 12px; }
    .fit-row { display: grid; grid-template-columns: 88px 1fr 30px; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .fit-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .fit-track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    .concept-shell { height: 100%; position: relative; overflow: hidden; }
    .concept-shell::before {
      content: ""; position: absolute; width: 460px; height: 460px; left: 20%; top: 5%; border-radius: 50%;
      background: rgba(111, 94, 255, .07); filter: blur(90px); pointer-events: none;
    }
    .app-badge { display: inline-flex; align-items: center; gap: 7px; color: var(--faint); font-size: 11px; }
    .app-badge i { width: 7px; height: 7px; background: var(--ok); border-radius: 50%; box-shadow: 0 0 10px var(--ok); }
    .source-line { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--faint); font-size: 10.5px; margin-top: 12px; }
    .source-line span { display: inline-flex; gap: 5px; align-items: center; }

    .orb {
      width: 88px; aspect-ratio: 1; border-radius: 50%; position: relative;
      background: radial-gradient(circle at 36% 31%, #fff 0 3%, #b8b6ff 9%, var(--accent) 27%, #402f9b 53%, #0d0d18 73%);
      box-shadow: 0 0 60px rgba(126,112,255,.36), inset 0 0 18px rgba(255,255,255,.18);
    }
    .orb::before { content: ""; position: absolute; inset: -13px; border: 1px solid rgba(144,132,255,.28); border-radius: 50%; animation: breathe 3.5s ease-in-out infinite; }
    .orb::after { content: ""; position: absolute; width: 23px; height: 23px; left: 32px; top: 33px; border-radius: 50%; background: #030307; box-shadow: inset 0 0 0 3px rgba(255,255,255,.12); }
    .orb.small { width: 43px; }
    .orb.small::before { inset: -7px; }
    .orb.small::after { width: 12px; height: 12px; left: 15px; top: 16px; }
    @keyframes breathe { 0%,100% { transform: scale(.96); opacity: .5; } 50% { transform: scale(1.06); opacity: 1; } }

    .composer {
      display: flex; align-items: center; gap: 10px; padding: 9px 11px 9px 16px;
      background: rgba(20,21,35,.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 42px rgba(0,0,0,.28); backdrop-filter: blur(24px);
    }
    .composer input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 13px; }
    .composer input::placeholder { color: var(--faint); }
    .mic-button, .send-button {
      border: 0; cursor: pointer; display: grid; place-items: center; border-radius: 12px; flex: none;
    }
    .mic-button { width: 36px; height: 36px; background: var(--accent-soft); color: #c4c4ff; }
    .send-button { height: 36px; padding: 0 14px; background: var(--accent); color: white; font-size: 12px; font-weight: 760; }

    .user-turn { display: flex; justify-content: flex-end; }
    .user-bubble { max-width: 72%; padding: 10px 14px; border-radius: 17px 17px 5px 17px; background: rgba(133,133,255,.14); border: 1px solid rgba(133,133,255,.22); color: #dcdcff; font-size: 13px; }
    .jarvis-label { color: var(--faint); text-transform: uppercase; letter-spacing: .1em; font-size: 9px; font-weight: 800; margin-bottom: 6px; }
    .spoken { font-size: 16px; line-height: 1.55; letter-spacing: -.012em; }

    .response-surface { margin-top: 14px; display: grid; gap: 12px; }
    .response-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .response-kicker { color: var(--accent); text-transform: uppercase; letter-spacing: .11em; font-size: 10px; font-weight: 800; }
    .response-title { font-size: clamp(20px, 2.5vw, 31px); letter-spacing: -.04em; line-height: 1.12; margin: 5px 0 0; }
    .demo-chip { flex: none; border-radius: 999px; padding: 5px 8px; background: rgba(255,200,92,.1); color: var(--warn); border: 1px solid rgba(255,200,92,.2); font-size: 9px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .block-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; min-width: 0; }
    .block {
      grid-column: span 12; min-width: 0; padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.025));
      box-shadow: inset 0 1px rgba(255,255,255,.045);
    }
    .block.half { grid-column: span 6; }
    .block.third { grid-column: span 4; }
    .block.two-thirds { grid-column: span 8; }
    .block-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .block-title h3 { margin: 0; font-size: 12px; letter-spacing: -.01em; }
    .block-title span { color: var(--faint); font-size: 10px; }

    .weather-hero { overflow: hidden; padding: 0; min-height: 208px; position: relative; background: linear-gradient(135deg, rgba(63,116,194,.52), rgba(83,65,174,.44) 58%, rgba(20,23,48,.8)); }
    .weather-hero::before { content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; right: -72px; top: -98px; background: radial-gradient(circle, rgba(255,231,155,.94) 0 11%, rgba(255,204,99,.3) 13%, transparent 60%); }
    .weather-hero::after { content: ""; position: absolute; width: 250px; height: 76px; right: -35px; top: 63px; border-radius: 50%; background: rgba(235,243,255,.27); filter: blur(5px); box-shadow: -100px 23px 0 rgba(235,243,255,.14); }
    .weather-inner { padding: 18px; height: 100%; position: relative; z-index: 1; display: flex; flex-direction: column; }
    .weather-place { font-size: 11px; color: rgba(255,255,255,.74); font-weight: 700; }
    .weather-temp { font-size: 62px; font-weight: 620; line-height: 1; letter-spacing: -.07em; margin-top: 18px; }
    .weather-condition { font-size: 14px; font-weight: 700; }
    .weather-detail { color: rgba(255,255,255,.7); font-size: 11px; margin-top: 4px; }
    .weather-alert { margin-top: auto; display: inline-flex; align-self: flex-start; gap: 7px; align-items: center; background: rgba(7,8,18,.28); border: 1px solid rgba(255,255,255,.13); padding: 7px 9px; border-radius: 9px; font-size: 10px; }

    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .metric { border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.027); border-radius: 11px; padding: 11px; min-height: 72px; }
    .metric-label { color: var(--faint); font-size: 9.5px; font-weight: 760; text-transform: uppercase; letter-spacing: .07em; }
    .metric-value { font-size: 19px; font-weight: 760; letter-spacing: -.03em; margin-top: 6px; }
    .metric-note { color: var(--muted); font-size: 9.5px; margin-top: 3px; }
    .metric.good .metric-value { color: var(--ok); }
    .metric.warn .metric-value { color: var(--warn); }

    .chart-wrap { width: 100%; overflow: hidden; }
    .chart-svg { display: block; width: 100%; height: 154px; overflow: visible; }
    .chart-labels { display: grid; gap: 2px; color: var(--faint); font-size: 9px; text-align: center; margin-top: 2px; }
    .chart-legend { display: flex; gap: 12px; margin-top: 9px; color: var(--muted); font-size: 9.5px; }
    .chart-legend i { display: inline-block; width: 15px; height: 2px; margin-right: 5px; vertical-align: middle; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .data-table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table th { color: var(--faint); font-size: 9px; text-transform: uppercase; letter-spacing: .07em; font-weight: 780; text-align: left; border-bottom: 1px solid var(--line); padding: 0 8px 9px; white-space: nowrap; }
    .data-table td { border-bottom: 1px solid rgba(255,255,255,.055); padding: 10px 8px; color: var(--muted); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table td:first-child { color: var(--text); font-weight: 650; }
    .status-pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); padding: 4px 7px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .status-pill.ok::before { background: var(--ok); }
    .status-pill.warn::before { background: var(--warn); }
    .status-pill.danger::before { background: var(--danger); }

    .timeline { display: grid; gap: 2px; }
    .timeline-item { display: grid; grid-template-columns: 62px 15px 1fr; gap: 7px; min-height: 53px; color: var(--muted); font-size: 10.5px; }
    .timeline-time { padding-top: 2px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .timeline-rail { position: relative; display: flex; justify-content: center; }
    .timeline-rail::before { content: ""; position: absolute; top: 10px; bottom: -5px; width: 1px; background: var(--line); }
    .timeline-item:last-child .timeline-rail::before { display: none; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--accent); box-shadow: 0 0 0 4px rgba(133,133,255,.1); z-index: 1; }
    .timeline-copy strong { display: block; color: var(--text); font-size: 11px; margin-bottom: 2px; }

    .gallery { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; min-height: 228px; }
    .gallery figure { margin: 0; position: relative; overflow: hidden; border-radius: 12px; min-height: 108px; background: #171826; }
    .gallery figure:first-child { grid-row: span 2; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.88) contrast(1.02); transition: transform .28s ease; }
    .gallery figure:hover img { transform: scale(1.035); }
    .gallery figcaption { position: absolute; inset: auto 0 0; padding: 24px 10px 9px; background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 9.5px; color: #fff; }

    .preference-form { display: grid; gap: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .field label { display: block; color: var(--faint); font-size: 9px; font-weight: 760; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
    .field select, .field input[type="text"] { width: 100%; border: 1px solid var(--line); background: rgba(0,0,0,.16); color: var(--text); border-radius: 9px; padding: 9px; font-size: 11px; }
    .field option { color: #111; }
    .range-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .range-row input { accent-color: var(--accent); width: 100%; }
    .range-value { color: var(--text); font-size: 11px; font-variant-numeric: tabular-nums; }

    .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .action {
      border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 10px; padding: 9px 11px;
      cursor: pointer; font-size: 10.5px; font-weight: 720; transition: .16s ease;
    }
    .action:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
    .action.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .action.danger { color: var(--danger); }

    /* Option A — an evolution of today's bounded conversation. */
    .inline-shell { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; padding: 24px; overflow: auto; }
    .inline-main { width: min(850px, 100%); margin: 0 auto; padding: 28px 0 110px; position: relative; }
    .inline-hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
    .inline-hero .orb { width: 68px; }
    .inline-hero .orb::after { width: 18px; height: 18px; left: 25px; top: 26px; }
    .inline-hero h1 { font-size: 16px; margin: 15px 0 4px; }
    .inline-hero p { color: var(--faint); font-size: 11px; margin: 0; }
    .conversation { display: grid; gap: 18px; }
    .assistant-turn { min-width: 0; }
    .inline-card { margin-top: 12px; border: 1px solid var(--line-strong); background: rgba(22,23,39,.74); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .inline-card .block-grid { margin-top: 15px; }
    .inline-card .weather-hero { grid-column: span 7; }
    .inline-card .metrics-block { grid-column: span 5; }
    .inline-card .chart-block { grid-column: span 7; }
    .inline-card .table-block { grid-column: span 12; }
    .inline-composer { position: sticky; bottom: 18px; width: min(700px, calc(100% - 20px)); margin: 22px auto 0; z-index: 5; }
    .inline-rail { position: sticky; top: 0; align-self: start; display: grid; gap: 11px; }
    .rail-card { border: 1px solid var(--line); background: rgba(255,255,255,.035); border-radius: 14px; padding: 13px; }
    .rail-card h3 { margin: 0 0 10px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
    .rail-item { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10.5px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .rail-item:last-child { border: 0; }
    .rail-item i { width: 6px; height: 6px; background: var(--ok); border-radius: 50%; }

    /* Option B — the recommended adaptive answer canvas. */
    .canvas-shell { display: flex; flex-direction: column; padding: 18px 22px; }
    .canvas-topbar { height: 55px; display: flex; align-items: center; justify-content: space-between; flex: none; }
    .jarvis-presence { display: flex; align-items: center; gap: 13px; }
    .presence-title { font-size: 13px; font-weight: 760; }
    .presence-state { color: var(--faint); font-size: 10px; margin-top: 2px; }
    .canvas-tools { display: flex; gap: 7px; }
    .icon-button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.035); cursor: pointer; color: var(--muted); }
    .canvas-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 0 105px; }
    .canvas-answer { max-width: 1160px; margin: 0 auto; }
    .canvas-prompt { color: var(--faint); font-size: 11px; margin-bottom: 13px; }
    .canvas-spoken { max-width: 760px; font-size: clamp(17px, 2vw, 22px); line-height: 1.5; letter-spacing: -.025em; margin-bottom: 22px; }
    .canvas-card { border: 1px solid var(--line-strong); border-radius: 26px; background: rgba(19,20,34,.7); padding: clamp(18px, 2.4vw, 28px); box-shadow: var(--shadow); backdrop-filter: blur(28px); }
    .canvas-card .block-grid { margin-top: 19px; }
    .canvas-card .weather-hero { grid-column: span 5; }
    .canvas-card .metrics-block { grid-column: span 3; }
    .canvas-card .chart-block { grid-column: span 7; }
    .canvas-card .table-block { grid-column: span 8; }
    .canvas-card .gallery-block { grid-column: span 8; }
    .canvas-card .form-block { grid-column: span 4; }
    .canvas-dock { position: absolute; left: 50%; bottom: 20px; width: min(720px, calc(100% - 44px)); transform: translateX(-50%); z-index: 8; }

    /* Option C — persistent conversation plus artifact workbench. */
    .workbench-shell { display: grid; grid-template-columns: 310px minmax(0, 1fr); }
    .chat-pane { border-right: 1px solid var(--line); background: rgba(12,13,23,.78); display: flex; flex-direction: column; min-height: 0; }
    .chat-head { display: flex; align-items: center; gap: 12px; padding: 19px; border-bottom: 1px solid var(--line); }
    .chat-head-copy strong { font-size: 13px; }
    .chat-head-copy span { display: block; color: var(--faint); font-size: 10px; margin-top: 2px; }
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 17px; }
    .mini-turn { font-size: 11px; line-height: 1.55; }
    .mini-turn.user { align-self: flex-end; max-width: 86%; padding: 9px 11px; background: var(--accent-soft); border: 1px solid rgba(133,133,255,.2); border-radius: 13px 13px 4px 13px; color: #ddddff; }
    .mini-turn.jarvis { color: var(--muted); }
    .mini-turn.jarvis strong { display: block; color: var(--text); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .open-artifact { border-left: 2px solid var(--accent); padding-left: 10px; }
    .chat-compose { padding: 14px; border-top: 1px solid var(--line); }
    .chat-compose .composer { padding-left: 12px; }
    .chat-compose .send-button { padding: 0 10px; }
    .artifact-pane { min-width: 0; display: flex; flex-direction: column; }
    .artifact-head { height: 74px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
    .artifact-name { min-width: 0; }
    .artifact-name span { color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; font-weight: 780; }
    .artifact-name h1 { margin: 4px 0 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artifact-tabs { display: flex; gap: 5px; }
    .artifact-tab { border: 1px solid transparent; background: transparent; color: var(--faint); border-radius: 9px; padding: 8px 10px; cursor: pointer; font-size: 10px; font-weight: 720; }
    .artifact-tab:hover { color: var(--text); }
    .artifact-tab.active { color: var(--text); border-color: var(--line); background: rgba(255,255,255,.045); }
    .artifact-scroll { flex: 1; min-height: 0; overflow: auto; padding: 21px 22px 80px; }
    .artifact-content { max-width: 1120px; margin: 0 auto; }
    .artifact-summary { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
    .artifact-summary p { max-width: 680px; color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
    .workbench-shell .weather-hero { grid-column: span 5; }
    .workbench-shell .metrics-block { grid-column: span 3; }
    .workbench-shell .chart-block { grid-column: span 7; }
    .workbench-shell .table-block { grid-column: span 8; }
    .workbench-shell .gallery-block { grid-column: span 8; }
    .workbench-shell .form-block { grid-column: span 4; }
    .workbench-shell .block[data-hidden="true"] { display: none; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #f1f1ff; color: #17172a; border-radius: 11px; padding: 10px 14px; font-size: 11px; font-weight: 720; opacity: 0; pointer-events: none; transition: .2s ease; z-index: 50; box-shadow: var(--shadow); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1180px) {
      .labbar { grid-template-columns: 205px 1fr auto; }
      .lab-sub, .scenario-nav label { display: none; }
      .scenario-nav select { min-width: 140px; }
      .design-notes { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: -30px 0 70px rgba(0,0,0,.38); }
      .design-notes.closed { margin-right: 0; transform: translateX(100%); }
      .inline-shell { grid-template-columns: 1fr; }
      .inline-rail { display: none; }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .labbar { height: auto; min-height: 126px; grid-template-columns: 1fr auto; padding: 13px 14px; gap: 10px; }
      .lab-brand { grid-column: 1; }
      .segmented { grid-column: 1 / -1; grid-row: 2; order: 3; }
      .scenario-nav { grid-column: 2; grid-row: 1; }
      .notes-button { display: none; }
      .scenario-nav select { min-width: 0; width: 145px; }
      .workspace { height: calc(100dvh - 126px); }
      .design-notes { display: none; }
      .inline-shell { padding: 14px; }
      .inline-main { padding-top: 15px; }
      .canvas-shell { padding: 11px 13px; }
      .workbench-shell { grid-template-columns: 1fr; }
      .chat-pane { display: none; }
      .artifact-head { height: auto; align-items: flex-start; flex-direction: column; padding: 14px; gap: 10px; }
      .artifact-tabs { overflow-x: auto; width: 100%; }
      .artifact-scroll { padding: 15px 14px 90px; }
      .block.half, .block.third, .block.two-thirds,
      .inline-card .weather-hero, .inline-card .metrics-block, .inline-card .chart-block,
      .canvas-card .weather-hero, .canvas-card .metrics-block, .canvas-card .chart-block, .canvas-card .table-block, .canvas-card .gallery-block, .canvas-card .form-block,
      .workbench-shell .weather-hero, .workbench-shell .metrics-block, .workbench-shell .chart-block, .workbench-shell .table-block, .workbench-shell .gallery-block, .workbench-shell .form-block { grid-column: span 12; }
      .gallery { grid-template-columns: 1fr 1fr; min-height: 320px; }
      .gallery figure:first-child { grid-column: span 2; grid-row: auto; }
      .field-row { grid-template-columns: 1fr; }
      .response-title { font-size: 23px; }
      .inline-hero { margin-bottom: 20px; }
      .canvas-topbar { height: 48px; }
    }

    @media (max-width: 520px) {
      .lab-title { font-size: 12px; }
      .lab-mark { width: 32px; height: 32px; }
      .lab-mark::after { inset: 10px; }
      .segmented button { padding: 8px 5px; font-size: 10px; }
      .scenario-nav select { width: 124px; font-size: 10px; padding: 8px; }
      .inline-card, .canvas-card { padding: 14px; border-radius: 18px; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .weather-temp { font-size: 52px; }
      .artifact-tabs { gap: 2px; }
      .artifact-tab { padding: 7px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="labbar">
    <div class="lab-brand">
      <div class="lab-mark" aria-hidden="true"></div>
      <div>
        <div class="lab-title">Jarvis Rich Response Lab</div>
        <div class="lab-sub"><span class="demo-flag">Prototype</span> · isolated from production Jarvis</div>
      </div>
    </div>

    <nav class="segmented" id="conceptNav" aria-label="Choose a UX concept">
      <button type="button" data-concept="inline">A · Conversation+</button>
      <button type="button" data-concept="canvas" class="active">B · Answer Canvas</button>
      <button type="button" data-concept="workbench">C · Workbench</button>
    </nav>

    <div class="scenario-nav">
      <label for="scenarioSelect">Demo response</label>
      <select id="scenarioSelect">
        <option value="weather">Weather today</option>
        <option value="briefing">Morning briefing</option>
        <option value="weekend">Weekend planner</option>
      </select>
      <button class="notes-button" id="notesToggle" type="button" aria-expanded="true">Design notes</button>
    </div>
  </header>

  <div class="workspace">
    <main id="stage" aria-live="polite"></main>
    <aside class="design-notes" id="designNotes" aria-label="Concept notes"></aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const responses = {
      weather: {

        spokenSummary: "It’s 84 degrees and humid. Your best outdoor window is before 2 PM; storms are most likely late afternoon.",
        source: "National Weather Service · prototype payload",
        updated: "Updated 8:42 AM",
        blocks: [
          {
            type: "weather", tab: "overview", className: "weather-hero",
            place: "Chicago, Illinois", temperature: "84°", condition: "Partly cloudy",
            detail: "Feels like 91° · High 88° · Low 72°", alert: "Storm chance rises after 3 PM"
          },
          {
            type: "metrics", tab: "overview", className: "metrics-block",
            title: "At a glance", items: [
              { label: "Rain", value: "68%", note: "Peak 4–6 PM", tone: "warn" },
              { label: "Humidity", value: "74%", note: "Feels warmer" },
              { label: "Wind", value: "SW 12", note: "Gusts 22 mph" },
              { label: "Sunset", value: "8:29", note: "9h 47m away", tone: "good" }
            ]
          },
          {
            type: "lineChart", tab: "visuals", className: "chart-block", title: "Temperature & rain risk", note: "Next 8 hours",
            labels: ["10a", "12p", "2p", "4p", "6p", "8p", "10p"],
            series: [
              { name: "Temperature °F", color: "#ffc85c", values: [82, 85, 88, 86, 81, 77, 74] },
              { name: "Rain chance %", color: "#67c9ff", values: [12, 18, 31, 68, 62, 39, 22] }
            ]
          },
          {
            type: "table", tab: "data", className: "table-block", title: "Best windows", note: "Local time",
            columns: ["Window", "Conditions", "Rain", "Recommendation"],
            rows: [
              ["Now–12 PM", "Partly cloudy · 82–85°", "12–18%", { label: "Best outside", tone: "ok" }],
              ["12–3 PM", "Hot & humid · 85–88°", "18–42%", { label: "Use caution", tone: "warn" }],
              ["3–7 PM", "Scattered storms · 80–86°", "58–68%", { label: "Stay flexible", tone: "danger" }]
            ]
          },
          {
            type: "actions", tab: "act", title: "Useful follow-ups", actions: [
              { label: "Plan my outdoor window", primary: true }, { label: "Show radar" }, { label: "What should I wear?" }
            ]
          }
        ]
      },
      briefing: {
        prompt: "Give me my morning briefing.",
        kicker: "Today · Thursday, July 9",
        title: "A focused day with one conflict to resolve",
        spokenSummary: "You have two meetings, one urgent email, and three priority tasks. Your 1 PM review overlaps a customer call by fifteen minutes.",
        source: "Calendar + email + OSHAL work queue · demo data",
        updated: "Synced just now",
        blocks: [
          {
            type: "metrics", tab: "overview", className: "metrics-block", title: "Today at a glance", items: [
              { label: "Meetings", value: "4", note: "2 require prep" },
              { label: "Focus time", value: "2h 10m", note: "Longest: 45 min", tone: "warn" },
              { label: "Priority tasks", value: "3", note: "1 due by noon" },
              { label: "Urgent email", value: "1", note: "Customer escalation", tone: "warn" }
            ]
          },
          {
            type: "timeline", tab: "overview", className: "timeline-block", title: "Schedule", note: "4 events", items: [
              { time: "9:30 AM", title: "Platform stand-up", note: "Engineering · 25 minutes" },
              { time: "11:00 AM", title: "Proposal focus block", note: "Protected time · 45 minutes" },
              { time: "1:00 PM", title: "Architecture review", note: "Conflict starts at 1:45 PM" },
              { time: "1:45 PM", title: "Customer call", note: "Prep brief is ready" }
            ]
          },
          {
            type: "barChart", tab: "visuals", className: "chart-block", title: "Attention load", note: "By part of day",
            labels: ["Morning", "Midday", "Afternoon", "Evening"], values: [62, 38, 88, 24], color: "#8585ff"
          },
          {
            type: "table", tab: "data", className: "table-block", title: "What needs attention", note: "Ranked by urgency",
            columns: ["Item", "Owner", "Due", "State"],
            rows: [
              ["Reply to customer escalation", "You", "10:30 AM", { label: "Urgent", tone: "danger" }],
              ["Review solution outline", "You", "12:00 PM", { label: "In progress", tone: "warn" }],
              ["Approve release notes", "Maya", "3:00 PM", { label: "Waiting", tone: "" }],
              ["Send weekly recap", "Jarvis", "4:30 PM", { label: "Ready", tone: "ok" }]
            ]
          },
          {
            type: "actions", tab: "act", title: "Suggested next step", actions: [
              { label: "Resolve the 1 PM conflict", primary: true }, { label: "Draft urgent reply" }, { label: "Protect focus time" }
            ]
          }
        ]
      },
      weekend: {
        prompt: "Plan a relaxed weekend in Chicago with good food and architecture.",
        kicker: "Weekend plan · Chicago",
        title: "River views, neighborhood food, and room to wander",
        spokenSummary: "I built a relaxed two-day plan around architecture, the river, and neighborhood dining, with a flexible indoor option if it rains.",
        source: "Places + maps + preferences · illustrative demo",
        updated: "Draft plan",
        blocks: [
          {
            type: "gallery", tab: "visuals", className: "gallery-block", title: "The feel of the weekend", note: "3 saved ideas", images: [
              { src: "https://images.unsplash.com/photo-1494522358652-f30e61a60313?auto=format&fit=crop&w=1200&q=82", alt: "Chicago skyline along the river", caption: "Architecture cruise · Saturday" },
              { src: "https://images.unsplash.com/photo-1581373449483-37449f962b6c?auto=format&fit=crop&w=700&q=82", alt: "Chicago city buildings", caption: "Loop architecture walk" },
              { src: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=700&q=82", alt: "Chicago skyline at dusk", caption: "West Loop dinner" }
            ]
          },
          {
            type: "metrics", tab: "overview", className: "metrics-block", title: "Plan snapshot", items: [
              { label: "Pace", value: "Relaxed", note: "2 anchors / day", tone: "good" },
              { label: "Est. spend", value: "$235", note: "For two people" },
              { label: "Walking", value: "5.8 mi", note: "Across 2 days" },
              { label: "Rain backup", value: "3", note: "Indoor swaps ready" }
            ]
          },
          {
            type: "timeline", tab: "overview", className: "timeline-block", title: "Saturday", note: "Flexible by 30 minutes", items: [
              { time: "10:30 AM", title: "Riverwalk coffee", note: "Easy start · 45 minutes" },
              { time: "12:00 PM", title: "Architecture cruise", note: "Main anchor · book ahead" },
              { time: "3:00 PM", title: "Loop design walk", note: "Self-guided · indoor swaps nearby" },
              { time: "6:30 PM", title: "West Loop dinner", note: "Three shortlist options" }
            ]
          },
          {
            type: "table", tab: "data", className: "table-block", title: "Dinner shortlist", note: "Travel time from the Loop",
            columns: ["Place", "Style", "Price", "Travel", "Fit"],
            rows: [
              ["Avec", "Mediterranean", "$$$", "12 min", { label: "Best overall", tone: "ok" }],
              ["Girl & the Goat", "Shared plates", "$$$", "14 min", { label: "Lively", tone: "warn" }],
              ["Publican", "Seasonal", "$$$", "13 min", { label: "Relaxed", tone: "" }]
            ]
          },
          {
            type: "form", tab: "act", className: "form-block", title: "Tune the plan", fields: [
              { type: "select", label: "Pace", options: ["Relaxed", "Balanced", "Packed"] },
              { type: "select", label: "Food mood", options: ["Neighborhood favorites", "Celebration", "Budget-friendly"] },
              { type: "range", label: "Budget for two", min: 120, max: 500, value: 235, prefix: "$" }
            ]
          },
          {
            type: "actions", tab: "act", title: "Make it yours", actions: [
              { label: "Save this plan", primary: true }, { label: "Swap an activity" }, { label: "Share preview" }
            ]
          }
        ]
      }
    };

    const concepts = {
      inline: {
        name: "Conversation+",
        thesis: "Keep today’s Jarvis mental model and place rich, typed cards directly beneath the spoken answer.",
        best: ["Fastest path from the current monolithic surface", "Natural transcript continuity", "Lowest user-learning cost"],
        tradeoffs: ["Large answers create a long conversation", "Charts and forms feel constrained", "Harder to compare two answers side by side"],
        fit: { "Framework fit": 95, "Glanceability": 72, "Deep work": 48 }
      },
      canvas: {
        name: "Adaptive Answer Canvas",
        thesis: "Let Jarvis speak briefly, then promote the useful visual into a calm, responsive canvas that changes shape with the answer.",
        best: ["Strongest balance of voice, visuals, and actions", "One-screen weather/briefing glance", "Scales from a card to a dashboard"],
        tradeoffs: ["Needs a clear block contract", "Transcript becomes secondary while a canvas is open", "Requires careful focus and back behavior"],
        fit: { "Framework fit": 86, "Glanceability": 96, "Deep work": 82 }
      },
      workbench: {
        name: "Conversation + Workbench",
        thesis: "Keep chat persistent on the left and open each rich answer as a durable artifact with overview, visual, data, and action tabs.",
        best: ["Excellent for iterative research and forms", "Durable outputs stay easy to revisit", "Clear separation of talk and work"],
        tradeoffs: ["Most structural change", "Desktop-first density", "Needs an artifact lifecycle and mobile fallback"],
        fit: { "Framework fit": 66, "Glanceability": 76, "Deep work": 98 }
      }
    };

    const state = {
      concept: new URLSearchParams(location.search).get("concept") || "canvas",
      scenario: new URLSearchParams(location.search).get("scenario") || "weather",
      tab: "overview"
    };
    if (!concepts[state.concept]) state.concept = "canvas";
    if (!responses[state.scenario]) state.scenario = "weather";

    const esc = (value) => String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    const safeUrl = (value) => /^(https:\/\/images\.unsplash\.com\/|\/)/i.test(String(value || "")) ? String(value) : "";

    function blockTitle(block) {
      if (!block.title) return "";
      return `<div class="block-title"><h3>${esc(block.title)}</h3>${block.note ? `<span>${esc(block.note)}</span>` : ""}</div>`;
    }

    function renderWeather(block) {
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">
        <div class="weather-inner">
          <div class="weather-place">${esc(block.place)}</div>
          <div class="weather-temp">${esc(block.temperature)}</div>
          <div class="weather-condition">${esc(block.condition)}</div>
          <div class="weather-detail">${esc(block.detail)}</div>
          <div class="weather-alert"><span aria-hidden="true">⚡</span>${esc(block.alert)}</div>
        </div>
      </section>`;
    }

    function renderMetrics(block) {
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="metric-grid">${block.items.map((item) => `<div class="metric ${esc(item.tone || "")}">
          <div class="metric-label">${esc(item.label)}</div><div class="metric-value">${esc(item.value)}</div><div class="metric-note">${esc(item.note)}</div>
        </div>`).join("")}</div>
      </section>`;
    }

    function normalizePoints(values, width, height, pad) {
      const min = Math.min(...values), max = Math.max(...values), span = Math.max(1, max - min);
      return values.map((value, index) => ({
        x: pad + index * ((width - pad * 2) / Math.max(1, values.length - 1)),
        y: pad + (max - value) * ((height - pad * 2) / span)
      }));
    }

    function renderLineChart(block) {
      const width = 620, height = 154, pad = 18;
      const lines = block.series.map((series) => {
        const points = normalizePoints(series.values, width, height, pad);
        const path = points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
        return `<path d="${path}" fill="none" stroke="${esc(series.color)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          ${points.map((point) => `<circle cx="${point.x}" cy="${point.y}" r="3.5" fill="${esc(series.color)}" stroke="#171827" stroke-width="2" />`).join("")}`;
      }).join("");
      const grid = [34, 74, 114].map((y) => `<line x1="18" y1="${y}" x2="602" y2="${y}" stroke="rgba(255,255,255,.07)" />`).join("");
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="chart-wrap" role="img" aria-label="${esc(block.title)}. ${esc(block.series.map((series) => `${series.name}: ${series.values.join(", ")}`).join(". "))}">
          <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">${grid}${lines}</svg>
          <div class="chart-labels" style="grid-template-columns:repeat(${block.labels.length},1fr)">${block.labels.map((label) => `<span>${esc(label)}</span>`).join("")}</div>
          <div class="chart-legend">${block.series.map((series) => `<span><i style="background:${esc(series.color)}"></i>${esc(series.name)}</span>`).join("")}</div>
        </div>
      </section>`;
    }

    function renderBarChart(block) {
      const max = Math.max(...block.values, 1);
      const width = 620, height = 154, gap = 28, barWidth = (width - gap * (block.values.length + 1)) / block.values.length;
      const bars = block.values.map((value, index) => {
        const h = (value / max) * 116, x = gap + index * (barWidth + gap), y = 136 - h;
        return `<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="7" fill="${esc(block.color)}" opacity="${.62 + index * .09}" />
          <text x="${x + barWidth / 2}" y="${Math.max(13, y - 7)}" text-anchor="middle" fill="#d7d7e8" font-size="10">${value}%</text>`;
      }).join("");
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="chart-wrap" role="img" aria-label="${esc(block.title)}. ${esc(block.labels.map((label, index) => `${label}: ${block.values[index]} percent`).join(". "))}">
          <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true"><line x1="18" y1="137" x2="602" y2="137" stroke="rgba(255,255,255,.08)" />${bars}</svg>
          <div class="chart-labels" style="grid-template-columns:repeat(${block.labels.length},1fr)">${block.labels.map((label) => `<span>${esc(label)}</span>`).join("")}</div>
        </div>
      </section>`;
    }

    function renderCell(cell) {
      if (cell && typeof cell === "object") return `<span class="status-pill ${esc(cell.tone || "")}">${esc(cell.label)}</span>`;
      return esc(cell);
    }

    function renderTable(block) {
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="data-table-wrap"><table class="data-table">
          <thead><tr>${block.columns.map((column) => `<th scope="col">${esc(column)}</th>`).join("")}</tr></thead>
          <tbody>${block.rows.map((row) => `<tr>${row.map((cell) => `<td>${renderCell(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>
      </section>`;
    }

    function renderTimeline(block) {
      return `<section class="block half ${esc(block.className || "")}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="timeline">${block.items.map((item) => `<div class="timeline-item">
          <div class="timeline-time">${esc(item.time)}</div><div class="timeline-rail"><i class="timeline-dot"></i></div>
          <div class="timeline-copy"><strong>${esc(item.title)}</strong>${esc(item.note)}</div>
        </div>`).join("")}</div>
      </section>`;
    }

    function renderGallery(block) {
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <div class="gallery">${block.images.map((image) => `<figure><img src="${esc(safeUrl(image.src))}" alt="${esc(image.alt)}" loading="eager" /><figcaption>${esc(image.caption)}</figcaption></figure>`).join("")}</div>
      </section>`;
    }

    function renderForm(block) {
      return `<section class="block ${esc(block.className)}" data-tab="${esc(block.tab)}">${blockTitle(block)}
        <form class="preference-form" data-demo-form>${block.fields.map((field, index) => {
          if (field.type === "range") return `<div class="field"><label for="range-${index}">${esc(field.label)}</label><div class="range-row"><input id="range-${index}" type="range" min="${field.min}" max="${field.max}" value="${field.value}" data-prefix="${esc(field.prefix || "")}" /><output class="range-value">${esc(field.prefix || "")}${esc(field.value)}</output></div></div>`;
          return `<div class="field"><label for="select-${index}">${esc(field.label)}</label><select id="select-${index}">${field.options.map((option) => `<option>${esc(option)}</option>`).join("")}</select></div>`;
        }).join("")}</form>
      </section>`;
    }

    function renderActions(block) {
      return `<section class="block" data-tab="${esc(block.tab)}">${blockTitle(block)}<div class="action-row">${block.actions.map((action) => `<button type="button" class="action ${action.primary ? "primary" : ""}" data-demo-action="${esc(action.label)}">${esc(action.label)}</button>`).join("")}</div></section>`;
    }

    function renderBlock(block) {
      const renderers = { weather: renderWeather, metrics: renderMetrics, lineChart: renderLineChart, barChart: renderBarChart, table: renderTable, timeline: renderTimeline, gallery: renderGallery, form: renderForm, actions: renderActions };
      return renderers[block.type] ? renderers[block.type](block) : "";
    }

    function responseHeader(response) {
      return `<div class="response-header"><div><div class="response-kicker">${esc(response.kicker)}</div><h2 class="response-title">${esc(response.title)}</h2></div><span class="demo-chip">Demo data</span></div>`;
    }

    function sourceLine(response) {
      return `<div class="source-line"><span>◌ ${esc(response.source)}</span><span>↻ ${esc(response.updated)}</span><span>▣ Plain-text fallback available</span></div>`;
    }

    function renderBlocks(response) {
      return `<div class="block-grid">${response.blocks.map(renderBlock).join("")}</div>`;
    }

    function composer(label = "Ask a follow-up…") {
      return `<form class="composer" data-composer><input aria-label="Ask Jarvis" placeholder="${esc(label)}" /><button class="mic-button" type="button" data-demo-action="Voice input" aria-label="Use voice input">●</button><button class="send-button" type="submit">Ask</button></form>`;
    }

    function renderInline(response) {
      return `<section class="concept-shell inline-shell" aria-label="Conversation plus concept">
        <div class="inline-main">
          <div class="inline-hero"><div class="orb" aria-hidden="true"></div><h1>What can I help with?</h1><p>Voice first · visuals when they add clarity</p></div>
          <div class="conversation" role="log">
            <div class="user-turn"><div class="user-bubble">${esc(response.prompt)}</div></div>
            <article class="assistant-turn"><div class="jarvis-label">Jarvis</div><div class="spoken">${esc(response.spokenSummary)}</div>
              <div class="inline-card">${responseHeader(response)}<div class="response-surface">${renderBlocks(response)}</div>${sourceLine(response)}</div>
            </article>
          </div>
          <div class="inline-composer">${composer()}</div>
        </div>
        <aside class="inline-rail" aria-label="Jarvis status">
          <div class="rail-card"><h3>Conversations</h3><div class="rail-item"><i></i><span>Current thread</span></div><div class="rail-item"><i></i><span>Project update</span></div></div>
          <div class="rail-card"><h3>Status</h3><div class="rail-item"><i></i><span>18 bots online</span></div><div class="rail-item"><i style="background:var(--warn)"></i><span>3 tasks working</span></div></div>
        </aside>
      </section>`;
    }

    function renderCanvas(response) {
      return `<section class="concept-shell canvas-shell" aria-label="Adaptive answer canvas concept">
        <header class="canvas-topbar"><div class="jarvis-presence"><div class="orb small" aria-hidden="true"></div><div><div class="presence-title">Jarvis</div><div class="presence-state">Ready · voice on</div></div></div>
          <div class="canvas-tools"><button class="icon-button" type="button" title="Return to conversation">↶</button><button class="icon-button" type="button" title="Save this answer">☆</button><button class="icon-button" type="button" title="More options">•••</button></div>
        </header>
        <div class="canvas-scroll"><article class="canvas-answer">
          <div class="canvas-prompt">You asked · ${esc(response.prompt)}</div><div class="canvas-spoken">${esc(response.spokenSummary)}</div>
          <div class="canvas-card">${responseHeader(response)}<div class="response-surface">${renderBlocks(response)}</div>${sourceLine(response)}</div>
        </article></div>
        <div class="canvas-dock">${composer("Ask about this answer…")}</div>
      </section>`;
    }

    function renderWorkbench(response) {
      return `<section class="concept-shell workbench-shell" aria-label="Conversation and workbench concept">
        <aside class="chat-pane"><div class="chat-head"><div class="orb small" aria-hidden="true"></div><div class="chat-head-copy"><strong>Jarvis</strong><span>One conversation · rich work opens here</span></div></div>
          <div class="chat-log" role="log"><div class="mini-turn user">${esc(response.prompt)}</div><div class="mini-turn jarvis open-artifact"><strong>Jarvis</strong>${esc(response.spokenSummary)}</div><div class="mini-turn jarvis"><strong>Open answer</strong>${esc(response.title)}</div></div>
          <div class="chat-compose">${composer("Ask Jarvis…")}</div>
        </aside>
        <div class="artifact-pane"><header class="artifact-head"><div class="artifact-name"><span>Live answer artifact · demo</span><h1>${esc(response.title)}</h1></div>
          <nav class="artifact-tabs" aria-label="Answer sections">${["overview", "visuals", "data", "act"].map((tab) => `<button type="button" class="artifact-tab ${state.tab === tab ? "active" : ""}" data-tab-select="${tab}">${tab === "act" ? "Actions" : tab[0].toUpperCase() + tab.slice(1)}</button>`).join("")}</nav>
        </header>
        <div class="artifact-scroll"><article class="artifact-content"><div class="artifact-summary"><p>${esc(response.spokenSummary)}</p><span class="demo-chip">Demo data</span></div><div class="block-grid">${response.blocks.map(renderBlock).join("")}</div>${sourceLine(response)}</article></div></div>
      </section>`;
    }

    function renderNotes() {
      const concept = concepts[state.concept];
      document.getElementById("designNotes").innerHTML = `<div class="notes-eyebrow">Option ${state.concept === "inline" ? "A" : state.concept === "canvas" ? "B · recommended starting point" : "C"}</div>
        <h2>${esc(concept.name)}</h2><p>${esc(concept.thesis)}</p>
        <div class="note-card"><h3>Why choose it</h3><ul>${concept.best.map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>
        <div class="note-card"><h3>Tradeoffs</h3><ul>${concept.tradeoffs.map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>
        <div class="note-card"><h3>Relative fit</h3><div class="fit-meter">${Object.entries(concept.fit).map(([label, value]) => `<div class="fit-row"><span>${esc(label)}</span><div class="fit-track"><i style="width:${value}%"></i></div><b>${value}</b></div>`).join("")}</div></div>
        <div class="note-card"><h3>Shared product rule</h3><ul><li>Speak one concise summary.</li><li>Show a typed visual block only when it helps.</li><li>Let the user explore details or act without restarting the conversation.</li><li>Preserve plain text for TV, history, and accessibility fallback.</li></ul></div>`;
    }

    function updateWorkbenchTabs() {
      if (state.concept !== "workbench") return;
      document.querySelectorAll(".artifact-tab").forEach((button) => button.classList.toggle("active", button.dataset.tabSelect === state.tab));
      document.querySelectorAll(".artifact-content .block").forEach((block) => {
        const tab = block.dataset.tab || "overview";
        block.dataset.hidden = String(tab !== state.tab);
      });
    }

    function syncUrl() {
      const url = new URL(location.href); url.searchParams.set("concept", state.concept); url.searchParams.set("scenario", state.scenario);
      history.replaceState(null, "", url);
    }

    function render() {
      const response = responses[state.scenario];
      document.querySelectorAll("[data-concept]").forEach((button) => button.classList.toggle("active", button.dataset.concept === state.concept));
      document.getElementById("scenarioSelect").value = state.scenario;
      document.getElementById("stage").innerHTML = state.concept === "inline" ? renderInline(response) : state.concept === "workbench" ? renderWorkbench(response) : renderCanvas(response);
      renderNotes(); updateWorkbenchTabs(); syncUrl();
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast"); toast.textContent = message; toast.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
    }

    document.getElementById("conceptNav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-concept]"); if (!button) return;
      state.concept = button.dataset.concept; state.tab = "overview"; render();
    });
    document.getElementById("scenarioSelect").addEventListener("change", (event) => { state.scenario = event.target.value; state.tab = "overview"; render(); });
    document.getElementById("notesToggle").addEventListener("click", () => {
      const notes = document.getElementById("designNotes"); const closed = notes.classList.toggle("closed");
      document.getElementById("notesToggle").setAttribute("aria-expanded", String(!closed));
    });
    document.getElementById("stage").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab-select]"); if (tab) { state.tab = tab.dataset.tabSelect; updateWorkbenchTabs(); return; }
      const action = event.target.closest("[data-demo-action]"); if (action) showToast(`${action.dataset.demoAction} · prototype interaction`);
    });
    document.getElementById("stage").addEventListener("input", (event) => {
      if (event.target.matches('input[type="range"]')) event.target.nextElementSibling.textContent = `${event.target.dataset.prefix || ""}${event.target.value}`;
    });
    document.getElementById("stage").addEventListener("submit", (event) => {
      event.preventDefault(); const input = event.target.querySelector("input");
      showToast(input && input.value ? `Jarvis heard: ${input.value}` : "Ask Jarvis · prototype interaction");
    });

    render();
  </script>
</body>
</html>
