<!DOCTYPE html>
<!--
  CHANGE LOG
  1 | maintainer@emeraldcoastsystemsgroup.com | Remove browser App-Secret storage; OAuth uses deployment-managed server credentials only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook Bot</title>
<style>
  :root{--bg:#111;--surface:#1a1a1a;--border:rgba(255,255,255,0.1);--text:#e8e8e8;--muted:#888;--accent:#1877f2;--success:#34d399;--error:#f87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:400px}
  .logo{text-align:center;margin-bottom:24px}
  .logo .icon{width:48px;height:48px;background:var(--accent);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#fff;margin-bottom:12px}
  .logo h1{font-size:20px;font-weight:600}
  .logo p{color:var(--muted);font-size:13px;margin-top:4px}
  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-fb{background:var(--accent);color:#fff}
  .btn-fb:hover:not(:disabled){background:#166fe5}
  .btn-fb svg{width:20px;height:20px;fill:#fff}
  .btn-out{background:transparent;color:var(--error);border:1px solid rgba(248,113,113,.3);margin-top:10px;font-size:13px;padding:10px}
  .ok-box{text-align:center;padding:20px;border-radius:12px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15);margin-bottom:16px}
  .ok-box .ck{font-size:32px;margin-bottom:8px;color:var(--success)}
  .ok-box .pg{font-size:17px;font-weight:600}
  .ok-box .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .msg{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
  .msg.err{color:var(--error)}
  .hide{display:none}
  @media (max-width: 640px) {
    body{padding:16px}
    .card{padding:24px 16px;border-radius:12px}
  }
</style>
  <link rel="stylesheet" href="/shared/ui/css/surface-glass.css" />
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">f</div>
    <h1>Facebook Bot</h1>
    <p>Connect your Facebook page</p>
  </div>

  <div id="loading">Checking...</div>

  <div id="login" class="hide">
    <button class="btn btn-fb" id="loginBtn" onclick="doLogin()">
      <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Login with Facebook
    </button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="connected" class="hide">
    <div class="ok-box"><div class="ck">&#10003;</div><div class="pg" id="pn"></div><div class="sub" id="pi"></div></div>
    <button class="btn btn-fb" onclick="doLogin()"><svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>Switch Page</button>
    <button class="btn btn-out" onclick="doDisconnect()">Disconnect</button>
  </div>
</div>
<script>
// App credentials are deployment-managed and never enter browser storage.
function show(id){['loading','login','connected'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide')}

async function check(){
  // First check if server already has a connection
  try{
    const r=await fetch('/api/facebook-auth/status');const d=await r.json();
    if(d.connected){document.getElementById('pn').textContent=d.pageName||d.userName||'Connected';document.getElementById('pi').textContent=d.pageId?'Page ID: '+d.pageId:'';show('connected');return}
  }catch{}
  // Server has the app ID — just show the login button
  show('login');
}

async function doLogin(){
  const btn=document.getElementById('loginBtn');btn.disabled=true;
  const m=document.getElementById('msg');m.textContent='Opening Facebook...';m.className='msg';

  try{
    const r=await fetch('/api/facebook-auth/start');const d=await r.json();
    if(!d.authUrl){m.textContent=d.error||'Facebook OAuth is unavailable; configure deployment credentials server-side';m.className='msg err';btn.disabled=false;return}
    window.open(d.authUrl,'fb-auth','width=620,height=700');
    m.textContent='Authorize in the popup...';
    const t=Date.now();
    const poll=setInterval(async()=>{
      if(Date.now()-t>180000){clearInterval(poll);m.textContent='Timed out';m.className='msg err';btn.disabled=false;return}
      try{const s=await fetch('/api/facebook-auth/status');const x=await s.json();if(x.connected){clearInterval(poll);document.getElementById('pn').textContent=x.pageName||'Connected';document.getElementById('pi').textContent=x.pageId?'Page ID: '+x.pageId:'';show('connected')}}catch{}
    },2000);
  }catch(e){m.textContent=e.message;m.className='msg err';btn.disabled=false}
}

async function doDisconnect(){
  if(!confirm('Disconnect?'))return;
  await fetch('/api/facebook-auth/disconnect',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  show('login');document.getElementById('msg').textContent='';
}

check();
</script>
</body>
</html>
