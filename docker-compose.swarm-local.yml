      AGENT_ID: task-manager
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/task-manager.yaml
      BOT_ROLE: swarm/qa-gatekeeper
      AGENT_CAPABILITIES: "qa,verification,testing,code-review,quality-assurance,lifecycle-validation"
      AGENT_MAX_CONCURRENT: "3"
      AGENT_SCOPE: shared
      AGENT_ENDPOINT_URL: "http://swarm-task-manager:5000"
      AGENT_EXTERNAL_PORT: "3011"
    volumes:
      - ./src/api:/app/src/api
      - ./src/app:/app/src/app
      - ./src/features:/app/src/features
      - ./src/shared:/app/src/shared
      - ./src/entities:/app/src/entities
      - ./src/pages:/app/src/pages
