# ── RBAC: dynamic bot runtimes ────────────────────────────────────────────────
# An installed app can declare a bot that needs its own node. Under compose the
# controller writes a compose overlay and starts the container; the cluster
# equivalent is creating a Deployment + Service in THIS namespace, which needs a
# ServiceAccount with a namespace-scoped Role.
#
# botLauncher: false withholds that permission — the controller then degrades to
# persona-only agents (a create-and-start rolls back rather than half-launching),
# and apps whose bots run inline on the api still work. The api keeps its
# BOT_DATABASE_URL either way: its app-role bootstrap provisions oshal_bot for the
# chart-declared bots and refuses to start without it.
#
# A bot launched this way reads oshal-shared-env and the optional oshal-bot-env
# Secret only, not oshal-shared-secret, so without JWT_SECRET it fails to boot.
# Copy the chart Secret's keys into oshal-bot-env; NOTES.txt and the README
# "Credentials" section print the command (docs/BACKLOG.md tracks the launcher fix).
rbac:
  create: true
  serviceAccountName: oshal-api
  botLauncher: true

# ── Store packages ────────────────────────────────────────────────────────────
# Packages to stage into the shared workspace before the api boots (the api's
# auto-load registers each package's bots and surfaces once, at boot). Same
# installer, same audited-SHA path as the compose install:
#   --set packages={career-hunter,job-apply}
# Re-runs are idempotent in compatible mode; enforce revalidates and replaces.
# Packages can also be installed later from the cockpit (Explore Apps).
packages: []

store:
  repo: https://github.com/emeraldcoastsystemsgroup/oshal-apps
  ref: main
  # compatible (default) = skip an already-staged package. enforce = revalidate
  # and replace it from the exact audited SHA.
  auditMode: compatible
  # Name of a Secret holding OSHAL_STORE_TOKEN, for PRIVATE store repos only.
  # Public packages need no token. Create it out-of-band:
  #   kubectl -n <ns> create secret generic oshal-store --from-literal=OSHAL_STORE_TOKEN=…
  tokenSecret: ""

# Custom/extra bot-nodes (always rendered on top of the selected preset; the
# canonical agent IDs live in compose/the registry — reuse them exactly).
bots: []
#  - name: research-bot
#    agentId: a0000000-0000-0000-0000-00000000000c
#    capabilities: "research,analysis,documentation,investigation,web-search"
