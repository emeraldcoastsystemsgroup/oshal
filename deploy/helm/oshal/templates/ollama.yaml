# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial (ADR-129 amendment) — in-cluster Ollama, main role only. OFF by default, unlike the rest of the infra tier: compose gates it behind the `local-llm` profile, so a default `up` never starts it and neither does a default install. Model pulls run as an init container (compose oshal-ollama-pull parity) so the server is never Ready without the models the deployment asked for.
{{- if and (eq .Values.role "main") .Values.infra.ollama.inCluster }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oshal-ollama
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  serviceName: oshal-ollama
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oshal-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oshal-ollama
        {{- include "oshal.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: ollama
          image: {{ .Values.infra.ollama.image }}
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          {{- with .Values.infra.ollama.pullModels }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for m in {{ join " " . }}; do ollama pull "$m" || true; done
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.infra.ollama.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: oshal-ollama
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oshal-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
{{- end }}
