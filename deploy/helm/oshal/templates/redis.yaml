# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — in-cluster Redis (compose oshal-redis parity: AOF on), main role only. On bot-pod clusters the oshal-redis Service is created by relay.yaml and forwards over the tailnet instead.
{{- if and (eq .Values.role "main") .Values.infra.redis.inCluster }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oshal-redis
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  serviceName: oshal-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oshal-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oshal-redis
        {{- include "oshal.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.infra.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: oshal-redis
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oshal-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
