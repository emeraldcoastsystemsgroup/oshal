# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0 — chart-managed credentials move out of the oshal-shared-env ConfigMap and out of literal container env into two Secrets. oshal-shared-secret carries JWT_SECRET (and, on a main cluster with in-cluster ArangoDB, ARANGO_ROOT_USER/ARANGO_ROOT_PASSWORD); the api and every chart bot envFrom it, listed AFTER the ConfigMap and BEFORE the operator's own api.envSecret / botDefaults.envSecret, so an operator Secret still wins a duplicate key. oshal-db-credentials carries the database DSNs and is read only by secretKeyRef, one key per consumer: the api reads BOOTSTRAP_DATABASE_URL, DATABASE_URL and BOT_DATABASE_URL; a bot reads BOT_DATABASE_URL and nothing else, so a bot's environment never holds the superuser or oshal_app DSN (K5). The oshal_app and oshal_bot passwords now have a values path (infra.postgres.appPassword / botPassword), validated at render time against the rule the api's app-role bootstrap enforces. Guard: tests/unit/chart-credentials.spec.ts.
{{- /*
oshal-shared-secret: the credentials every oshal runtime reads (compose *bot-env parity), in a
Secret instead of the ConfigMap. Both roles: bot-pod bots need JWT_SECRET too.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: oshal-shared-secret
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The any-bot JS layer refuses to boot in NODE_ENV=production without it.
  JWT_SECRET: {{ .Values.swarm.jwtSecret | quote }}
  {{- if and (eq .Values.role "main") .Values.infra.arangodb.inCluster }}
  # Graph tier root credentials (compose *bot-env parity: every bot and the api see them).
  ARANGO_ROOT_USER: {{ .Values.infra.arangodb.rootUser | quote }}
  ARANGO_ROOT_PASSWORD: {{ .Values.infra.arangodb.rootPassword | quote }}
  {{- end }}
{{- if and (eq .Values.role "main") (or .Values.infra.postgres.inCluster .Values.swarm.botDatabaseUrl) }}
{{- if .Values.infra.postgres.inCluster }}
{{- include "oshal.validateRolePasswords" . }}
{{- end }}
---
# Database DSNs, read ONLY by secretKeyRef (never envFrom): each consumer takes exactly the key it
# needs, so a bot's environment carries the oshal_bot DSN and nothing else. Main role only — bot-pod
# clusters never receive a DATABASE_URL (trust rule).
apiVersion: v1
kind: Secret
metadata:
  name: oshal-db-credentials
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.infra.postgres.inCluster }}
  BOOTSTRAP_DATABASE_URL: {{ include "oshal.bootstrapDatabaseUrl" . | quote }}
  DATABASE_URL: {{ include "oshal.appDatabaseUrl" . | quote }}
  {{- end }}
  BOT_DATABASE_URL: {{ include "oshal.botDatabaseUrl" . | quote }}
{{- end }}
