# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — in-cluster ChromaDB (compose oshal-chromadb parity), main role only.
# 2 | maintainer@emeraldcoastsystemsgroup.com   | Production-readiness baseline (chart 0.5.0): stays root (the image has no USER and caches its model under /root) with RuntimeDefault seccomp, no privilege escalation and every capability dropped (its entrypoint only execs uvicorn); startup and liveness probes reuse /api/v1/heartbeat; resources from infra.chromadb.resources; storageClassName on the claim template. Guard: tests/unit/chart-production-baseline.spec.ts.
{{- if and (eq .Values.role "main") .Values.infra.chromadb.inCluster }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oshal-chromadb
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  serviceName: oshal-chromadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oshal-chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oshal-chromadb
        {{- include "oshal.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      # The image has no USER and keeps its model cache under /root, so it stays root; it needs
      # no capability (its entrypoint only execs uvicorn).
      securityContext:
        {{- include "oshal.podSeccomp" . | nindent 8 }}
      containers:
        - name: chromadb
          image: {{ .Values.infra.chromadb.image }}
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            periodSeconds: 10
            failureThreshold: 20
          startupProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "oshal.minimalContainerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.infra.chromadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with include "oshal.storageClassName" (dict "root" $ "override" .Values.infra.chromadb.storageClassName) }}
        {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infra.chromadb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: oshal-chromadb
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oshal-chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
