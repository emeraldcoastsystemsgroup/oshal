# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — in-cluster ChromaDB (compose oshal-chromadb parity), main role only.
{{- if and (eq .Values.role "main") .Values.infra.chromadb.inCluster }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oshal-chromadb
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  serviceName: oshal-chromadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oshal-chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oshal-chromadb
        {{- include "oshal.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: chromadb
          image: {{ .Values.infra.chromadb.image }}
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            periodSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.infra.chromadb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: oshal-chromadb
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oshal-chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
