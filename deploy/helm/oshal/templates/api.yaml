# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — swarm controller (compose oshal-api parity: config-seed copy, pg wait, ADR-076 app-role bootstrap or plain migrations, then dist/app/server.js). Main role only. Explicit env beats envFrom in k8s, so DATABASE_URL is only set here when infra.postgres.inCluster — managed-Postgres deployments supply it via api.envSecret.
# 2 | maintainer@emeraldcoastsystemsgroup.com   | First real deploy (kind proveout) fixes: (1) pg-wait now probes BOOTSTRAP_DATABASE_URL — probing DATABASE_URL was a chicken-and-egg (oshal_app only exists AFTER provisioning), so the wait always burned out; (2) wait exhaustion and every bootstrap-mode step (migrations / RLS enforce / app-role provision) are now FATAL — exit 1 restarts the pod until the posture is established. Previously a slow first Postgres pull produced a Ready-but-schemaless api (/api/health is shallow) with oshal_app auth failures. A multi-user tenant must never boot half-bootstrapped.
# 3 | maintainer@emeraldcoastsystemsgroup.com   | Cold-start fix #2 (virgin DB): apply-rls prerequisites hard-reference tickets/workspaces/chat_tasks, but those legacy core tables live in NO migration file — they are lazily created by the server's schema-ensure chokepoints (which is why compose, with its organically-grown DB, never hit this). Bootstrap now runs the canonical ensureTicketSchema/ensureWorkspaceSchema/ensureConversationStoreSchema (idempotent, born-with-RLS via buildOwnerRlsPolicyStatements) as the superuser BEFORE the RLS enforce; OSHAL_SCHEMA_BOOTSTRAP is forced empty for that call so a validate-only pod env can never silently skip creation.
# 4 | maintainer@emeraldcoastsystemsgroup.com   | 0.2.0 — seeding-repair parity (compose SEQ 5 of bot-entrypoint.sh): global-config.json now copies IF-MISSING (cp -n) like secrets.json — the old cp -f force-reimposed the seed on every pod restart, silently resetting runtime provider config. Service gains spec.type + nodePort (api.service values) so a single-box cluster exposes the cockpit without an ingress controller.
# 5 | maintainer@emeraldcoastsystemsgroup.com   | 0.3.0 — (a) store-package staging as an initContainer: packages land in the workspace PVC's deployed-apps/ before the api boots, because auto-load registers bots/surfaces once at boot; idempotent in compatible mode, FATAL on failure (booting without an app the operator asked for is the silent-cap failure this whole tier exists to avoid). (b) The shared-service URLs the platform actually reads — TSDB_URL (trading/world series), VAULT_ADDR/TOKEN, SPEAKER_DIARIZATION_URL/KEY — emitted only when their service is inCluster, so switching one off degrades cleanly instead of pointing the feature at a refused connection.
# 6 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0 — BOT_DATABASE_URL is emitted whenever the chart runs Postgres in-cluster, no longer only inside the rbac.botLauncher block. With botLauncher=false the api still ran the app-role bootstrap (OSHAL_APP_ROLE_BOOTSTRAP=true), provision-app-role.mjs refused with "BOT_DATABASE_URL is required", and the command's `exit 1` restarted the pod forever on a posture values.yaml documents as supported. Of the two ways out, this one keeps least privilege intact: the chart-declared bots connect as oshal_bot whatever botLauncher is, so the role must be provisioned either way (skipping the bot half of the bootstrap would leave it without LOGIN, and the script provisions both roles in one pass with no bot-less mode), and the api already holds the superuser BOOTSTRAP_DATABASE_URL, so also holding the oshal_bot DSN widens nothing. Bots still never see anything but the oshal_bot DSN. OSHAL_BOT_IMAGE and OSHAL_IMAGE_PULL_POLICY stay launcher-only. Guard: tests/unit/chart-bootstrap-env.spec.ts.
# 7 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0 — no credential is a literal here any more. DATABASE_URL, BOOTSTRAP_DATABASE_URL and BOT_DATABASE_URL are secretKeyRefs into the chart's oshal-db-credentials Secret (templates/secrets.yaml); DATABASE_URL was the literal oshal_app:oshal-app-dev with no values path, and its password now comes from infra.postgres.appPassword. They stay explicit entries, so they still beat envFrom and managed Postgres still supplies them through api.envSecret with inCluster=false. JWT_SECRET and ARANGO_ROOT_* arrive by envFrom from oshal-shared-secret, listed after the ConfigMap and before api.envSecret. Guard: tests/unit/chart-credentials.spec.ts.
# 8 | maintainer@emeraldcoastsystemsgroup.com   | 0.5.0 — no Vault root token on the api. VAULT_TOKEN was the literal infra.vault.devRootToken, the dev Vault's root token; the chart's Vault is now server mode, sealed until its operator unseals it (templates/vault.yaml), and the chart supplies the api no Vault token at all: src reads only VAULT_TOKEN and has no AppRole login to obtain a scoped one. Without it the DevOps Vault console answers 503 vault_not_configured and nothing else in the api reads Vault. VAULT_ADDR follows infra.vault.tls (https when on, and the listener's ca.crt, only that key, is mounted and named in NODE_EXTRA_CA_CERTS). Guard: tests/unit/chart-vault-server.spec.ts.
# 9 | maintainer@emeraldcoastsystemsgroup.com   | Production-readiness baseline (chart 0.5.0): RuntimeDefault seccomp; the api and its stage-packages init container run with no privilege escalation and every capability dropped except DAC_OVERRIDE (the oshal image is root with no USER, and the shared workspace holds files code-server writes as uid 1000); startup (10 min: Postgres wait, migrations, RLS, role provisioning) and liveness probes reuse /api/health; the init container carries the api's resources; the output claim honours storageClassName. Guard: tests/unit/chart-production-baseline.spec.ts.
{{- if eq .Values.role "main" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oshal-api-output
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with include "oshal.storageClassName" (dict "root" $ "override" .Values.api.outputStorageClassName) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.outputStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oshal-api
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oshal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oshal-api
        {{- include "oshal.labels" . | nindent 8 }}
    spec:
      # The oshal image has no USER (it runs as root), so no runAsNonRoot here.
      securityContext:
        {{- include "oshal.podSeccomp" . | nindent 8 }}
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ .Values.rbac.serviceAccountName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.packages }}
      # Store packages stage into the shared workspace BEFORE the api container
      # starts — the api's swarm-app auto-load registers each package's bots and
      # surfaces exactly once at boot, so staging after it starts would need a
      # restart to take effect. Same image, same oshal-app.js installer, same
      # audited-SHA path as the compose installer; k8s's ordering primitive is an
      # initContainer instead of a docker run before `up`.
      initContainers:
        - name: stage-packages
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OSHAL_PACKAGE_AUDIT_MODE
              value: {{ .Values.store.auditMode | quote }}
            {{- if .Values.store.tokenSecret }}
            # Private stores only. Public packages need no token.
            - name: OSHAL_STORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.tokenSecret }}
                  key: OSHAL_STORE_TOKEN
                  optional: true
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              DEST=/app/workspace-shared/deployed-apps
              mkdir -p "$DEST"
              for p in {{ join " " .Values.packages }}; do
                if [ -d "$DEST/$p" ] && [ "$OSHAL_PACKAGE_AUDIT_MODE" = "compatible" ]; then
                  echo "SKIP $p — already staged (never register a bot/surface twice)"; continue;
                fi
                echo "staging $p ...";
                node /app/scripts/oshal-app.js install "$p" \
                  --repo {{ .Values.store.repo | quote }} --ref {{ .Values.store.ref | quote }} \
                  --dest "$DEST" --audit-mode "$OSHAL_PACKAGE_AUDIT_MODE" \
                  || { echo "package $p FAILED to stage — exiting so the pod restarts rather than booting without an app you asked for"; exit 1; };
              done
              echo "package staging complete"
          securityContext:
            {{- include "oshal.platformContainerSecurity" . | nindent 12 }}
          # Init containers count toward a request-requiring ResourceQuota too. The api's own
          # figures: an init container runs before the api, so the pod's request does not grow.
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace-shared
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp -n /app/config-seed/global-config.json /app/output/global-config.json 2>/dev/null;
              cp -n /app/config-seed/secrets.json /app/output/secrets.json 2>/dev/null;
              PROBE_URL="${BOOTSTRAP_DATABASE_URL:-$DATABASE_URL}"; export PROBE_URL;
              echo 'Waiting for Postgres to accept queries (bootstrap/superuser URL)...';
              PG_OK="";
              for i in $(seq 1 60); do
                node -e "const {Pool}=require('pg');new Pool({connectionString:process.env.PROBE_URL}).query('SELECT 1').then(()=>{process.exit(0)}).catch(()=>{process.exit(1)})" && { PG_OK=1; break; };
                echo "  attempt $i - waiting 2s..."; sleep 2;
              done;
              if [ -z "$PG_OK" ]; then echo 'Postgres never became reachable — exiting so the pod restarts.'; exit 1; fi;
              if [ "$OSHAL_APP_ROLE_BOOTSTRAP" = "true" ]; then
                echo 'ADR-076 app-role bootstrap: migrate + enforce core RLS + provision oshal_app, then run as the app role...';
                RUN_MIGRATIONS=true node -e "const{DatabaseBootstrapService}=require('./dist/features/tool-registry/services/database-bootstrap-service');const{Pool}=require('pg');const p=new Pool({connectionString:process.env.BOOTSTRAP_DATABASE_URL});new DatabaseBootstrapService(p).applyMigrations().then(m=>{console.log('Migrations done:',m.length);process.exit(0)}).catch(e=>{console.error('Migration err:',e.message);process.exit(1)})" 2>&1 || { echo 'Migrations failed — exiting so the pod restarts.'; exit 1; };
                echo 'Ensuring lazy-created core tables exist (canonical DDL, born with RLS)...';
                OSHAL_SCHEMA_BOOTSTRAP= node -e "const{ensureTicketSchema,ensureWorkspaceSchema,ensureConversationStoreSchema}=require('./dist/shared/services/database');const{Pool}=require('pg');const p=new Pool({connectionString:process.env.BOOTSTRAP_DATABASE_URL});(async()=>{await ensureTicketSchema(p);await ensureWorkspaceSchema(p);await ensureConversationStoreSchema(p);console.log('Core schema ensured');process.exit(0)})().catch(e=>{console.error('Core schema ensure err:',e.message);process.exit(1)})" 2>&1 || { echo 'core schema ensure failed — exiting so the pod restarts.'; exit 1; };
                OSHAL_RLS_APPLY=apply-enforce DATABASE_URL=$BOOTSTRAP_DATABASE_URL node scripts/governance/apply-rls.mjs || { echo 'core RLS enforce failed — a multi-user tenant must not boot without it; exiting.'; exit 1; };
                OSHAL_APP_DB_PASSWORD=$(node -e "process.stdout.write(new URL(process.env.DATABASE_URL).password||'')") node scripts/governance/provision-app-role.mjs || { echo 'app-role provision failed — exiting so the pod restarts.'; exit 1; };
              else
                echo 'Running migrations before server start...';
                RUN_MIGRATIONS=true node -e "const{DatabaseBootstrapService}=require('./dist/features/tool-registry/services/database-bootstrap-service');const{Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});new DatabaseBootstrapService(p).applyMigrations().then(m=>{console.log('Migrations done:',m.length);process.exit(0)}).catch(e=>{console.error('Migration err:',e.message);process.exit(1)})" 2>&1 || { echo 'Migrations failed — exiting so the pod restarts.'; exit 1; };
              fi;
              sleep 2;
              exec node dist/app/server.js
          envFrom:
            - configMapRef:
                name: oshal-shared-env
            # Chart-managed credentials (JWT_SECRET, ARANGO_ROOT_*). After the ConfigMap,
            # before api.envSecret: an operator Secret still wins a duplicate key.
            - secretRef:
                name: oshal-shared-secret
            {{- if .Values.api.envSecret }}
            - secretRef:
                name: {{ .Values.api.envSecret }}
                optional: true
            {{- end }}
          env:
            - name: BOT_RUNTIME
              value: swarm
            - name: BOT_NAME
              value: project-manager
            - name: AGENT_ID
              value: a0000000-0000-0000-0000-000000000001
            - name: BOT_PERSONA_FILE
              value: /app/ai-lab/bot-personas/project-manager.yaml
            - name: RUN_MIGRATIONS
              value: "true"
            - name: ENABLE_QUEUE_MANAGER
              value: "true"
            - name: ENABLE_AGENT_SCHEDULER
              value: "true"
            {{- if .Values.infra.postgres.inCluster }}
            # In-cluster DSNs, from the chart's oshal-db-credentials Secret (passwords:
            # infra.postgres.password / appPassword / botPassword). Explicit entries still
            # beat envFrom, so managed-Postgres deployments set
            # infra.postgres.inCluster=false and provide all three via api.envSecret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oshal-db-credentials
                  key: DATABASE_URL
            - name: BOOTSTRAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oshal-db-credentials
                  key: BOOTSTRAP_DATABASE_URL
            # K5: the oshal_bot DSN. NOT gated on rbac.botLauncher: the app-role
            # bootstrap (provision-app-role.mjs) provisions oshal_bot for the
            # chart-declared bots too and refuses to run without this URL, so gating
            # it crash-looped the api on the documented botLauncher=false degrade.
            # The dynamic launcher also hands it to the bots it creates.
            - name: BOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oshal-db-credentials
                  key: BOT_DATABASE_URL
            {{- end }}
            {{- if .Values.rbac.botLauncher }}
            # What the dynamic bot launcher renders into a Deployment. The image is
            # taken from HERE, never from a caller — agent creation must not become
            # arbitrary container execution.
            - name: OSHAL_BOT_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: OSHAL_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy }}
            {{- end }}
            {{- if .Values.infra.tsdb.inCluster }}
            # Trading + world-intelligence series store (compose api-env parity).
            - name: TSDB_URL
              value: postgresql://{{ .Values.infra.tsdb.user }}:{{ .Values.infra.tsdb.password }}@oshal-tsdb:5432/{{ .Values.infra.tsdb.database }}
            {{- end }}
            {{- if .Values.infra.vault.inCluster }}
            # The address only. The chart gives the api NO Vault token: the in-cluster Vault
            # is sealed and uninitialized until its operator unseals it, and src has no
            # AppRole login to mint one from. With no VAULT_TOKEN the DevOps Vault console
            # answers 503 vault_not_configured (README "Vault runbook").
            - name: VAULT_ADDR
              value: {{ ternary "https" "http" .Values.infra.vault.tls.enabled }}://oshal-vault:8200
            {{- if .Values.infra.vault.tls.enabled }}
            # Trust the CA that signed the Vault listener's certificate (additive to the
            # system roots; Node reads it at start).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/oshal/vault-tls/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.infra.diarization.inCluster }}
            - name: SPEAKER_DIARIZATION_URL
              value: http://speaker-diarization:8080
            - name: SPEAKER_SERVICE_KEY
              value: {{ .Values.infra.diarization.serviceKey | quote }}
            {{- end }}
            {{- range $k, $v := .Values.api.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          # Same endpoint. Startup allows the whole bootstrap (Postgres wait, migrations, RLS,
          # role provisioning: up to 10 min on a first boot) before liveness starts counting.
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "oshal.platformContainerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace-shared
            - name: output
              mountPath: /app/output
            {{- if .Values.api.configSeedSecret }}
            - name: config-seed
              mountPath: /app/config-seed
              readOnly: true
            {{- end }}
            {{- if and .Values.infra.vault.inCluster .Values.infra.vault.tls.enabled }}
            - name: vault-ca
              mountPath: /etc/oshal/vault-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: oshal-workspace
        - name: output
          persistentVolumeClaim:
            claimName: oshal-api-output
        {{- if .Values.api.configSeedSecret }}
        - name: config-seed
          secret:
            secretName: {{ .Values.api.configSeedSecret }}
            optional: true
        {{- end }}
        {{- if and .Values.infra.vault.inCluster .Values.infra.vault.tls.enabled }}
        # Only the CA from the Vault listener's TLS Secret - never its private key.
        - name: vault-ca
          secret:
            secretName: {{ .Values.infra.vault.tls.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: oshal-api
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: oshal-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
---
# DNS parity: personas + docs reference http://oshal-local-api:5000 (the compose
# container name). Keep that name resolving in-cluster too.
apiVersion: v1
kind: Service
metadata:
  name: oshal-local-api
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oshal-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
{{- end }}
