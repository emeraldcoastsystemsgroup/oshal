# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — cluster-local shared workspace (compose oshal_workspace equivalent). RWO is safe on the default single-node target (every pod lands together); multi-node clusters need an RWX StorageClass. NOTE: this volume does NOT span clusters — artifact-heavy ticket types stay on main.
# 2 | maintainer@emeraldcoastsystemsgroup.com   | Production-readiness baseline (chart 0.5.0): helm.sh/resource-policy: keep, so helm uninstall no longer deletes the swarm's shared workspace (every file the bots wrote, the staged store packages); and storageClassName from swarm.workspaceStorageClassName or the chart-wide value, omitted when empty. Guard: tests/unit/chart-durability-boundary.spec.ts and tests/unit/chart-production-baseline.spec.ts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oshal-workspace
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
  annotations:
    # `helm uninstall` leaves this claim (and everything the swarm wrote to it) in place;
    # a reinstall with the same release name picks it up again. Delete it by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with include "oshal.storageClassName" (dict "root" $ "override" .Values.swarm.workspaceStorageClassName) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.swarm.workspaceStorage }}
