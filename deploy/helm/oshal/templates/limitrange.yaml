# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial (chart 0.5.0; remote-cluster work package item 5) — a namespace LimitRange that gives botDefaults.resources to any container that sets none. Every container this chart renders sets its own, so it changes none of them. It exists for the bots the controller launches at runtime: buildBotDeployment in src/features/agent-management/services/kubernetes-bot-launcher.ts sets no resources, so those pods ran BestEffort and a ResourceQuota that requires requests would refuse them. Defaults = botDefaults, so a runtime bot is never sized above a chart bot. Only the memory limit is defaulted: a default CPU limit would also land on every chart container (none sets one) and refuse any whose CPU request is above it, so a CPU limit in botDefaults fails the render while this is on. A LimitRange cannot default a securityContext or a probe; that half of the runtime-bot gap is a core change (docs/BACKLOG.md). Guard: tests/unit/chart-runtime-bot-defaults.spec.ts.
{{- if and (eq .Values.role "main") .Values.limitRange.enabled }}
{{- $resources := .Values.botDefaults.resources | default dict }}
{{- $limits := $resources.limits | default dict }}
{{- range $name, $_ := $limits }}
{{- if ne $name "memory" }}
{{- fail (printf "botDefaults.resources.limits.%s cannot be a namespace default: limitRange.enabled gives botDefaults.resources to every container that sets none, and a default %s limit would also land on every chart container (none sets one), refusing any whose %s request is above it. Remove the %s limit from botDefaults, or set limitRange.enabled=false." $name $name $name $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: LimitRange
metadata:
  name: oshal-container-defaults
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- with $resources.requests }}
      defaultRequest:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $limits.memory }}
      default:
        {{- toYaml (dict "memory" .) | nindent 8 }}
      {{- end }}
{{- end }}
