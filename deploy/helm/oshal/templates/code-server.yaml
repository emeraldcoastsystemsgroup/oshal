# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial (ADR-129 amendment) — workspace IDE (compose code-server parity), main role only, no compose profile. SECURITY: it runs `--auth none` and mounts the shared workspace READ-WRITE, so reaching it means owning the workspace. Compose contains that by binding 127.0.0.1; the cluster equivalent is ClusterIP + `kubectl port-forward`, which is the shipped default. The serviceType value exists for deployments that add their own authenticating proxy — never expose this as-is.
{{- if and (eq .Values.role "main") .Values.infra.codeServer.inCluster }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
        {{- include "oshal.labels" . | nindent 8 }}
    spec:
      containers:
        - name: code-server
          image: {{ .Values.infra.codeServer.image }}
          args: ["--auth", "none", "--bind-addr", "0.0.0.0:8080", "/app/workspace-shared"]
          env:
            - name: PASSWORD
              value: ""
            - name: DOCKER_USER
              value: root
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace-shared
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: oshal-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  labels:
    {{- include "oshal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.infra.codeServer.serviceType }}
  selector:
    app.kubernetes.io/name: code-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
