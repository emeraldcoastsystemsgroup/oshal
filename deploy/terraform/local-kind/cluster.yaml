# 1 | maintainer@emeraldcoastsystemsgroup.com   | Initial — small multi-node kind cluster for validating the Terraform deployment locally. Deliberately lean: the local Docker VM is shared with the live compose swarm (6.2GB), so 1 control-plane + 2 workers, no port mappings (use kubectl port-forward). Create: kind create cluster --config deploy/terraform/local-kind/cluster.yaml. Delete: kind delete cluster --name oshal-tf.
