  # it can shell out to scripts/oshal-smartthings.js, reading the per-user SmartThings
  # connector token (oshal_connections) to read + command devices/scenes. Locally the
  # local registry also runs this bot inline on oshal-api; this dedicated service is the
  # full-node path. See swarm-apps/home.yaml + ai-lab/bot-personas/home-bot.yaml.
  # (career-hunter bot-node removed 2026-07-21 — Career Hunter carved to its store add-on;
  #  the career-hunter package registers cb…0001 with its own vendored engine.)

  home-bot:
    <<: *bot-common
    container_name: oshal-local-home-bot
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: home-bot
      AGENT_ID: d0000000-0000-0000-0000-000000000001
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/home-bot.yaml
      AGENT_CAPABILITIES: "smart-home-control,smartthings,device-control,scene-execution,home-automation"
      # CODEX: its sandbox shells out to scripts/oshal-smartthings.js (claude-code-as-root
      # cannot auto-approve bash). Overrides the *bot-env default.
      FORCE_LLM_PROVIDER: openai-codex
      FORCE_LLM_MODEL: gpt-5.5
      # Reads the per-user SmartThings token: decrypts oshal_connections (DATABASE_URL +
      # SESSION_SECRET from *bot-env). Per-user scoping via OSHAL_USER_SUB at dispatch.
      DATABASE_URL: ${BOT_DATABASE_URL:-postgresql://oshal_bot:oshal-bot-dev@oshal-db:5432/oshal}
      BOT_UI_LABEL: Smart Home
      BOT_UI_URL: /cockpit/?app=home
      BOT_UI_ICON: "codicon codicon-home"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      # CLI tools bind-mounted so home-bot iterations (index/scenes/prefs verbs)
      # apply without an image rebuild — mirrors the bot-personas/config-seed pattern.
      - ./scripts:/app/scripts:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - home-output:/app/output
      # Bot-owned per-user store (ADR-036): the home-bot OWNS + writes the device
      # index / scenes / prefs here; the api reads it :ro for the cheap surface view.
      - home-data:/app/home-data:rw
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  # ── Cloud-Ops Bot — DevOps/Cloud (GCP) worker ───────────────────────────────
  # A first-class oshal-bot node. CODEX: shells out to scripts/oshal-gcp.js (the
  # API-based gcloud replacement) with the signed-in user's GCP web-OAuth token.
  # See swarm-apps/cloud.yaml + ai-lab/bot-personas/cloud-ops-bot.yaml.
  cloud-ops-bot:
    <<: *bot-common
    container_name: oshal-local-cloud-ops-bot
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: cloud-ops-bot
      AGENT_ID: d0000000-0000-0000-0000-000000000002
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/cloud-ops-bot.yaml
      AGENT_CAPABILITIES: "gcp-inventory,gcp-projects,gcp-compute,gcp-enabled-apis,gcp-cost-optimization,gcp-health-audit,gcp-iam-audit"
      FORCE_LLM_PROVIDER: openai-codex
      FORCE_LLM_MODEL: gpt-5.5
      # Reads the per-user GCP token (DATABASE_URL + SESSION_SECRET) and refreshes it
      # via the GCP OAuth client creds when expired (oshal-gcp.js).
      DATABASE_URL: ${BOT_DATABASE_URL:-postgresql://oshal_bot:oshal-bot-dev@oshal-db:5432/oshal}
      GCP_CLIENT_ID: ${GCP_CLIENT_ID:-}
      GCP_CLIENT_SECRET: ${GCP_CLIENT_SECRET:-}
      BOT_UI_LABEL: Cloud
      BOT_UI_URL: /cockpit/?app=cloud
      BOT_UI_ICON: "codicon codicon-cloud"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      # CLI tools bind-mounted so oshal-gcp.js iterations apply without an image rebuild.
      - ./scripts:/app/scripts:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - cloud-ops-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  # -- Issue-RCA standard incident bots (per swarm-apps/issue-rca.yaml) --
  rca-specialist:
    profiles:
      - incident
    <<: *bot-common
    container_name: oshal-local-rca-specialist
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: rca-specialist
      AGENT_ID: a0000000-0000-0000-0000-000000000016
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/rca-specialist.yaml
      AGENT_CAPABILITIES: "debugging,investigation,root-cause,incident,analysis,troubleshooting"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - rca-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  incident-response-bot:
    profiles:
      - incident
    <<: *bot-common
    container_name: oshal-local-incident-response
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: incident-response-bot
      AGENT_ID: a0000000-0000-0000-0000-00000000000b
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/incident-response-bot.yaml
      AGENT_CAPABILITIES: "incident-response,triage,runbook-execution,stakeholder-communication"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - incident-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  incident-remediation-bot:
    profiles:
      - incident
    <<: *bot-common
    container_name: oshal-local-incident-remediation
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: incident-remediation-bot
      AGENT_ID: e0000000-0000-0000-0000-000000000100
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/incident-remediation-bot.yaml
      AGENT_CAPABILITIES: "incident-investigation,root-cause-analysis,remediation-scripting,topology-analysis,log-analysis,infrastructure-inspection"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - incident-remediation-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  # ── Cloudflare Tunnel (profile: tunnel) ─────────────────────────────────────
  # Exposes the OSHAL api at a public domain (e.g. https://littlemonster.example.com)
  # so real OIDC login (Google/Microsoft) works — the IdP redirects the browser to
  # APP_URL/callback, which must be publicly reachable.
  #
  # Setup (one-time, in YOUR Cloudflare account — token-based tunnel):
  #   1. Cloudflare Zero Trust → Networks → Tunnels → Create a tunnel (or reuse one).
  #   2. Copy the tunnel token → set CLOUDFLARE_TUNNEL_TOKEN in .env.
  #   3. Add a Public Hostname on that tunnel:
  #        Hostname: littlemonster.example.com
  #        Service:  HTTP  →  oshal-api:5000        (cloudflared shares the oshal network)
  #      Cloudflare manages the DNS CNAME automatically.
  #   4. Start it: docker compose -f docker-compose.oshal-local.yml --profile tunnel up -d cloudflared
  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:latest
    container_name: oshal-local-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
      - oshal
    depends_on:
      oshal-api:
        condition: service_healthy


volumes:
