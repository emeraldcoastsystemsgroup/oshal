  oshal_ollama_models:
  oshal_workspace:
  api-output:
  # Per-bot /app/output volumes for the concierge wave (2026-08-12 seeding repair): these 14
  # services shared api-output, and bot-entrypoint.sh writes every bot's persona to the SAME
  # fixed path (/app/output/bot-persona.json) — a parallel boot is a last-writer-wins race that
  # was live-measured putting 7 of 14 bots under ANOTHER bot's persona (finance answered as
  # general, trading as travel-concierge, identity as oshal-assistant). One writer per volume,
  # like the tm-output/codedev-output group below that never raced.
  jarvis-output:
  eats-output:
  rides-output:
  shopping-output:
  spotify-output:
  travel-output:
  movies-output:
  social-writer-output:
  storage-output:
  deck-builder-output:
  finance-output:
  trading-output:
  identity-output:
  general-output:
  tm-output:
  codedev-output:
  devops-output:
  self-healing-output:
  reviewer-output:
  docwriter-output:
  rca-output:
  incident-output:
  graph-output:
  research-output:
  testerbot-output:
  tester-output:
  architect-output:
  incident-remediation-output:
  queue-bot-output:
  facebook-output:
  email-output:
  weather-output:
  home-output:
  # oshal-developer's own clone of the platform repo (ADR-081) — named volume so the
