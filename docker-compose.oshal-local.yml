  # ── Email Bot — Intelligent Communication (Gmail + Calendar owner) ──────────
  # A first-class oshal-bot node: own container, heartbeat, on the mesh. It owns
  # the email data — the toolbar surfaces it and other swarm bots talk to it for
  # email work. Reads the per-user connector token from oshal_connections.
  email-bot:
    <<: *bot-common
    container_name: oshal-local-email-bot
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: communications-bot
      AGENT_ID: b0000000-0000-0000-0000-000000000001
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/email-summarizer.yaml
      AGENT_CAPABILITIES: "email-summarization,gmail-triage,outlook-mail,calendar-digest,meeting-agenda,reply-drafting,inbox-triage,social-signals-feed,social-publishing"
      # Run this bot on CODEX (its sandbox can shell out to run scripts/oshal-gmail.js,
      # which claude-code-as-root cannot). ADR-037 Phase 2. Overrides the *bot-env default.
      FORCE_LLM_PROVIDER: openai-codex
      FORCE_LLM_MODEL: gpt-5.5
      # Owns email: reads the per-user connector token (DATABASE_URL), decrypts
      # it (SESSION_SECRET, from *bot-env), and calls Gmail/Calendar. The OIDC
      # client creds power the Google refresh flow used by scripts/oshal-gmail.js.
      DATABASE_URL: ${BOT_DATABASE_URL:-postgresql://oshal_bot:oshal-bot-dev@oshal-db:5432/oshal}
      GOOGLE_CONNECT_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      GOOGLE_CONNECT_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Default mailbox so oshal-gmail.js resolves when >1 Google account is connected
      # (single-operator). Per-user dynamic scoping uses OSHAL_USER_SUB (multi-user follow-up).
      GMAIL_ACCOUNT: ${GMAIL_ACCOUNT:-}
      BOT_UI_LABEL: Email
      BOT_UI_URL: /api/email/inbox
      BOT_UI_ICON: "codicon codicon-mail"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - email-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  # ── OSHAL Developer — the dedicated platform-development specialist (ADR-081) ───
  # Owns ticketType 'oshal-dev' (superadmin-gated at dispatch). Works in its OWN clone
  # at /app/dev-repo (named volume; bot-entrypoint.sh clones/updates it from
  # OSHAL_DEV_REPO_URL at start) — deliberately NO host-repo mount: the live tree is
  # hot-swap-deployed, so the bot must never touch it (ADR-077's load-bearing isolation).
  # Push auth via OSHAL_DEV_REPO_TOKEN (ephemeral credential helper, never persisted).
  oshal-developer:
    <<: *bot-common
    container_name: oshal-local-oshal-developer
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: oshal-developer
      AGENT_ID: de000000-0000-0000-0000-000000000001
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/oshal-developer.yaml
      AGENT_CAPABILITIES: "platform-development,typescript,feature-slice-design,documentation-quality,codebase-indexing,self-hosting"
      # codex: the persona shells out constantly (git, npx tsc, vitest, docs-link-check).
      FORCE_LLM_PROVIDER: openai-codex
      FORCE_LLM_MODEL: gpt-5.5
      # The bot's own clone of the platform repo (configurable per deployment).
      # ADR-115: the TRUNK is this repo. The default pointed at the pre-cutover private
      # repo, which is now a frozen reference archive — the bot's self-development work
      # landed somewhere nothing ships from. Default to the trunk it actually develops.
      OSHAL_DEV_REPO_URL: ${OSHAL_DEV_REPO_URL:-https://github.com/emeraldcoastsystemsgroup/oshal.git}
      OSHAL_DEV_REPO_BRANCH: ${OSHAL_DEV_REPO_BRANCH:-main}
      OSHAL_DEV_REPO_TOKEN: ${OSHAL_DEV_REPO_TOKEN:-}
      # Dev runs stream for a long time legitimately: generous idle window + backstop.
      CODEX_INACTIVITY_TIMEOUT_MS: ${OSHAL_DEV_IDLE_TIMEOUT_MS:-600000}
      CODEX_MAX_DURATION_MS: ${OSHAL_DEV_MAX_DURATION_MS:-7200000}
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      - oshal-dev-repo:/app/dev-repo
      - oshal-developer-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

  # ── Jarvis Bot — the unified OSHAL Assistant as a FIRST-CLASS bot-node ──────────
  # Runs oshal-assistant (agent …0050) in the any-bot runtime (BOT_RUNTIME=bot-node, the *bot-env
  # default) so it executes inside the wrapper with a real agentic tool loop — NOT inline on the
  # controller (which can't round-trip tool_use, so its tools were ghosts). The orb surface posts to
  # this bot via BotNodeClient → http://jarvis-bot:5000/api/swarm-execute. Tools authorized in
  # agent_tools (the full set) execute here. claude-code provider (default) via mounted ~/.claude.
  # scripts + api-output mounted so cli tools like career_database (oshal-jobhunter.js query) resolve
  # the user's data. See jarvis-must-be-framework-bot + ADR-050 (route-orchestrator superseded).
  jarvis-bot:
    <<: *bot-common
    container_name: oshal-local-jarvis-bot
    expose: # internal-only since 2026-07-15 — see security note above x-bot-env
      - "5000"
    environment:
      <<: *bot-env
      BOT_NAME: oshal-assistant
      AGENT_ID: a0000000-0000-0000-0000-000000000050
      BOT_PERSONA_FILE: /app/ai-lab/bot-personas/oshal-assistant.yaml
      AGENT_CAPABILITIES: "intent-routing,cross-app-orchestration,answer-synthesis"
      # CODEX (not claude-code): the any-bot claude-code provider doesn't expose OSHAL framework
      # tools to the CLI session, so career_database stayed a ghost. Codex's sandbox CAN shell out
      # (CODEX_SANDBOX_MODE=danger-full-access), so Jarvis runs the mounted CLIs directly —
      # the same proven pattern as email-bot/home-bot/cloud-ops-bot. Overrides the *bot-env default.
      # Parameterised, default UNCHANGED. A deployment whose host has no ~/.codex/auth.json must run
      # this bot on another engine, and the only way to say so was to EDIT this line — which left
      # that box's git tree permanently dirty and made the documented core update
      # (`git reset --hard origin/main`, gated on a clean tree) silently destroy the setting, taking
      # the assistant down. Setting JARVIS_LLM_PROVIDER / JARVIS_LLM_MODEL in .env survives updates.
      # With both unset this renders byte-identical to the literals it replaces.
      FORCE_LLM_PROVIDER: ${JARVIS_LLM_PROVIDER:-openai-codex}
      FORCE_LLM_MODEL: ${JARVIS_LLM_MODEL:-gpt-5.5}
      DATABASE_URL: ${BOT_DATABASE_URL:-postgresql://oshal_bot:oshal-bot-dev@oshal-db:5432/oshal}
      # career_database tool (node scripts/oshal-jobhunter.js query) reads the user's jobs DB here.
      JOBHUNTER_STORE_ROOT: /app/output/career-hunter-data
      BOT_UI_LABEL: Assistant
      BOT_UI_URL: /cockpit/?app=jarvis
      BOT_UI_ICON: "codicon codicon-sparkle"
    volumes:
      - oshal_workspace:/app/workspace-shared:rw
      - ./ai-lab/bot-personas:/app/ai-lab/bot-personas:ro
      - ./config-seed:/app/config-seed:ro
      # CLI tools (oshal-jobhunter.js etc.) bind-mounted so tool iterations apply without a rebuild.
      - ./scripts:/app/scripts:ro
      # The bot-node runtime requires the any-bot server tree (utils/stores/controllers/services);
      # the image doesn't COPY it, so without this jarvis-bot crashes on a missing module.
      - ./any-bot/server:/app/any-bot/server:ro
      - *codex-auth-volume
      - *claude-auth-volume
      - *gemini-auth-volume
      - *claude-auth-json
      # Shared output volume = same career-hunter-data store + global config the api uses.
      - jarvis-output:/app/output
    depends_on:
      oshal-redis:
        condition: service_healthy
      oshal-db:
        condition: service_healthy
      oshal-api:
        condition: service_healthy

