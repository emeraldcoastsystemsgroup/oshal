# =============================================================================
# OSHAL Platform Stack (Kubernetes)
# =============================================================================
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Added Kubernetes manifests for OSHAL runtime stack (api, keycloak, postgres, redis, chromadb)
# 2 | maintainer@emeraldcoastsystemsgroup.com   | Fixed inline Keycloak realm ConfigMap termination so the imported JSON no longer contains a trailing YAML document separator
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: oshal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oshal-config
  namespace: oshal
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3456"
  OPENAI_CODEX_CALLBACK_PORT: "1455"

  CONFIG_OUTPUT_DIR: "/app/output"
  SHARED_WORKSPACE_ROOT: "/app/workspace-shared"
  CLINE_SHARED_WORKSPACE_ROOT: "/app/workspace-shared"

  MOCK_OIDC: "false"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_EXTERNAL_URL: "http://localhost:8080"
  KEYCLOAK_REALM: "oshal"
  KEYCLOAK_CLIENT_ID: "oshal-swarm"
  APP_URL: "http://localhost:3456"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  REDIS_URL: "redis://redis:6379"
  ENABLE_AGENT_SCHEDULER: "true"
  SCHEDULER_POLL_INTERVAL_MS: "15000"

  CHROMADB_URL: "http://chromadb:8000"
  RAG_INGESTION_ENDPOINT: ""
  PRESENTRON_ENDPOINT: "http://presentron:8080"

  LLM_MODEL: "claude-sonnet-4-5-20250929"
  SWARM_MODE: "single"
---
apiVersion: v1
kind: Secret
metadata:
  name: oshal-secrets
  namespace: oshal
type: Opaque
stringData:
  POSTGRES_DB: "keycloak"
  POSTGRES_USER: "keycloak"
  POSTGRES_PASSWORD: "REPLACE_ME"

  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_ME"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"

  ANTHROPIC_API_KEY: "REPLACE_ME"
  PRESENTRON_API_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oshal-keycloak-realm
  namespace: oshal
data:
  realm-export.json: |
    {
      "realm": "oshal",
      "enabled": true,
      "displayName": "OSHAL Swarm",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "sslRequired": "none",
      "accessTokenLifespan": 300,
      "accessTokenLifespanForImplicitFlow": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "offlineSessionIdleTimeout": 2592000,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "accessCodeLifespanLogin": 1800,
      "defaultSignatureAlgorithm": "RS256",
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Full administrative access to the swarm",
            "composite": false
          },
          {
            "name": "operator",
            "description": "Can execute swarm operations and manage configurations",
            "composite": false
          },
          {
            "name": "viewer",
            "description": "Read-only access to swarm status and configurations",
            "composite": false
          }
        ]
      },
      "clients": [
        {
          "clientId": "oshal-swarm",
          "name": "OSHAL Swarm Application",
          "description": "OAuth2/OIDC client for the OSHAL swarm system",
          "enabled": true,
          "publicClient": false,
          "secret": "changeme",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "http://localhost:3456",
          "baseUrl": "/",
          "redirectUris": [
            "http://localhost:3456/*"
          ],
          "webOrigins": [
            "http://localhost:3456"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access"
          ],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "realm_roles",
                "jsonType.label": "String",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "dev-admin",
          "email": "admin@oshal.local",
          "firstName": "Dev",
          "lastName": "Admin",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "admin",
            "default-roles-oshal"
          ]
        },
        {
          "username": "dev-operator",
          "email": "operator@oshal.local",
          "firstName": "Dev",
          "lastName": "Operator",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "operator123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "operator",
            "default-roles-oshal"
          ]
        },
        {
          "username": "dev-viewer",
          "email": "viewer@oshal.local",
          "firstName": "Dev",
          "lastName": "Viewer",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "viewer123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "viewer",
            "default-roles-oshal"
          ]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-output
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-workspace
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-workspace-shared
  namespace: oshal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oshal
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: oshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: KEYCLOAK_ADMIN_USER
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oshal-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME
              value: localhost
            - name: KC_HTTP_PORT
              value: "8080"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: realm
          configMap:
            name: oshal-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: oshal
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: oshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: oshal
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: oshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.4.24
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chroma-data
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: oshal
spec:
  selector:
    app: chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: oshal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do echo waiting for keycloak; sleep 2; done"]
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-chromadb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z chromadb 8000; do echo waiting for chromadb; sleep 2; done"]
      containers:
        - name: api-server
          image: oshal-api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3456
            - containerPort: 1455
          envFrom:
            - configMapRef:
                name: oshal-config
            - secretRef:
                name: oshal-secrets
          volumeMounts:
            - name: output
              mountPath: /app/output
            - name: workspace
              mountPath: /app/workspace
            - name: workspace-shared
              mountPath: /app/workspace-shared
          readinessProbe:
            httpGet:
              path: /health
              port: 3456
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3456
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: api-output
        - name: workspace
          persistentVolumeClaim:
            claimName: api-workspace
        - name: workspace-shared
          persistentVolumeClaim:
            claimName: api-workspace-shared
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: oshal
spec:
  selector:
    app: api-server
  ports:
    - name: http
      port: 3456
      targetPort: 3456
    - name: callback
      port: 1455
      targetPort: 1455
