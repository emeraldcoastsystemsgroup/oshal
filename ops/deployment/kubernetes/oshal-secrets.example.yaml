apiVersion: v1
kind: Secret
metadata:
  name: oshal-secrets
  namespace: oshal
type: Opaque
stringData:
  POSTGRES_DB: "keycloak"
  POSTGRES_USER: "keycloak"
  POSTGRES_PASSWORD: "replace-me"

  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "replace-me"
