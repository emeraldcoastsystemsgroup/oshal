# =============================================================================
# OSHAL any-bot Kubernetes Secrets Example
# =============================================================================
# CHANGE LOG
# -----------------------------------------------------------------------------
# SEQ                 | AUTHOR                      | DESCRIPTION
# -----------------------------------------------------------------------------
# 1 | maintainer@emeraldcoastsystemsgroup.com   | Added example secrets for any-bot API and Headscale gateway deployment
# 2 | maintainer@emeraldcoastsystemsgroup.com   | Replaced legacy any-bot runtime secrets with the converted OSHAL root runtime secret set
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: any-bot-secrets
  namespace: any-bot
type: Opaque
stringData:
  POSTGRES_DB: "oshal"
  POSTGRES_USER: "oshal_user"
  POSTGRES_PASSWORD: "replace-with-a-strong-postgres-password"
  REDIS_URL: "redis://redis:6379"
  ANTHROPIC_API_KEY: ""
  PRESENTRON_API_KEY: ""
  KEYCLOAK_CLIENT_SECRET: ""
  SESSION_SECRET: "replace-with-a-long-random-session-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: headscale-gateway-secrets
  namespace: any-bot
type: Opaque
stringData:
  TS_AUTHKEY: "replace-with-headscale-preauth-key"
