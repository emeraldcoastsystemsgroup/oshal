# =============================================================================
# Alertmanager config — routes swarm self-monitoring alerts into the RCA pipeline
# =============================================================================
# Every firing alert is webhooked to the swarm's own incident intake:
#   POST http://oshal-api:5000/api/alerts/alertmanager
# which opens an incident ticket -> incident-rca -> propose fix -> approve/close.
#
# Auth: the receiver is FAIL-CLOSED — with no ALERT_WEBHOOK_TOKEN it rejects every
# POST, so the whole ladder is silently unreachable without one. The token is read
# from a mounted file, never inlined here: scripts/monitoring-up.sh writes
# ALERT_WEBHOOK_TOKEN into the gitignored .env.alertmanager-token and mounts it at
# /etc/alertmanager/webhook-token. This file is tracked; the secret is not.
#
# Label contract (rewritten 2026-08-01): the target identity label is `container`.
# It used to be cAdvisor's `name`, which this deployment never emitted — see the
# header of ops/monitoring/prometheus.yml. Grouping and inhibition below key on
# `container`; keying on `name` silently grouped every alert into one bucket and
# inhibited nothing, because the label was absent on every series.
# =============================================================================

route:
  receiver: oshal-incident-intake
  # Group everything by alert + target so one ticket opens per distinct problem.
  group_by: ['alertname', 'container']
  group_wait: 30s
  group_interval: 5m
  # Re-send while still firing every 4h (the dedupe in the webhook prevents
  # duplicate tickets; this just keeps the alert state fresh).
  repeat_interval: 4h

receivers:
  - name: oshal-incident-intake
    webhook_configs:
      - url: 'http://oshal-api:5000/api/alerts/alertmanager'
        send_resolved: true
        # Bearer token for the fail-closed receiver guard. Kept OUT of git (see header).
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook-token

inhibit_rules:
  # If the whole container is down, suppress the noisier CPU/mem alerts for it.
  - source_matchers: ['alertname = SwarmContainerDown']
    target_matchers: ['alertname =~ "SwarmContainerHigh.*"']
    equal: ['container']
