  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;codex-visualization-widget-state&quot;,

  initialStateElement?.remove();

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    postToHost(&quot;height&quot;, {

          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

      return;
    }

        id = decodeURIComponent(href.slice(1));

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;oshal-models&#x27;);
    const content=root.querySelector(&#x27;#om-content&#x27;);
    const models=[
      {name:&#x27;Application suites&#x27;,type:&#x27;APP FIRST&#x27;,line:&#x27;Choose a tool. Stay inside its complete workspace.&#x27;,benefit:&#x27;Familiar and easy to learn.&#x27;,cost:&#x27;Cross-app work means switching applications.&#x27;,icon:&#x27;layout-panel-left&#x27;},
      {name:&#x27;Project rooms&#x27;,type:&#x27;CONTEXT FIRST&#x27;,line:&#x27;Bring apps, data, people and work into one room.&#x27;,benefit:&#x27;One context across several apps.&#x27;,cost:&#x27;Users must decide where work belongs.&#x27;,icon:&#x27;folder-kanban&#x27;},
      {name:&#x27;Request desk&#x27;,type:&#x27;INTENT FIRST&#x27;,line:&#x27;Ask for an outcome. Approve a structured plan.&#x27;,benefit:&#x27;Less navigation and less setup knowledge.&#x27;,cost:&#x27;Must make scope, permissions and actions explicit.&#x27;,icon:&#x27;messages-square&#x27;},
      {name:&#x27;Work conveyor&#x27;,type:&#x27;WORK FIRST&#x27;,line:&#x27;Every request moves from setup to a usable result.&#x27;,benefit:&#x27;Delegated work remains visible.&#x27;,cost:&#x27;Browsing an app is secondary to managing work.&#x27;,icon:&#x27;columns-3&#x27;},
      {name:&#x27;Visual workbench&#x27;,type:&#x27;RELATIONSHIPS FIRST&#x27;,line:&#x27;Connect an app, its inputs, its trigger and its output.&#x27;,benefit:&#x27;Dependencies and reuse are visible.&#x27;,cost:&#x27;A canvas adds complexity for occasional users.&#x27;,icon:&#x27;workflow&#x27;},
      {name:&#x27;Personal computer&#x27;,type:&#x27;TOOLS FIRST&#x27;,line:&#x27;Open apps and platform tools side by side.&#x27;,benefit:&#x27;Multitask without losing app context.&#x27;,cost:&#x27;Window management needs careful small-screen behavior.&#x27;,icon:&#x27;panels-top-left&#x27;},
      {name:&#x27;Living notebooks&#x27;,type:&#x27;ARTIFACT FIRST&#x27;,line:&#x27;The brief, setup and results live in one working document.&#x27;,benefit:&#x27;Context and history stay together.&#x27;,cost:&#x27;Large collections need strong document discovery.&#x27;,icon:&#x27;notebook-pen&#x27;},
      {name:&#x27;Personal agenda&#x27;,type:&#x27;TIME FIRST&#x27;,line:&#x27;Organize what runs next and what needs review today.&#x27;,benefit:&#x27;Recurring work is easy to understand.&#x27;,cost:&#x27;Unscheduled exploration is less prominent.&#x27;,icon:&#x27;calendar-days&#x27;},
      {name:&#x27;Resource explorer&#x27;,type:&#x27;OBJECTS FIRST&#x27;,line:&#x27;Inspect apps, connections and jobs as linked records.&#x27;,benefit:&#x27;Precise control and fast inspection.&#x27;,cost:&#x27;Higher learning effort for nontechnical users.&#x27;,icon:&#x27;table-properties&#x27;},
      {name:&#x27;Focused journeys&#x27;,type:&#x27;NEXT ACTION FIRST&#x27;,line:&#x27;One decision at a time, with a visible path back.&#x27;,benefit:&#x27;Low cognitive load and clear recovery.&#x27;,cost:&#x27;Experienced users need saved routines and shortcuts.&#x27;,icon:&#x27;route&#x27;}
    ];
    const apps=[
      {id:&#x27;trading&#x27;,name:&#x27;Trading&#x27;,icon:&#x27;chart-no-axes-combined&#x27;,desc:&#x27;Research markets and test ideas&#x27;,job:&#x27;Nightly market research&#x27;,sources:[&#x27;Market archive&#x27;,&#x27;Research folder&#x27;],artifact:&#x27;Research note&#x27;,finding:&#x27;No candidate passed the acceptance checks in this sample cycle.&#x27;,next:[&#x27;Keep the evidence and rejected candidates.&#x27;,&#x27;Revise the next experiment, then run another cycle.&#x27;]},
      {id:&#x27;create&#x27;,name:&#x27;Create&#x27;,icon:&#x27;palette&#x27;,desc:&#x27;Make documents, slides and media&#x27;,job:&#x27;Daily content digest&#x27;,sources:[&#x27;Brand folder&#x27;,&#x27;Shared library&#x27;],artifact:&#x27;Content digest&#x27;,finding:&#x27;The draft is ready for review. Nothing has been published.&#x27;,next:[&#x27;Review the draft and its source assets.&#x27;,&#x27;Carry revisions into the next cycle.&#x27;]},
      {id:&#x27;learning&#x27;,name:&#x27;Learning&#x27;,icon:&#x27;graduation-cap&#x27;,desc:&#x27;Build a personal learning routine&#x27;,job:&#x27;Tomorrow’s lesson pack&#x27;,sources:[&#x27;Course library&#x27;,&#x27;Shared library&#x27;],artifact:&#x27;Lesson pack&#x27;,finding:&#x27;The lesson pack is ready, with source material and practice prompts.&#x27;,next:[&#x27;Review the scope and adjust the difficulty.&#x27;,&#x27;Use feedback to prepare the next lesson.&#x27;]},
      {id:&#x27;crm&#x27;,name:&#x27;Federal CRM&#x27;,icon:&#x27;building-2&#x27;,desc:&#x27;Explore opportunities and relationships&#x27;,job:&#x27;Morning opportunity brief&#x27;,sources:[&#x27;Opportunity feed&#x27;,&#x27;Account library&#x27;],artifact:&#x27;Opportunity brief&#x27;,finding:&#x27;The brief is prepared. No messages or submissions have been sent.&#x27;,next:[&#x27;Review sources and select opportunities to pursue.&#x27;,&#x27;Refine the next brief’s filters.&#x27;]}
    ];
    const stageNames=[&#x27;Applications&#x27;,&#x27;Connections&#x27;,&#x27;Automation&#x27;,&#x27;Results&#x27;];
    const stepIcons=[&#x27;layout-grid&#x27;,&#x27;plug&#x27;,&#x27;calendar-clock&#x27;,&#x27;file-check-2&#x27;];
    const fresh=()=&gt;({source:0,connected:false,cadence:&#x27;Every night&#x27;,time:&#x27;02:00&#x27;,review:true,enabled:false,paused:false,runs:0,reviewed:false,editing:false});
    const sessions=models.map(()=&gt;({app:&#x27;trading&#x27;,step:0,home:true,journey:&#x27;launch&#x27;,appTab:&#x27;Workspace&#x27;,repaired:false,work:{trading:fresh(),create:fresh(),learning:fresh(),crm:fresh()},platform:false,platformTab:&#x27;access&#x27;,notice:&#x27;&#x27;}));
    const settings={compact:false,showOwnership:true};
    let selected=-1;
    const saved=window.openai&amp;&amp;window.openai.widgetState;
    if(saved&amp;&amp;saved.privateContent&amp;&amp;saved.privateContent.version===2&amp;&amp;Number.isInteger(saved.privateContent.model))selected=Math.max(-1,Math.min(9,saved.privateContent.model));
    const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const ico=n=&gt;&#x27;&lt;i data-lucide=&quot;&#x27;+n+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
    const S=()=&gt;sessions[selected];
    const A=()=&gt;apps.find(a=&gt;a.id===S().app);
    const W=()=&gt;S().work[S().app];
    const tag=(label,good=false)=&gt;&#x27;&lt;span class=&quot;o-tag&#x27;+(good?&#x27; o-good&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+esc(label)+&#x27;&lt;/span&gt;&#x27;;
    const button=(label,action,extra=&#x27;&#x27;,kind=&#x27;&#x27;)=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;o-action cursor-interaction &#x27;+kind+&#x27;&quot; data-do=&quot;&#x27;+action+&#x27;&quot; &#x27;+extra+&#x27;&gt;&#x27;+label+&#x27;&lt;/button&gt;&#x27;;
    const action=(label,action,extra=&#x27;&#x27;)=&gt;button(label,action,extra,&#x27;o-primary&#x27;);
    const jump=(n,label,kind=&#x27;&#x27;)=&gt;button(label||stageNames[n],&#x27;step&#x27;,&#x27;data-step=&quot;&#x27;+n+&#x27;&quot;&#x27;,kind);
    const head=(label,title,subtitle=&#x27;&#x27;)=&gt;&#x27;&lt;div class=&quot;o-contenthead&quot;&gt;&lt;div class=&quot;o-label&quot;&gt;&#x27;+label+&#x27;&lt;/div&gt;&lt;h2&gt;&#x27;+title+&#x27;&lt;/h2&gt;&#x27;+(subtitle?&#x27;&lt;p&gt;&#x27;+subtitle+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
    const cadence=()=&gt;W().cadence+&#x27; at &#x27;+W().time+&#x27; · America/Chicago&#x27;;
    const status=()=&gt;W().runs?&#x27;Result ready&#x27;:W().enabled?(W().paused?&#x27;Paused&#x27;:&#x27;Scheduled&#x27;):W().connected?&#x27;Ready to schedule&#x27;:&#x27;Needs connection&#x27;;
    const summary=()=&gt;&#x27;&lt;dl class=&quot;o-summary&quot;&gt;&lt;dt&gt;Application&lt;/dt&gt;&lt;dd&gt;&#x27;+A().name+&#x27;&lt;/dd&gt;&lt;dt&gt;Connection&lt;/dt&gt;&lt;dd&gt;&#x27;+A().sources[W().source]+(W().connected?&#x27; · read only&#x27;:&#x27; · not attached&#x27;)+&#x27;&lt;/dd&gt;&lt;dt&gt;Schedule&lt;/dt&gt;&lt;dd&gt;&#x27;+(W().enabled?esc(cadence()):&#x27;Not enabled&#x27;)+&#x27;&lt;/dd&gt;&lt;dt&gt;Result&lt;/dt&gt;&lt;dd&gt;&#x27;+A().artifact+&#x27; · private&lt;/dd&gt;&lt;/dl&gt;&#x27;;
    function save(){try{if(window.openai&amp;&amp;window.openai.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{design:selected&lt;0?&#x27;Gallery&#x27;:models[selected].name},privateContent:{version:2,model:selected}})).catch(()=&gt;{});}catch(_){}}
    function mini(n){
      const panel=(text,more=&#x27;&#x27;)=&gt;&#x27;&lt;div class=&quot;mini-panel&quot;&gt;&#x27;+text+more+&#x27;&lt;/div&gt;&#x27;;
      const bar=&#x27;&lt;div class=&quot;mini-bar&quot;&gt;&lt;/div&gt;&#x27;,lines=&#x27;&lt;div class=&quot;mini-lines&quot;&gt;&lt;/div&gt;&#x27;,chip=t=&gt;&#x27;&lt;div class=&quot;mini-chip&quot;&gt;&#x27;+t+&#x27;&lt;/div&gt;&#x27;;
      return &#x27;&lt;div class=&quot;o-thumbnail mini&#x27;+String(n+1).padStart(2,&#x27;0&#x27;)+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&#x27;+[
        panel(&#x27;OSHAL&#x27;,chip(&#x27;Trading&#x27;)+lines)+panel(&#x27;Trading workspace&#x27;,bar+chip(&#x27;Connection · schedule · results&#x27;)+lines),
        bar+panel(&#x27;Apps&#x27;,chip(&#x27;Trading&#x27;)+lines)+panel(&#x27;Shared data&#x27;,chip(&#x27;Market archive&#x27;)+lines)+panel(&#x27;Deliverables&#x27;,chip(&#x27;Research note&#x27;)+lines),
        chip(&#x27;Research markets each night&#x27;)+panel(&#x27;Plan for your approval&#x27;,lines+chip(&#x27;Confirm connection&#x27;))+bar,
        [&#x27;Setup&#x27;,&#x27;Scheduled&#x27;,&#x27;Working&#x27;,&#x27;Review&#x27;].map((t,i)=&gt;panel(t,i===0?chip(&#x27;Research&#x27;)+lines:&#x27;&#x27;)).join(&#x27;&#x27;),
        [&#x27;App&#x27;,&#x27;Data&#x27;,&#x27;Trigger&#x27;,&#x27;Result&#x27;].map(t=&gt;panel(t,chip(&#x27;↗&#x27;))).join(&#x27;&#x27;),
        panel(&#x27;Trading&#x27;,bar+lines)+panel(&#x27;Connections&#x27;,chip(&#x27;Market archive&#x27;)+lines),
        &#x27;&lt;b&gt;Market research notebook&lt;/b&gt;&#x27;+panel(&#x27;01  Application&#x27;,chip(&#x27;Trading&#x27;))+panel(&#x27;02  Connection&#x27;,chip(&#x27;Market archive&#x27;))+lines,
        [&#x27;Mon&#x27;,&#x27;Tue&#x27;,&#x27;Wed&#x27;,&#x27;Thu&#x27;,&#x27;Fri&#x27;].map((t,i)=&gt;&#x27;&lt;div class=&quot;mini-group&quot;&gt;&#x27;+t+(i===1||i===3?chip(&#x27;Research&#x27;):bar)+&#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;),
        panel(&#x27;Name             State&#x27;,chip(&#x27;Trading       Ready&#x27;)+lines+lines)+panel(&#x27;Properties&#x27;,lines+chip(&#x27;Linked connection&#x27;)),
        &#x27;&lt;div class=&quot;mini-group&quot;&gt;&#x27;+chip(&#x27;1  App&#x27;)+chip(&#x27;2  Data&#x27;)+bar+&#x27;&lt;/div&gt;&#x27;+panel(&#x27;Connect your data&#x27;,lines+chip(&#x27;Continue&#x27;))
      ][n]+&#x27;&lt;/div&gt;&#x27;;
    }
    function gallery(){return &#x27;&lt;div class=&quot;o-intro&quot;&gt;&lt;div&gt;&lt;div class=&quot;o-label&quot;&gt;OSHAL / Interaction models&lt;/div&gt;&lt;h1&gt;Ten different ways to use one platform.&lt;/h1&gt;&lt;p&gt;Distinct landing pages. Four journeys: use an app, review work, create a routine, repair a connection.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;o-tag&quot;&gt;Interactive studies · sample data&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;o-gallery&quot;&gt;&#x27;+models.map((m,i)=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;o-choice cursor-interaction&quot; data-do=&quot;model&quot; data-model=&quot;&#x27;+i+&#x27;&quot;&gt;&#x27;+mini(i)+&#x27;&lt;span class=&quot;o-caption&quot;&gt;&lt;span class=&quot;o-label&quot;&gt;&#x27;+String(i+1).padStart(2,&#x27;0&#x27;)+&#x27; / &#x27;+m.type+&#x27;&lt;/span&gt;&lt;span class=&quot;o-row&quot;&gt;&lt;b&gt;&#x27;+m.name+&#x27;&lt;/b&gt;&#x27;+ico(&#x27;arrow-up-right&#x27;)+&#x27;&lt;/span&gt;&lt;span class=&quot;o-micro&quot;&gt;&#x27;+m.line+&#x27;&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}
    function top(context,options=&#x27;&#x27;){return &#x27;&lt;header class=&quot;o-top&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;o-brand cursor-interaction&quot; data-do=&quot;home&quot; aria-label=&quot;Return to this design’s landing page&quot;&gt;&lt;span class=&quot;o-mark&quot;&gt;o&lt;/span&gt;oshal&lt;/button&gt;&lt;span class=&quot;o-micro&quot;&gt;&#x27;+context+&#x27;&lt;/span&gt;&lt;span class=&quot;o-spacer&quot;&gt;&lt;/span&gt;&#x27;+options+button(ico(&#x27;settings-2&#x27;)+&#x27;Platform&#x27;,&#x27;platform&#x27;,&#x27;&#x27;,&#x27;o-quiet&#x27;)+&#x27;&lt;span class=&quot;o-avatar&quot; aria-label=&quot;Taylor&quot;&gt;T&lt;/span&gt;&lt;/header&gt;&#x27;;}
    function footer(){return &#x27;&lt;footer class=&quot;o-status&quot;&gt;&lt;span&gt;Sample data · local preview&lt;/span&gt;&lt;span class=&quot;o-spacer&quot;&gt;&lt;/span&gt;&#x27;+(settings.showOwnership?&#x27;&lt;span&gt;&lt;strong&gt;App:&lt;/strong&gt; &#x27;+A().name+&#x27;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Platform:&lt;/strong&gt; access, execution, connections&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/footer&gt;&#x27;;}
    function appChoices(){return &#x27;&lt;div class=&quot;o-appchoices&quot;&gt;&#x27;+apps.map(a=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;o-app cursor-interaction&quot; data-do=&quot;app&quot; data-app=&quot;&#x27;+a.id+&#x27;&quot;&gt;&#x27;+ico(a.icon)+&#x27;&lt;span class=&quot;o-go&quot;&gt;&#x27;+ico(&#x27;arrow-up-right&#x27;)+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+a.name+&#x27;&lt;/strong&gt;&lt;small&gt;&#x27;+a.desc+&#x27;&lt;/small&gt;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}
